site_name: 今日小豬 Wiki
site_description: 每天抽一隻，慢慢養成一整座豬圈；玩家玩法、永久豬籍、EX、後廚與管理維護都在這裡
site_url: https://casama233.github.io/astrbot_plugin_rollpig/
repo_url: https://github.com/casama233/astrbot_plugin_rollpig
repo_name: casama233/astrbot_plugin_rollpig
edit_uri: edit/main/docs/
copyright: "今日小豬 · 增強版"

# docs/README.md remains the repository-facing documentation index. The Wiki has
# its own docs/index.md landing page, so exclude the former explicitly
# instead of letting MkDocs auto-drop it with a strict-mode warning.
exclude_docs: |
  README.md

# Keep repository-facing docs readable on GitHub while adapting their few
# intentional links outside docs/ for the GitHub Pages build.
hooks:
  - docs/wiki_hooks.py

nav:
  - 首頁: index.md
  - 玩家指南:
      - 30 秒開始: getting-started/index.md
      - 常用指令: COMMANDS.md
      - 玩法總覽: gameplay/index.md
      - 收藏與保底: gameplay/collection-pity.md
      - EX 成長: gameplay/ex-growth.md
      - 烤群友與次日保護: gameplay/roast-outcomes.md
      - 能量、補貨與添柴: gameplay/roast-charge.md
      - 豬圈日報: gameplay/daily-report.md
      - 常見問題: troubleshooting/index.md
  - 管理與資源:
      - 配置參考: CONFIGURATION.md
      - 資源管理: RESOURCE-MANAGEMENT.md
      - 備份與恢復: OPERATIONS.md
      - 管理面板排錯: troubleshooting/admin.md
      - Discord 指令選單: troubleshooting/discord.md
      - Marketplace: MARKETPLACE.md
      - 豬源相容性: RESOURCE-SOURCE-COMPATIBILITY.md
      - 豬源維護: RESOURCE-SOURCE-MAINTENANCE.md
  - 創作與開發:
      - 製作與投稿: creators/index.md
      - 文案風格: COPY-STYLE.md
      - 架構總覽: ARCHITECTURE.md
      - 發版維護: RELEASE-MAINTENANCE.md
      - 收藏身份規則: COLLECTION-IDENTITY.md
      - EX 差分規則: EX-VARIANTS.md
      - 烤箱能量規則: ROAST-CHARGES.md
      - 預約規則: ROAST-RESERVATIONS.md
      - 日報規則: DAILY-REPORT.md
      - 參與開發: https://github.com/casama233/astrbot_plugin_rollpig/blob/main/CONTRIBUTING.md
      - 版本記錄: https://github.com/casama233/astrbot_plugin_rollpig/blob/main/CHANGELOG.md

# Material 負責搜尋與手機導覽；共用樣式與互動各只有一個入口，
# 方便後續升級主題而不 fork 上游模板。Wiki 視覺只維護深色 slate，
# 避免亮色 Material shell 與深色 Piggy 元件混搭成兩套互相衝突的主題。
theme:
  name: material
  language: zh
  logo: assets/plugin-logo.png
  favicon: assets/plugin-logo.png
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    scheme: slate

plugins:
  - search:
      lang:
        - zh
        - en
      jieba_dict_user: docs/search-terms.txt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

extra_css:
  - stylesheets/wiki.css

extra_javascript:
  - javascripts/wiki.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/casama233/astrbot_plugin_rollpig
      name: GitHub
