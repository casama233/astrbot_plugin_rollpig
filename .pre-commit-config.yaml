repos:
  - repo: local
    hooks:
      - id: apply-dual-release-channel-patch
        name: apply dual release channel patch
        entry: python scripts/apply_dual_release_channel_patch.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=10240"]
