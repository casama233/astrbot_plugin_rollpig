repos:
  - repo: local
    hooks:
      - id: compile-rollpig-plus
        name: compile rollpig_plus source
        entry: python -m compileall -q main.py updater.py identity_migration.py services storage
        language: python
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=10240"]
