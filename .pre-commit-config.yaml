repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=10240"]
  - repo: local
    hooks:
      - id: prepare-v3116-release
        name: prepare v3.11.6 release
        entry: python scripts/prepare_release_3116.py
        language: system
        pass_filenames: false
        always_run: true
