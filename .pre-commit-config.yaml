repos:
  - repo: local
    hooks:
      - id: build-rollpig-plus
        name: build rollpig_plus v3.2.0 migration
        entry: python scripts/build_rollpig_plus.py
        language: python
        pass_filenames: false
        always_run: true
      - id: test-rollpig-plus
        name: test rollpig_plus migration and regressions
        entry: python -m pytest -q
        language: python
        additional_dependencies:
          - pytest
          - "Pillow>=10.0.0"
          - "httpx>=0.27.0,<1.0.0"
        pass_filenames: false
        always_run: true
      - id: compile-rollpig-plus
        name: compile rollpig_plus source
        entry: python -m compileall -q main.py updater.py identity_migration.py services storage
        language: python
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=10240"]
