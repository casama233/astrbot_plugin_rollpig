repos:
  - repo: local
    hooks:
      - id: test-rollpig-plus-full
        name: test full rollpig_plus regression suite
        entry: python -m pytest -q
        language: python
        additional_dependencies:
          - pytest
          - "Pillow>=10.0.0"
          - "httpx>=0.27.0,<1.0.0"
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=10240"]
