# AstrBot RollPig resource protocol v1.
# Install this file beside the existing 1Panel proxy location files.
location ^~ /astrbot-rollpig/v1/ {
    root /www/sites/curryudon.top/index;

    # Compatibility gate, not cryptographic authentication. Open-source clients
    # can reproduce these headers; use a private token upstream for a closed source.
    if ($http_user_agent !~* "^AstrBot-RollPig/[0-9]+\.[0-9]+\.[0-9]+") {
        return 403;
    }
    if ($http_x_rollpig_client != "astrbot_plugin_rollpig_plus") {
        return 403;
    }
    if ($http_x_rollpig_protocol != "1") {
        return 403;
    }

    limit_except GET HEAD {
        deny all;
    }
    try_files $uri =404;

    add_header X-RollPig-Source "astrbot-v1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Vary "User-Agent, X-RollPig-Client, X-RollPig-Protocol" always;
}
