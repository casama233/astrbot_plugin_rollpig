# Public submission and private maintainer review API.
location ^~ /astrbot-rollpig/api/ {
    if ($http_user_agent !~* "^AstrBot-RollPig/[0-9]+\.[0-9]+\.[0-9]+") {
        return 403;
    }
    if ($http_x_rollpig_client != "astrbot_plugin_rollpig_plus") {
        return 403;
    }
    if ($http_x_rollpig_protocol != "1") {
        return 403;
    }

    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:17841/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-RollPig-Source "astrbot-review-v1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
}
