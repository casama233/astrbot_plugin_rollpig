name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.release-gate.outputs.publish }}
      tested_sha: ${{ steps.release-gate.outputs.tested_sha }}
    steps:
      - name: Check out the exact CI-tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Decide whether this tested commit is releasable
        id: release-gate
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "tested_sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"

          if [[ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]]; then
            echo "checked-out revision does not match the successful CI revision" >&2
            exit 1
          fi

          git fetch origin main --tags --force
          if [[ "$(git rev-parse origin/main)" != "$TESTED_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI result: origin/main moved past $TESTED_SHA"
            exit 0
          fi

          if git diff-tree --root -m --no-commit-id --name-only -r "$TESTED_SHA" \
            | sort -u \
            | grep -Fxq metadata.yaml; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "The current, successful main commit changes metadata.yaml; release is authorized."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Successful main CI did not change metadata.yaml; no release is needed."
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact CI-tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.tested_sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Revalidate the tested main revision
        env:
          TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$TESTED_SHA" ]]

      - name: Resolve stable release metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          text = Path('metadata.yaml').read_text(encoding='utf-8')

          def field(name: str) -> str:
              match = re.search(
                  rf'^{re.escape(name)}:\s*["\x27]?([^"\x27\n]+?)["\x27]?\s*$',
                  text,
                  re.MULTILINE,
              )
              if not match:
                  raise SystemExit(f'metadata.yaml missing {name}')
              return match.group(1).strip()

          version = field('version')
          plugin_name = field('name')
          display_name = field('display_name')
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('metadata.yaml must contain a stable x.y.z version')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+', plugin_name):
              raise SystemExit('metadata.yaml contains an unsafe plugin name')

          print(f'version={version}')
          print(f'tag=v{version}')
          print(f'plugin_name={plugin_name}')
          print(f'display_name={display_name}')
          print(f'archive={plugin_name}-v{version}.zip')
          PY

      - name: Enforce release changelog and Wiki contract
        run: python scripts/maintenance_contract.py release

      - name: Check whether release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh existing stable GitHub Release notes
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          notes_file=".github/release-v${VERSION}.md"
          if [[ -f "$notes_file" ]]; then
            gh release edit "$TAG" \
              --title "$DISPLAY_NAME v$VERSION" \
              --notes-file "$notes_file"
          fi

      - name: Build release archive and checksum
        if: steps.existing.outputs.exists == 'false'
        env:
          PLUGIN_NAME: ${{ steps.meta.outputs.plugin_name }}
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          mkdir -p "dist/$PLUGIN_NAME"
          rsync -a ./ "dist/$PLUGIN_NAME/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude 'dist/' \
            --exclude 'tests/' \
            --exclude 'scripts/' \
            --exclude 'deploy/' \
            --exclude 'source_service/' \
            --exclude 'node_modules/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '.pre-commit-config.yaml' \
            --exclude 'CONTRIBUTING.md' \
            --exclude 'resource/font/HanyiYongZiXiaoXiongMaoFan.ttf' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'plugin_data/'

          python scripts/prepare_install_bundle.py "dist/$PLUGIN_NAME"
          python - <<PY
          import json
          from pathlib import Path
          root = Path("dist/$PLUGIN_NAME/resource")
          pigs = json.loads((root / "pig.json").read_text(encoding="utf-8-sig"))
          images = [p for p in (root / "image").iterdir() if p.is_file()]
          assert len(pigs) == 22, len(pigs)
          assert len(images) == 22, len(images)
          PY

          test -f "dist/$PLUGIN_NAME/resource/font/荆南麦圆体.otf"
          (cd dist && zip -qr "$ARCHIVE" "$PLUGIN_NAME")

          archive_size=$(stat -c%s "dist/$ARCHIVE")
          marketplace_limit=16000000
          echo "Release archive size: $archive_size bytes"
          if [ "$archive_size" -gt "$marketplace_limit" ]; then
            echo "::error::Release archive exceeds AstrBot marketplace limit: $archive_size > $marketplace_limit bytes (16 MB)"
            exit 1
          fi

          (cd dist && sha256sum "$ARCHIVE" > SHA256SUMS)

      - name: Publish stable GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHIVE: ${{ steps.meta.outputs.archive }}
          TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
        run: |
          notes_file=".github/release-v${VERSION}.md"
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$TAG" \
            "dist/$ARCHIVE" \
            "dist/SHA256SUMS" \
            --target "$TESTED_SHA" \
            --title "$DISPLAY_NAME v$VERSION" \
            "${notes_args[@]}"
