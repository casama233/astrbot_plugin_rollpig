name: Release

on:
  push:
    branches:
      - main
    paths:
      - metadata.yaml

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve stable release metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          text = Path('metadata.yaml').read_text(encoding='utf-8')

          def field(name: str) -> str:
              match = re.search(
                  rf'^{re.escape(name)}:\s*["\x27]?([^"\x27\n]+?)["\x27]?\s*$',
                  text,
                  re.MULTILINE,
              )
              if not match:
                  raise SystemExit(f'metadata.yaml missing {name}')
              return match.group(1).strip()

          version = field('version')
          plugin_name = field('name')
          display_name = field('display_name')
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('metadata.yaml must contain a stable x.y.z version')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+', plugin_name):
              raise SystemExit('metadata.yaml contains an unsafe plugin name')

          print(f'version={version}')
          print(f'tag=v{version}')
          print(f'plugin_name={plugin_name}')
          print(f'display_name={display_name}')
          print(f'archive={plugin_name}-v{version}.zip')
          PY

      - name: Check whether release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release archive and checksum
        if: steps.existing.outputs.exists == 'false'
        env:
          PLUGIN_NAME: ${{ steps.meta.outputs.plugin_name }}
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          mkdir -p "dist/$PLUGIN_NAME"
          rsync -a ./ "dist/$PLUGIN_NAME/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude 'dist/' \
            --exclude 'tests/' \
            --exclude 'scripts/' \
            --exclude 'deploy/' \
            --exclude 'source_service/' \
            --exclude 'node_modules/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '.pre-commit-config.yaml' \
            --exclude 'CONTRIBUTING.md' \
            --exclude 'resource/font/HanyiYongZiXiaoXiongMaoFan.ttf' \
            --exclude 'resource/font/荆南麦圆体.otf' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'plugin_data/'
          (cd dist && zip -qr "$ARCHIVE" "$PLUGIN_NAME")

          archive_size=$(stat -c%s "dist/$ARCHIVE")
          marketplace_limit=16000000
          echo "Release archive size: $archive_size bytes"
          if [ "$archive_size" -gt "$marketplace_limit" ]; then
            echo "::error::Release archive exceeds AstrBot marketplace limit: $archive_size > $marketplace_limit bytes (16 MB)"
            exit 1
          fi

          (cd dist && sha256sum "$ARCHIVE" > SHA256SUMS)

      - name: Publish stable GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          notes_file=".github/release-v${VERSION}.md"
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$TAG" \
            "dist/$ARCHIVE" \
            "dist/SHA256SUMS" \
            --target "$GITHUB_SHA" \
            --title "$DISPLAY_NAME v$VERSION" \
            "${notes_args[@]}"
