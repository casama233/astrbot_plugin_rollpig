name: Integrate Mention Layout

on:
  push:
    branches:
      - feat/piggy-copy-polish
    paths:
      - .github/workflows/integrate-mention-copy.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/piggy-copy-polish
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cherry-pick validated mention layout commits
        run: |
          git fetch origin 552659b2d4dd22325df820b9c69b5bd508f0ed00 140587b3a619c8b83358a263c88bbd8402600d03 d1b7082069021e496920f998329897e7fc6de4d8
          git cherry-pick 552659b2d4dd22325df820b9c69b5bd508f0ed00
          git cherry-pick 140587b3a619c8b83358a263c88bbd8402600d03
          git cherry-pick d1b7082069021e496920f998329897e7fc6de4d8
          git push origin HEAD:feat/piggy-copy-polish
