name: v3.7.0 Release Contract Fix

on:
  push:
    branches:
      - release/v3.7.0-final
    paths:
      - scripts/bump_v370_release_contract_tests.py
      - .github/workflows/v370-release-contract-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.7.0-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Apply exact version-contract patch
        run: python scripts/bump_v370_release_contract_tests.py
      - name: Verify affected contracts
        run: pytest -q tests/test_identity_migration_plus.py tests/test_source_regressions.py tests/test_v312_release_contract.py
      - name: Commit only release-contract tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_identity_migration_plus.py tests/test_source_regressions.py tests/test_v312_release_contract.py
          git diff --cached --check
          git commit -m "test: bump release contracts to v3.7.0"
          git push origin HEAD:release/v3.7.0-final
