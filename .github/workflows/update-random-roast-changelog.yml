name: Update random roast changelog

on:
  push:
    branches:
      - fix/random-roast-inline-target-copy
    paths:
      - .github/workflows/update-random-roast-changelog.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/random-roast-inline-target-copy
      - name: Update Unreleased and remove helper workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          old = "## 未發佈\n\n- 暂无。"
          new = (
              "## 未發佈\n\n"
              "- 随机烤群友：命中提示改为先单独标识指令发起人，再在随机转盘句内 @ 被烤对象，"
              "避免两个身份挤在消息开头而难以分辨。"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one Unreleased placeholder, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/update-random-roast-changelog.yml
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/update-random-roast-changelog.yml
          git commit -m "docs: record random roast mention copy fix"
          git push
