name: Import Safe Copy Polish Files

on:
  push:
    branches:
      - feat/piggy-copy-polish-mainline
    paths:
      - .github/workflows/import-copy-safe-files.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mainline integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/piggy-copy-polish-mainline
          fetch-depth: 0

      - name: Import files untouched by main since copy-polish fork
        run: |
          git fetch origin feat/piggy-copy-polish
          git checkout origin/feat/piggy-copy-polish -- \
            docs/COPY-STYLE.md \
            legacy_main.py \
            message_layout.py \
            mkdocs.yml \
            permanent_collection_feature.py \
            resource/pig.json \
            services/roast_service.py \
            tests/test_copy_voice_contract.py \
            tests/test_message_layout.py

      - name: Commit safe imports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/COPY-STYLE.md legacy_main.py message_layout.py mkdocs.yml permanent_collection_feature.py resource/pig.json services/roast_service.py tests/test_copy_voice_contract.py tests/test_message_layout.py
          git commit -m "content: import non-overlapping Piggy voice polish"
          git push origin HEAD:feat/piggy-copy-polish-mainline
