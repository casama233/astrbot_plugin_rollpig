name: AstrBot Market Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"

jobs:
  official-market-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Clone current AstrBot and official market validator
        run: |
          git clone --depth 1 --branch master https://github.com/AstrBotDevs/AstrBot .cache/AstrBot
          git clone --depth 1 --branch main https://github.com/AstrBotDevs/AstrBot_Plugins_Collection .cache/PluginCollection

      - name: Install AstrBot dependencies
        run: python -m pip install -r .cache/AstrBot/requirements.txt

      - name: Build isolated market record
        run: |
          cat > .cache/rollpig-market-smoke.json <<'JSON'
          {
            "astrbot_plugin_rollpig_plus": {
              "name": "astrbot_plugin_rollpig_plus",
              "display_name": "今日小豬 · 增強版",
              "desc": "AstrBot market smoke-test record",
              "version": "3.2.1",
              "author": "casama233",
              "repo": "https://github.com/casama233/astrbot_plugin_rollpig"
            }
          }
          JSON

      - name: Run official AstrBot plugin smoke validator
        run: |
          python .cache/PluginCollection/scripts/validate_plugins/run.py \
            --plugins-json .cache/rollpig-market-smoke.json \
            --plugin-name astrbot_plugin_rollpig_plus \
            --astrbot-path .cache/AstrBot \
            --report-path astrbot-market-smoke-report.json \
            --max-workers 1

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: astrbot-market-smoke-report
          path: astrbot-market-smoke-report.json
          if-no-files-found: warn
