name: AstrBot Market Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "metadata.yaml"
      - "requirements.txt"
      - "_conf_schema.json"
      - ".github/workflows/astrbot-market-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"

jobs:
  official-market-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Clone current AstrBot and official market validator
        run: |
          git clone --depth 1 --branch master https://github.com/AstrBotDevs/AstrBot .cache/AstrBot
          git clone --depth 1 --branch main https://github.com/AstrBotDevs/AstrBot_Plugins_Collection .cache/PluginCollection

      - name: Install AstrBot dependencies
        run: python -m pip install -r .cache/AstrBot/requirements.txt

      - name: Verify command dispatch ownership and script compatibility on current AstrBot
        run: |
          mkdir -p .cache/runtime/data/plugins
          ln -s "$GITHUB_WORKSPACE" .cache/runtime/data/plugins/astrbot_plugin_rollpig_plus
          PYTHONPATH="$GITHUB_WORKSPACE/.cache/AstrBot:$GITHUB_WORKSPACE/.cache/runtime" python - <<'PY'
          import importlib

          from astrbot.core.star.filter.command import CommandFilter
          from astrbot.core.star.star_handler import star_handlers_registry

          prefix = "data.plugins.astrbot_plugin_rollpig_plus"
          entry = f"{prefix}.main"
          importlib.import_module(entry)

          handlers = [
              handler
              for handler in star_handlers_registry
              if str(getattr(getattr(handler, "handler", None), "__module__", "")).startswith(prefix)
          ]
          assert handlers, "RollPig registered no handlers during main import"

          wrong_definer = [
              f"{handler.handler_name}:{getattr(handler.handler, '__module__', '')}"
              for handler in handlers
              if str(getattr(handler.handler, "__module__", "")) != entry
          ]
          assert not wrong_definer, (
              "RollPig handlers are still defined by helper modules: "
              f"{wrong_definer}"
          )

          wrong_owner = [
              f"{handler.handler_name}:{handler.handler_module_path}"
              for handler in handlers
              if handler.handler_module_path != entry
          ]
          assert not wrong_owner, f"RollPig handlers are not owned by main: {wrong_owner}"

          commands = []
          command_filters = []
          for handler in handlers:
              filters = getattr(handler, "event_filters", ()) or ()
              matched = [item for item in filters if isinstance(item, CommandFilter)]
              if matched:
                  commands.append(handler)
                  command_filters.extend((handler, item) for item in matched)
          assert commands, "RollPig registered no command handlers"

          low_priority = [
              f"{handler.handler_name}:{(handler.extras_configs or {}).get('priority', 0)}"
              for handler in commands
              if int((handler.extras_configs or {}).get("priority", 0) or 0) < 1000
          ]
          assert not low_priority, f"RollPig commands are not prioritized: {low_priority}"

          roll_pig = next(
              (handler for handler in commands if handler.handler_name == "roll_pig"),
              None,
          )
          assert roll_pig is not None, "roll_pig command handler is missing"
          assert roll_pig.handler_module_path == entry
          assert roll_pig.handler.__module__ == entry

          class FakeEvent:
              """Minimal AstrBot event surface required by CommandFilter.filter()."""

              is_at_or_wake_command = True

              def __init__(self, message):
                  self.message = message
                  self.extras = {}

              def get_message_str(self):
                  return self.message

              def set_extra(self, key, value):
                  self.extras[key] = value

          def matching_handlers(message):
              matched = []
              parsed = {}
              for handler, command_filter in command_filters:
                  fake = FakeEvent(message)
                  if command_filter.filter(fake, {}):
                      matched.append(handler.handler_name)
                      parsed[handler.handler_name] = fake.extras.get("parsed_params", {})
              return matched, parsed

          # WakingCheck removes the configured wake prefix before CommandFilter sees
          # the string, so these are deliberately tested without a leading slash.
          matrix = {
              "猪圈日报": ("pigsty_daily_report", {"args": ""}),
              "豬圈日報": ("pigsty_daily_report", {"args": ""}),
              "猪圈日报 状态": ("pigsty_daily_report", {"args": "状态"}),
              "豬圈日報 狀態": ("pigsty_daily_report", {"args": "狀態"}),
              "猪圈日报 狀態": ("pigsty_daily_report", {"args": "狀態"}),
              "豬圈日報 状态": ("pigsty_daily_report", {"args": "状态"}),
              "猪圈日报 开启": ("pigsty_daily_report", {"args": "开启"}),
              "豬圈日報 開啟": ("pigsty_daily_report", {"args": "開啟"}),
              "猪圈日报 关闭": ("pigsty_daily_report", {"args": "关闭"}),
              "豬圈日報 關閉": ("pigsty_daily_report", {"args": "關閉"}),
              "猪圈日报状态": ("pigsty_daily_report_status", {}),
              "豬圈日報狀態": ("pigsty_daily_report_status", {}),
              "猪圈日报狀態": ("pigsty_daily_report_status", {}),
              "豬圈日報状态": ("pigsty_daily_report_status", {}),
              "猪圈日报开启": ("pigsty_daily_report_enable", {}),
              "豬圈日報開啟": ("pigsty_daily_report_enable", {}),
              "猪圈日报关闭": ("pigsty_daily_report_disable", {}),
              "豬圈日報關閉": ("pigsty_daily_report_disable", {}),
              "烤箱补货": ("oven_refill", {}),
              "烤箱補貨": ("oven_refill", {}),
              "随机烤群友": ("roast_random_group_member", {}),
              "隨機烤群友": ("roast_random_group_member", {}),
          }
          for message, (expected_handler, expected_params) in matrix.items():
              matched, parsed = matching_handlers(message)
              assert matched == [expected_handler], (
                  f"AstrBot command collision for {message!r}: expected "
                  f"{expected_handler}, got {matched}"
              )
              assert parsed.get(expected_handler, {}) == expected_params, (
                  f"AstrBot parsed params changed for {message!r}: {parsed}"
              )

          # Boundary regression: compact controls must not be swallowed by the
          # shorter report root, and arbitrary suffixes must not be accepted.
          for invalid in ("猪圈日报狀态x", "豬圈日報狀態x", "烤箱補貨x"):
              matched, _ = matching_handlers(invalid)
              assert matched == [], f"unexpected prefix match for {invalid!r}: {matched}"

          print(
              f"verified {len(handlers)} RollPig handlers / {len(commands)} commands; "
              f"{len(matrix)} bilingual AstrBot dispatch cases; "
              f"roll_pig definer={roll_pig.handler.__module__}, "
              f"owner={roll_pig.handler_module_path}, "
              f"priority={roll_pig.extras_configs.get('priority')}"
          )
          PY

      - name: Build checked-out revision snapshot
        run: |
          mkdir -p .cache/plugin-source
          git archive HEAD | tar -x -C .cache/plugin-source
          test -f .cache/plugin-source/main.py
          test -f .cache/plugin-source/metadata.yaml

      - name: Run official AstrBot plugin load worker against checked-out revision
        shell: bash
        run: |
          set +e
          python .cache/PluginCollection/scripts/validate_plugins/run.py \
            --worker \
            --astrbot-path .cache/AstrBot \
            --plugin-source-dir .cache/plugin-source \
            --plugin-dir-name astrbot_plugin_rollpig_plus \
            --normalized-repo-url https://github.com/casama233/astrbot_plugin_rollpig \
            > .cache/astrbot-worker-output.txt 2>&1
          worker_status=$?
          set -e
          cat .cache/astrbot-worker-output.txt

          WORKER_STATUS="$worker_status" python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path('.cache/astrbot-worker-output.txt').read_text(
              encoding='utf-8', errors='replace'
          )
          payload = None
          for line in reversed(output.splitlines()):
              try:
                  candidate = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(candidate, dict):
                  payload = candidate
                  break
          if payload is None:
              payload = {
                  'plugin': 'astrbot_plugin_rollpig_plus',
                  'repo': 'https://github.com/casama233/astrbot_plugin_rollpig',
                  'normalized_repo_url': 'https://github.com/casama233/astrbot_plugin_rollpig',
                  'ok': False,
                  'stage': 'worker',
                  'message': 'official worker returned no structured JSON',
                  'severity': 'fail',
                  'details': output,
              }
          severity = payload.get('severity') or ('pass' if payload.get('ok') else 'fail')
          report = {
              'summary': {
                  'total': 1,
                  'passed': 1 if severity == 'pass' else 0,
                  'warned': 1 if severity == 'warn' else 0,
                  'failed': 1 if severity == 'fail' else 0,
              },
              'results': [payload],
              'checked_revision': os.environ.get('GITHUB_SHA'),
              'validation_mode': 'official-worker-current-checkout',
          }
          Path('astrbot-market-smoke-report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          exit "$worker_status"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: astrbot-market-smoke-report
          path: astrbot-market-smoke-report.json
          if-no-files-found: warn
