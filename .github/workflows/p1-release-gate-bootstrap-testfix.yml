name: Apply validated RollPig P1 release gate

on:
  push:
    branches:
      - fix/p1-release-ci-gate
    paths:
      - .github/workflows/p1-release-gate-bootstrap-testfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact repair revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          BRANCH: fix/p1-release-ci-gate
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${REVISION}"
          git checkout -B "${BRANCH}" FETCH_HEAD

      - name: Re-run the validated workflow generators
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/p1-release-gate-bootstrap-robust.yml').read_text(encoding='utf-8')
          blocks = (
              (
                  '      - name: Generate candidate workflows\n        run: |\n',
                  '\n      - name: Replace fragile inline metadata parser\n',
                  '/tmp/generate-candidate.sh',
              ),
              (
                  '      - name: Replace fragile inline metadata parser\n        run: |\n',
                  '\n      - name: Install focused validation dependencies\n',
                  '/tmp/replace-metadata-parser.sh',
              ),
          )
          for start, end, output in blocks:
              if start not in source or end not in source:
                  raise SystemExit(f'无法定位已验证生成步骤: {output}')
              block = source.split(start, 1)[1].split(end, 1)[0]
              Path(output).write_text(dedent(block), encoding='utf-8')
          PY
          bash /tmp/generate-candidate.sh
          bash /tmp/replace-metadata-parser.sh

      - name: Write parser tests without nested string escaping
        run: |
          cat > tests/test_release_metadata.py <<'PYTEST'
          from __future__ import annotations

          import importlib.util
          from pathlib import Path

          import pytest


          ROOT = Path(__file__).resolve().parents[1]
          SPEC = importlib.util.spec_from_file_location(
              "rollpig_release_metadata",
              ROOT / "scripts/release_metadata.py",
          )
          assert SPEC and SPEC.loader
          MODULE = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(MODULE)


          def test_stable_metadata_outputs_are_deterministic():
              fields = MODULE.parse_metadata(
                  """name: astrbot_plugin_rollpig
          display_name: 豬豬源
          version: "3.12.0"
          """
              )
              assert MODULE.build_outputs(fields) == {
                  "version": "3.12.0",
                  "tag": "v3.12.0",
                  "plugin_name": "astrbot_plugin_rollpig",
                  "display_name": "豬豬源",
                  "archive": "astrbot_plugin_rollpig-v3.12.0.zip",
              }


          @pytest.mark.parametrize("version", ["3.12", "v3.12.0", "3.12.0-rc1"])
          def test_non_stable_versions_are_rejected(version):
              with pytest.raises(ValueError, match="stable x.y.z"):
                  MODULE.parse_metadata(
                      f"""name: astrbot_plugin_rollpig
          display_name: 豬豬源
          version: "{version}"
          """
                  )


          def test_empty_version_is_rejected_as_missing():
              with pytest.raises(ValueError, match="missing required fields: version"):
                  MODULE.parse_metadata(
                      """name: astrbot_plugin_rollpig
          display_name: 豬豬源
          version: ""
          """
                  )


          def test_unsafe_plugin_name_is_rejected():
              with pytest.raises(ValueError, match="unsafe plugin name"):
                  MODULE.parse_metadata(
                      """name: ../rollpig
          display_name: 豬豬源
          version: 3.12.0
          """
                  )
          PYTEST

      - name: Install focused validation dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Parse workflows and run release tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              Path('.github/workflows/ci.yml'),
              Path('.github/workflows/release.yml'),
          ):
              document = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(document, dict) or 'jobs' not in document:
                  raise SystemExit(f'{path} is not a valid workflow mapping')
          PY
          python -m pytest -q \
            tests/test_release_workflow_contract.py \
            tests/test_release_metadata.py
          python scripts/release_metadata.py > /tmp/release-metadata.out
          grep -Fx 'tag=v3.12.0' /tmp/release-metadata.out

      - name: Commit generated repair
        env:
          BRANCH: fix/p1-release-ci-gate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            scripts/release_metadata.py \
            tests/test_release_workflow_contract.py \
            tests/test_release_metadata.py \
            CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m "fix(P1): gate releases on the tested CI revision"
          git push origin "HEAD:${BRANCH}"
