name: Prepare v3.6.1 release

on:
  push:
    branches:
      - release/v3.6.1
    paths:
      - .github/workflows/prepare-v361-release.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v3.6.1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch release metadata
        run: python .github/scripts/prepare_v361_release.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit

      - name: Validate release candidate
        run: |
          python -m compileall -q main.py legacy_main.py daily_report_core.py daily_report_feature.py gameplay_events.py ex_variants.py ex_variant_feature.py roast_reservations.py roast_reservation_feature.py rollpig_core.py updater.py storage services
          pytest -q
          pre-commit run --all-files --show-diff-on-failure
          python - <<'PY'
          from pathlib import Path
          assert 'version: "3.6.1"' in Path('metadata.yaml').read_text(encoding='utf-8')
          assert 'current-3.6.1-ef5d82' in Path('README.md').read_text(encoding='utf-8')
          assert '## v3.6.1 (2026-08-14)' in Path('CHANGELOG.md').read_text(encoding='utf-8')
          assert Path('.github/release-v3.6.1.md').is_file()
          assert 'AstrBot-RollPig/3.6.1' in Path('legacy_main.py').read_text(encoding='utf-8')
          assert 'AstrBot-RollPig-Safe-Updater/3.6.1' in Path('updater.py').read_text(encoding='utf-8')
          PY

      - name: Commit verified release files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            metadata.yaml legacy_main.py updater.py README.md CHANGELOG.md \
            docs/COMMANDS.md docs/CONFIGURATION.md docs/OPERATIONS.md docs/RESOURCE-MANAGEMENT.md \
            tests/test_v312_release_contract.py tests/test_identity_migration_plus.py tests/test_source_regressions.py \
            .github/release-v3.6.1.md
          git commit -m "chore: prepare v3.6.1 release"
          git push origin HEAD:release/v3.6.1
