name: Patch legacy sqlite eaten penalty

on:
  push:
    branches:
      - fix/eaten-next-day-duplicate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eaten-next-day-duplicate
          fetch-depth: 0
      - name: Replace legacy penalty block with duplicate request
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('storage/sqlite_storage.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'''                elif due_date == draw_date and failed:\n                    return \{\n                        "status": "penalty-blocked",\n                        "created": False,\n                        "history": history,\n                        "roast_state": roast,\n                    \}\n                elif due_date == draw_date and penalty_should_fail:\n.*?                    return \{\n                        "status": "penalty-blocked",\n                        "created": False,\n                        "history": history,\n                        "roast_state": roast,\n                    \}\n                elif due_date == draw_date and isinstance\(pig, dict\) and str\(''',
              re.S,
          )
          replacement = '''                elif due_date == draw_date and isinstance(pig, dict) and str('''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one legacy penalty block, got {count}')

          # Insert duplicate request after the valid-pig branch has had a chance to
          # consume/delete the penalty, matching SQLitePrimary semantics.
          marker = '''                    roast_changed = True\n\n            if not isinstance(pig, dict) or not str(pig.get("id") or ""):\n'''
          insertion = '''                    roast_changed = True\n                elif due_date == draw_date and (failed or penalty_should_fail):\n                    return {\n                        "status": "penalty-duplicate",\n                        "created": False,\n                        "history": history,\n                        "roast_state": roast,\n                    }\n\n            if not isinstance(pig, dict) or not str(pig.get("id") or ""):\n'''
          if marker not in updated:
              raise SystemExit('legacy valid-pig marker not found')
          updated = updated.replace(marker, insertion, 1)
          if '"status": "penalty-blocked"' in updated:
              raise SystemExit('penalty-blocked still present in sqlite_storage.py')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add storage/sqlite_storage.py
          git commit -m 'fix: align legacy sqlite eaten penalty semantics'
          git push origin HEAD:fix/eaten-next-day-duplicate
