name: Temporary prepare v3.6.5

on:
  push:
    branches:
      - release/v3.6.5

permissions:
  contents: write

jobs:
  prepare-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply release preparation
        run: python scripts/apply_release_v365.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pre-commit
      - name: Compile
        run: python -m compileall -q .
      - name: Full test suite
        run: pytest -q
      - name: Pre-commit
        run: pre-commit run --all-files
      - name: Build release-equivalent archive
        run: |
          plugin_name=astrbot_plugin_rollpig_plus
          archive="$plugin_name-v3.6.5.zip"
          rm -rf dist
          mkdir -p "dist/$plugin_name"
          rsync -a ./ "dist/$plugin_name/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude 'dist/' \
            --exclude 'tests/' \
            --exclude 'scripts/' \
            --exclude 'deploy/' \
            --exclude 'source_service/' \
            --exclude 'node_modules/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '.pre-commit-config.yaml' \
            --exclude 'CONTRIBUTING.md' \
            --exclude 'resource/font/HanyiYongZiXiaoXiongMaoFan.ttf' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'plugin_data/'
          test -f "dist/$plugin_name/resource/font/荆南麦圆体.otf"
          (cd dist && zip -qr "$archive" "$plugin_name")
          size=$(stat -c%s "dist/$archive")
          echo "v3.6.5 release-equivalent archive: $size bytes"
          test "$size" -le 16000000
          rm -rf dist
      - name: Diff check
        run: git diff --check
      - name: Remove temporary release helpers
        run: |
          rm -f scripts/apply_release_v365.py
          rm -f .github/workflows/tmp-prepare-v365.yml
      - name: Commit verified release files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'release: prepare v3.6.5'
          git push origin HEAD:release/v3.6.5
