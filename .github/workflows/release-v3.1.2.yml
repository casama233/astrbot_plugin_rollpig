name: Release v3.1.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.repository == 'casama233/astrbot_plugin_rollpig' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check target version and release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! grep -q 'version: "3.1.2"' metadata.yaml; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git ls-remote --exit-code --tags origin refs/tags/v3.1.2 >/dev/null 2>&1; then
            echo "v3.1.2 tag is missing" >&2
            exit 1
          fi
          if gh release view v3.1.2 >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
      - name: Install and test
        if: steps.version.outputs.release == 'true'
        run: |
          npm ci
          python -m pip install -r requirements.txt pytest
          npm test
          python -m pytest -q
          python -m compileall -q main.py updater.py services storage
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" npm run test:browser-perf
          CHROME_PATH="$CHROME_PATH" node tests/browser/readability-browser.mjs
      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.1.2 \
            --verify-tag \
            --title "v3.1.2 · Analytics 可读性修复" \
            --notes-file .github/release-v3.1.2.md
      - name: Confirm published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.1.2 --json tagName,name,isDraft,isPrerelease
          git push --force origin HEAD:refs/heads/automation/v3.1.2-release-confirmed
