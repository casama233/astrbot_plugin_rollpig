def test_corrupt_qualified_sqlite_aborts_without_committing_destination(tmp_path: Path):
    old = tmp_path / "astrbot_plugin_rollpig"
    new = tmp_path / "astrbot_plugin_rollpig_plus"
    old.mkdir()
    new.mkdir()
