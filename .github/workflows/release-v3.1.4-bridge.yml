name: Release v3.1.4 Migration Bridge

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'casama233/astrbot_plugin_rollpig' && github.event.pull_request.head.ref == 'agent/rollpig-safe-identity-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bridge branch
        uses: actions/checkout@v4
        with:
          ref: agent/rollpig-safe-identity-migration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          npm ci

      - name: Verify bridge release
        run: |
          python -m pytest -q
          npm test
          python -m compileall -q main.py updater.py services storage
          python - <<'PY'
          from pathlib import Path
          metadata = Path('metadata.yaml').read_text(encoding='utf-8')
          assert 'name: "astrbot_plugin_rollpig"' in metadata
          assert 'version: "3.1.4"' in metadata
          assert 'author: "MegSopern, casama233"' in metadata
          assert 'self._version_tuple(latest) >= (3, 2, 0)' in Path('updater.py').read_text(encoding='utf-8')
          PY

      - name: Remove one-time publisher from release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v3.1.4-bridge.yml
          git commit -m "chore: remove one-time v3.1.4 publisher"
          git push origin HEAD:agent/rollpig-safe-identity-migration

      - name: Build release archive and checksum
        run: |
          mkdir -p /tmp/rollpig-release/astrbot_plugin_rollpig
          rsync -a ./ /tmp/rollpig-release/astrbot_plugin_rollpig/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'tests' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '*.pyc'
          cd /tmp/rollpig-release
          zip -qr "$GITHUB_WORKSPACE/astrbot_plugin_rollpig-v3.1.4.zip" astrbot_plugin_rollpig
          cd "$GITHUB_WORKSPACE"
          sha256sum astrbot_plugin_rollpig-v3.1.4.zip > astrbot_plugin_rollpig-v3.1.4.zip.sha256

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.1.4 >/dev/null 2>&1; then
            echo "v3.1.4 release already exists"
            exit 0
          fi
          git tag -a v3.1.4 -m "v3.1.4 migration bridge"
          git push origin v3.1.4
          cat > /tmp/release-notes.md <<'EOF'
          ## 插件身份迁移桥接

          - 为现有增强版数据目录写入原子化来源标记，供后续 `astrbot_plugin_rollpig_plus` 安全识别，避免误迁移 MegSopern 原版插件数据。
          - 旧版安全更新器遇到 `3.2.0+` 新插件身份时拒绝原地覆盖，并提示改从 AstrBot 插件市场安装新包完成迁移。
          - 本版本保持旧插件名、数据目录和配置命名不变，不移动、不删除任何用户数据。
          - Release 附带经过验证的插件 ZIP 和对应 SHA-256 文件。
          EOF
          gh release create v3.1.4 \
            astrbot_plugin_rollpig-v3.1.4.zip \
            astrbot_plugin_rollpig-v3.1.4.zip.sha256 \
            --verify-tag \
            --title "v3.1.4 · 插件身份迁移桥接" \
            --notes-file /tmp/release-notes.md
