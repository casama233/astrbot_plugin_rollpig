name: TEMP roast boundary refactor

on:
  push:
    branches:
      - refactor/roast-boundary

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: refactor/roast-boundary
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Harden temporary patch markers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_tmp_apply_roast_boundary.py')
          source = path.read_text(encoding='utf-8')
          replacements = {
              '"    def render_help_image(\\n",': '"    def render_help_image(self) -> Path:\\n",',
              '"    async def pigsty_daily_report(\\n",': '"    async def pigsty_daily_report(self, event: AstrMessageEvent):\\n",',
          }
          for old, new in replacements.items():
              assert source.count(old) == 1, (old, source.count(old))
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply boundary refactor
        run: python scripts/_tmp_apply_roast_boundary.py

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Compile source
        run: python -m compileall -q .

      - name: Run focused roast boundary tests
        run: |
          python -m pytest -q \
            tests/test_roast_policy.py \
            tests/test_roast_boundary_contract.py \
            tests/test_roast_renderer.py \
            tests/test_renderer_boundary_contract.py \
            tests/test_roast_reservations.py \
            tests/test_daily_report.py \
            tests/test_services.py

      - name: Run full suite
        run: python -m pytest -q

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Check patch hygiene
        run: |
          git diff --check
          test ! -e scripts/_tmp_apply_roast_boundary.py
          test ! -e .github/workflows/_tmp-roast-boundary.yml

      - name: Commit verified refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: centralize roast interaction boundary'
          git push origin HEAD:refactor/roast-boundary
