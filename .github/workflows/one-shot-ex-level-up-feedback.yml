name: One-shot EX level-up feedback

on:
  push:
    branches:
      - fix/ex-level-up-feedback
    paths:
      - .github/workflows/one-shot-ex-level-up-feedback.yml

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Apply structural EX feedback patch
        run: python .github/one_shot_ex_level_up_patch.py

      - name: Validate patched Python files
        shell: bash
        run: |
          python -m compileall -q \
            ex_variant_feature.py \
            gameplay_events.py \
            daily_report_feature.py \
            tests/test_ex_growth_e2e.py \
            tests/test_gameplay_events.py
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ex_variant_feature.py \
            gameplay_events.py \
            daily_report_feature.py \
            tests/test_ex_growth_e2e.py \
            tests/test_gameplay_events.py \
            docs/EX-VARIANTS.md \
            CHANGELOG.md
          git commit -m "feat: show one-time EX level-up feedback"
          git push origin "HEAD:${GITHUB_REF_NAME}"
