name: One-shot EX level-up feedback

on:
  push:
    branches:
      - fix/ex-level-up-feedback
    paths:
      - .github/workflows/one-shot-ex-level-up-feedback.yml

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Repair temporary generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/one_shot_ex_level_up_patch.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          locate_line = "    stop = len(lines) if end is None else end"
          locate_index = lines.index(locate_line)
          lines[locate_index] = (
              "    stop = len(lines) if end is None else min(len(lines), end)"
          )

          start = lines.index('replacement = """    @staticmethod')
          lines[start] = "replacement = '''    @staticmethod"
          for index in range(start + 1, len(lines)):
              if lines[index] == '""".splitlines()':
                  lines[index] = "'''.splitlines()"
                  break
          else:
              raise SystemExit("EX replacement closing delimiter not found")

          notice = lines.index(
              r'        "今天抽到：\n✨ 重逢第 4 次 · EX Lv.2 → Lv.3"'
          )
          lines[notice] = (
              r'        "今天抽到：\\n✨ 重逢第 4 次 · EX Lv.2 → Lv.3"'
          )

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Apply structural EX feedback patch
        run: python .github/one_shot_ex_level_up_patch.py

      - name: Validate patched Python files
        shell: bash
        run: |
          python -m compileall -q \
            ex_variant_feature.py \
            gameplay_events.py \
            daily_report_feature.py \
            tests/test_ex_growth_e2e.py \
            tests/test_gameplay_events.py
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ex_variant_feature.py \
            gameplay_events.py \
            daily_report_feature.py \
            tests/test_ex_growth_e2e.py \
            tests/test_gameplay_events.py \
            docs/EX-VARIANTS.md \
            CHANGELOG.md
          git commit -m "feat: show one-time EX level-up feedback"
          git push origin "HEAD:${GITHUB_REF_NAME}"
