name: Fix PR 164 maintenance contract

on:
  push:
    branches: [fix/dashboard-panel-alignment]
    paths:
      - .github/workflows/fix-pr164-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-panel-alignment
          fetch-depth: 0
      - name: Sync changelog from current main and add PR entry
        run: |
          git fetch origin main
          git show origin/main:CHANGELOG.md > CHANGELOG.md
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## 未發佈\n\n'
          entry = '- 管理面板：修復桌面端「近 14 日豬圈脈搏」與右側收藏率／熱門小豬整列底部不齊，以及回訪率圓環中心標籤越界；保留既有響應式斷點與自適應高度。\n'
          if marker not in text:
              raise SystemExit('missing unreleased marker')
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-pr164-contract.yml
          git diff --check
      - name: Commit contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/fix-pr164-contract.yml
          git commit -m "docs: record dashboard layout fix"
          git push
