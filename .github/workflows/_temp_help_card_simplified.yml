name: Temporary simplify help card

on:
  push:
    branches:
      - fix/help-card-simplified-chinese

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/help-card-simplified-chinese
          fetch-depth: 0
      - name: Make generated help card Simplified Chinese
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # help_system: generated card defaults to zh-CN and command labels follow locale.
          replace(
              'help_system.py',
              '''try:\n    from .player_copy import DEFAULT_PLAYER_LOCALE, copy_text\nexcept ImportError:  # pragma: no cover - direct module loading compatibility\n    from player_copy import DEFAULT_PLAYER_LOCALE, copy_text\n''',
              '''try:\n    from .player_copy import copy_text, normalize_player_locale\nexcept ImportError:  # pragma: no cover - direct module loading compatibility\n    from player_copy import copy_text, normalize_player_locale\n\n\nHELP_CARD_LOCALE = "zh-CN"\n''',
          )
          replace(
              'help_system.py',
              '    state: HelpFeatureState, *, locale: object = DEFAULT_PLAYER_LOCALE\n',
              '    state: HelpFeatureState, *, locale: object = HELP_CARD_LOCALE\n',
          )
          replace(
              'help_system.py',
              '''    def t(key: str, **values: object) -> str:\n        return copy_text(key, locale=locale, **values)\n\n    daily_entries = [\n''',
              '''    locale_name = normalize_player_locale(locale)\n\n    def t(key: str, **values: object) -> str:\n        return copy_text(key, locale=locale_name, **values)\n\n    def cmd(simplified: str, traditional: str | None = None) -> str:\n        if locale_name == "zh-TW" and traditional is not None:\n            return traditional\n        return simplified\n\n    daily_entries = [\n''',
          )

          command_pairs = [
              ('HelpEntry("/今日小豬",', 'HelpEntry(cmd("/今日小猪", "/今日小豬"),'),
              ('HelpEntry("/昨日小豬",', 'HelpEntry(cmd("/昨日小猪", "/昨日小豬"),'),
              ('HelpEntry("/明日小豬",', 'HelpEntry(cmd("/明日小猪", "/明日小豬"),'),
              ('HelpEntry("/本週小豬",', 'HelpEntry(cmd("/本周小猪", "/本週小豬"),'),
              ('HelpEntry("/今日小豬 @某人",', 'HelpEntry(cmd("/今日小猪 @某人", "/今日小豬 @某人"),'),
              ('HelpEntry("/我的豬圈 [頁碼]",', 'HelpEntry(cmd("/我的猪圈 [页码]", "/我的豬圈 [頁碼]"),'),
              ('HelpEntry("/隨機小豬 [1-9]",', 'HelpEntry(cmd("/随机小猪 [1-9]", "/隨機小豬 [1-9]"),'),
              ('HelpEntry("/找豬／搜豬 關鍵詞",', 'HelpEntry(cmd("/找猪／搜猪 关键词", "/找豬／搜豬 關鍵詞"),'),
              ('HelpEntry("/今日烤豬",', 'HelpEntry(cmd("/今日烤猪", "/今日烤豬"),'),
              ('HelpEntry("/隨機烤群友",', 'HelpEntry(cmd("/随机烤群友", "/隨機烤群友"),'),
              ('HelpEntry("/打點後廚 @某人",', 'HelpEntry(cmd("/打点后厨 @某人", "/打點後廚 @某人"),'),
              ('HelpEntry("/烤箱補貨",', 'HelpEntry(cmd("/烤箱补货", "/烤箱補貨"),'),
              ('HelpEntry("/隨機吃群友",', 'HelpEntry(cmd("/随机吃群友", "/隨機吃群友"),'),
              ('HelpEntry("/豬圈日報",', 'HelpEntry(cmd("/猪圈日报", "/豬圈日報"),'),
              ('HelpEntry("/豬圈日報狀態",', 'HelpEntry(cmd("/猪圈日报状态", "/豬圈日報狀態"),'),
              ('HelpEntry("/豬圈日報開啟／關閉",', 'HelpEntry(cmd("/猪圈日报开启／关闭", "/豬圈日報開啟／關閉"),'),
          ]
          for old, new in command_pairs:
              replace('help_system.py', old, new)

          # Renderer: the help bitmap always uses the standard CN bold font and simplified literals.
          replace(
              'renderers/help.py',
              '    text_font = font_traditional or font_bold\n',
              '    # The generated quick-command card is intentionally Simplified Chinese.\n    # Keep the compatibility parameter, but never switch to the Traditional-only fallback.\n    text_font = font_bold\n',
          )
          for old, new in [
              ('"今日小豬 · 快速指令"', '"今日小猪 · 快速指令"'),
              ('"只列已啟用功能 · 每條只說一件事 · 繁／簡別名都可用"', '"只列已启用功能 · 每条只说一件事 · 简繁别名都可用"'),
              ('"完整規則 · 管理 · 投稿 · 排障 → 今日小豬 Wiki（下方有連結）"', '"完整规则 · 管理 · 投稿 · 排障 → 今日小猪 Wiki（下方有链接）"'),
          ]:
              replace('renderers/help.py', old, new)

          # Feature path: force zh-CN model, drop Traditional font from bitmap/cache inputs,
          # and make the accompanying text response Simplified Chinese too.
          replace('help_feature.py', '    HELP_RENDER_CACHE_VERSION = 4\n', '    HELP_RENDER_CACHE_VERSION = 5\n')
          replace(
              'help_feature.py',
              '    def _help_sections(self):\n        return build_help_sections(self._help_feature_state())\n',
              '    def _help_sections(self):\n        return build_help_sections(self._help_feature_state(), locale="zh-CN")\n',
          )
          replace(
              'help_feature.py',
              '''    def _help_font_identity(self) -> str:\n        """Fingerprint every font that can affect the cached help bitmap."""\n\n        traditional = getattr(self, "font_traditional", None)\n        return (\n            f"bold={self._font_identity(self.font_bold)}|"\n            f"traditional={self._font_identity(traditional)}"\n        )\n''',
              '''    def _help_font_identity(self) -> str:\n        """Fingerprint the one font used by the Simplified Chinese help bitmap."""\n\n        return f"bold={self._font_identity(self.font_bold)}"\n''',
          )
          replace(
              'help_feature.py',
              '''            kwargs = {\n                "palette": self._image_palette(),\n                "font_bold": self.font_bold,\n                "font_traditional": getattr(self, "font_traditional", None),\n            }\n''',
              '''            kwargs = {\n                "palette": self._image_palette(),\n                "font_bold": self.font_bold,\n            }\n''',
          )
          for old, new in [
              ('"📖 想看完整玩法、管理、投稿與排障？今日小豬 Wiki：\\n"', '"📖 想看完整玩法、管理、投稿与排障？今日小猪 Wiki：\\n"'),
              ('logger.warning(f"發送今日小豬 Wiki 入口失敗：{link_exc}")', 'logger.warning(f"发送今日小猪 Wiki 入口失败：{link_exc}")'),
              ('logger.error(f"生成豬豬幫助圖片失敗：{exc}", exc_info=True)', 'logger.error(f"生成猪猪帮助图片失败：{exc}", exc_info=True)'),
              ('"豬豬幫助圖片生成失敗，請查看後台日誌。\\n"', '"猪猪帮助图片生成失败，请查看后台日志。\\n"'),
          ]:
              replace('help_feature.py', old, new)

          # Update dynamic-help expectations to the simplified default card.
          p = Path('tests/test_dynamic_help_system.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '"pigsty_daily_report_status": "/豬圈日報狀態"': '"pigsty_daily_report_status": "/猪圈日报状态"',
              '"pigsty_daily_report_enable": "/豬圈日報開啟／關閉"': '"pigsty_daily_report_enable": "/猪圈日报开启／关闭"',
              '"pigsty_daily_report_disable": "/豬圈日報開啟／關閉"': '"pigsty_daily_report_disable": "/猪圈日报开启／关闭"',
              '"/今日小豬 @某人"': '"/今日小猪 @某人"',
              '"/今日烤豬"': '"/今日烤猪"',
              '"/隨機烤群友"': '"/随机烤群友"',
              '"/打點後廚 @某人"': '"/打点后厨 @某人"',
              '"/隨機吃群友"': '"/随机吃群友"',
              '"/豬圈日報"': '"/猪圈日报"',
              '"/豬圈日報狀態"': '"/猪圈日报状态"',
              '"/烤箱補貨"': '"/烤箱补货"',
              '"/豬圈日報開啟／關閉"': '"/猪圈日报开启／关闭"',
              '"自動日報"': '"自动日报"',
              '"預約烤豬"': '"预约烤猪"',
              '"次日保護"': '"次日保护"',
              '"日報祭品"': '"日报祭品"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          # Player-copy test: commands now follow locale; default help is zh-CN.
          p = Path('tests/test_player_copy.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '''    # Commands are stable protocol/UI tokens; only copy is localized.\n    assert "/今日小豬" in tw\n    assert "/今日小豬" in cn\n''',
              '''    # Displayed command labels follow locale; both spellings remain registered aliases.\n    assert "/今日小豬" in tw\n    assert "/今日小猪" in cn\n    assert "/今日小豬" not in cn\n\n\ndef test_dynamic_help_defaults_to_simplified_chinese_for_generated_card():\n    text = "\\n".join(\n        [section.title, *(f"{entry.command} {entry.detail}" for entry in section.entries)]\n        for section in build_help_sections(HelpFeatureState(at_view_pig=True))\n    )\n    assert "每天抽猪" in text\n    assert "/今日小猪" in text\n    assert "/猪圈日报" in text\n    assert "/烤箱补货" in text\n''',
          )
          # Flatten nested lists correctly in the added test.
          text = text.replace(
              '''    text = "\\n".join(\n        [section.title, *(f"{entry.command} {entry.detail}" for entry in section.entries)]\n        for section in build_help_sections(HelpFeatureState(at_view_pig=True))\n    )\n''',
              '''    rows = []\n    for section in build_help_sections(HelpFeatureState(at_view_pig=True)):\n        rows.append(section.title)\n        rows.extend(f"{entry.command} {entry.detail}" for entry in section.entries)\n    text = "\\n".join(rows)\n''',
          )
          p.write_text(text, encoding='utf-8')

          # Cache contract now tracks only the standard font and fixed zh-CN model.
          p = Path('tests/test_help_feature_contract.py')
          text = p.read_text(encoding='utf-8')
          old = '''def test_help_cache_tracks_traditional_font_and_invalidates_old_bitmaps():\n    cls = _class("help_feature.py", "HelpFeatureMixin")\n    class_source = ast.unparse(cls)\n    font_source = ast.unparse(_method(cls, "_help_font_identity"))\n    ensure_source = ast.unparse(_method(cls, "_ensure_help_master"))\n\n    assert "HELP_RENDER_CACHE_VERSION = 4" in class_source\n    assert "font_traditional" in font_source\n    assert "font_traditional" in ensure_source\n    assert "getattr(self, 'font_traditional', None)" in ensure_source\n'''
          new = '''def test_help_cache_uses_standard_cn_font_and_invalidates_old_bitmaps():\n    cls = _class("help_feature.py", "HelpFeatureMixin")\n    class_source = ast.unparse(cls)\n    font_source = ast.unparse(_method(cls, "_help_font_identity"))\n    ensure_source = ast.unparse(_method(cls, "_ensure_help_master"))\n    sections_source = ast.unparse(_method(cls, "_help_sections"))\n\n    assert "HELP_RENDER_CACHE_VERSION = 5" in class_source\n    assert "font_bold" in font_source\n    assert "font_traditional" not in font_source\n    assert "font_traditional" not in ensure_source\n    assert "locale='zh-CN'" in sections_source\n'''
          if old not in text:
              raise SystemExit('help feature cache contract block not found')
          p.write_text(text.replace(old, new), encoding='utf-8')

          # Renderer contract: even if a Traditional fallback is passed, it must not be selected.
          p = Path('tests/test_help_renderer.py')
          text = p.read_text(encoding='utf-8')
          old = '''def test_help_renderer_prefers_traditional_font_for_every_text_role(monkeypatch):\n    primary = object()\n    traditional = object()\n    selected = []\n    drawable_font = ImageFont.load_default()\n\n    def track_variant(font, size):\n        selected.append((font, size))\n        return drawable_font\n\n    monkeypatch.setattr(help_renderer, "_font_variant", track_variant)\n    sections = (\n        HelpSection(\n            "豬圈日報",\n            (\n                HelpEntry("/豬圈日報", "把今天誰最慘、誰最能烤貼上日報"),\n                HelpEntry("/豬圈日報狀態", "看看晚報醒沒醒"),\n                HelpEntry("/豬圈日報開啟／關閉", "管理員管開關"),\n            ),\n        ),\n    )\n\n    output = render_help_card(\n        sections,\n        palette=PALETTE,\n        font_bold=primary,\n        font_traditional=traditional,\n    )\n    try:\n        assert selected\n        assert all(font is traditional for font, _size in selected)\n        assert {size for _font, size in selected} == {44, 21, 17, 15}\n    finally:\n        output.unlink(missing_ok=True)\n'''
          new = '''def test_help_renderer_uses_standard_bold_font_for_every_text_role(monkeypatch):\n    primary = object()\n    traditional = object()\n    selected = []\n    drawable_font = ImageFont.load_default()\n\n    def track_variant(font, size):\n        selected.append((font, size))\n        return drawable_font\n\n    monkeypatch.setattr(help_renderer, "_font_variant", track_variant)\n    sections = (\n        HelpSection(\n            "猪圈日报",\n            (\n                HelpEntry("/猪圈日报", "把今天谁最惨、谁最能烤贴上日报"),\n                HelpEntry("/猪圈日报状态", "看看晚报醒没醒"),\n                HelpEntry("/猪圈日报开启／关闭", "管理员管开关"),\n            ),\n        ),\n    )\n\n    output = render_help_card(\n        sections,\n        palette=PALETTE,\n        font_bold=primary,\n        font_traditional=traditional,\n    )\n    try:\n        assert selected\n        assert all(font is primary for font, _size in selected)\n        assert {size for _font, size in selected} == {44, 21, 17, 15}\n    finally:\n        output.unlink(missing_ok=True)\n\n\ndef test_help_renderer_fixed_copy_is_simplified_chinese():\n    source = Path(help_renderer.__file__).read_text(encoding="utf-8")\n    assert "今日小猪 · 快速指令" in source\n    assert "只列已启用功能 · 每条只说一件事 · 简繁别名都可用" in source\n    assert "完整规则 · 管理 · 投稿 · 排障 → 今日小猪 Wiki（下方有链接）" in source\n    assert "今日小豬 · 快速指令" not in source\n'''
          if old not in text:
              raise SystemExit('help renderer traditional-font contract block not found')
          text = text.replace(old, new)
          text = text.replace('from PIL import Image, ImageFont\n', 'from pathlib import Path\n\nfrom PIL import Image, ImageFont\n', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate help changes
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m compileall -q help_system.py help_feature.py renderers/help.py
          pytest -q tests/test_dynamic_help_system.py tests/test_player_copy.py tests/test_help_feature_contract.py tests/test_help_renderer.py
      - name: Commit repair
        run: |
          rm -f .github/workflows/_temp_help_card_simplified.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add help_system.py help_feature.py renderers/help.py tests/test_dynamic_help_system.py tests/test_player_copy.py tests/test_help_feature_contract.py tests/test_help_renderer.py .github/workflows/_temp_help_card_simplified.yml
          git commit -m "fix: render generated help entirely in Simplified Chinese"
          git push origin HEAD:fix/help-card-simplified-chinese
