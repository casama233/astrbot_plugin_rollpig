name: TEMP catalog read boundary refactor

on:
  push:
    branches:
      - refactor/catalog-read-boundary

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: refactor/catalog-read-boundary
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit

      - name: Apply catalog read boundary
        run: python scripts/_apply_catalog_read_boundary.py

      - name: Compile source
        run: python -m compileall -q main.py legacy_main.py services tests

      - name: Run full tests
        run: pytest -q

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Review generated diff
        run: |
          git status --short
          git diff --check
          git diff --stat

      - name: Commit verified refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp-catalog-inventory.yml scripts/_apply_catalog_read_boundary.py
          git add legacy_main.py services tests
          git diff --cached --check
          git commit -m 'refactor: extract catalog and resource read services'
          git push origin HEAD:refactor/catalog-read-boundary
