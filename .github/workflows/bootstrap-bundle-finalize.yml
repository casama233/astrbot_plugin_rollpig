name: Finalize bootstrap bundle branch

on:
  push:
    branches: [feat/bootstrap-resource-bundle]
    paths:
      - .github/workflows/bootstrap-bundle-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bootstrap-resource-bundle
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch docs and changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          docs = Path('docs/RESOURCE-MANAGEMENT.md')
          text = docs.read_text(encoding='utf-8')
          needle = (
              '只有前一層連線、HTTP、協議或完整性校驗失敗才會嘗試下一層。'
              '備用鏡像版本低於本地數字版 `resource_version` 時拒絕自動降級。\n\n'
              '你也可以把 `resource_manifest_url` 改成有權使用的 HTTPS 私人 manifest。'
          )
          replacement = (
              '只有前一層連線、HTTP、協議或完整性校驗失敗才會嘗試下一層。'
              '備用鏡像版本低於本地數字版 `resource_version` 時拒絕自動降級。\n\n'
              '### 輕量安裝包與首次同步\n\n'
              'GitHub Release／AstrBot Marketplace 安裝包只攜帶 **22 隻 bootstrap 小豬**、必要圖片、字體與運行代碼；'
              '完整作者資源仍保留在源碼倉庫並用於公共源建構與內容回歸測試，不會因安裝包瘦身而刪除。\n\n'
              '全新安裝在沒有任何已同步 `resource_version` 時，會在約 **3–10 秒**的隨機延遲後發起第一次背景同步，'
              '優先從生產主源取得完整公共圖鑑；主源失敗時依次嘗試 Vercel 與可選 GitHub 鏡像。'
              '如果所有遠端來源都不可用，22 隻 bootstrap 小豬仍可離線提供基本功能，之後的背景檢查會繼續按配置週期重試。\n\n'
              '這個瘦身只作用於發佈時的 staging 副本，不改動倉庫中的完整 `resource/pig.json`、作者 EX 文案或公共源生成輸入。\n\n'
              '你也可以把 `resource_manifest_url` 改成有權使用的 HTTPS 私人 manifest。'
          )
          if needle not in text:
              raise SystemExit('RESOURCE-MANAGEMENT insertion point not found')
          docs.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = (
              '- 資源同步：新安裝自動檢查預設由 24 小時調整為 6 小時；既有明確配置不強制改寫。\n'
          )
          addition = marker + (
              '- 安裝包瘦身：Marketplace／GitHub Release 僅攜帶 22 隻可離線使用的 bootstrap 小豬；完整 99 隻作者基礎資源與 201 隻手寫 EX 作者資料仍保留在倉庫與公共源建構流程。\n'
              '- 首次同步：全新安裝沒有既有雲資源版本時，背景首次同步延遲縮短為約 3–10 秒；已有快取仍保留 30–120 秒啟動抖動，損壞快取維持 5 秒快速修復。\n'
          )
          if marker not in text:
              raise SystemExit('CHANGELOG insertion point not found')
          changelog.write_text(text.replace(marker, addition, 1), encoding='utf-8')
          PY
      - name: Remove temporary audit/finalize files
        run: |
          rm -f bootstrap-audit.txt
          rm -f .github/workflows/bootstrap-resource-audit.yml
          rm -f .github/workflows/bootstrap-bundle-finalize.yml
      - name: Validate patch
        run: |
          git diff --check
          grep -q '22 隻 bootstrap' docs/RESOURCE-MANAGEMENT.md
          grep -q '安裝包瘦身' CHANGELOG.md
          test ! -e bootstrap-audit.txt
          test ! -e .github/workflows/bootstrap-resource-audit.yml
          test ! -e .github/workflows/bootstrap-bundle-finalize.yml
      - name: Commit final branch cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: document lightweight bootstrap installs"
          git push
