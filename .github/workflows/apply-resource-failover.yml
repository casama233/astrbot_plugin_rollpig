name: Apply resource failover integration

on:
  push:
    branches: [feat/public-source-failover]
    paths:
      - .github/workflows/apply-resource-failover.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-source-failover
          fetch-depth: 1

      - name: Patch integration, config and docs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Wire the failover mixin immediately before the legacy base class.
          replace_once(
              'main.py',
              '    from .random_roast_feature import RandomRoastMixin\n',
              '    from .random_roast_feature import RandomRoastMixin\n    from .resource_failover_feature import ResourceFailoverMixin\n',
          )
          replace_once(
              'main.py',
              '    from random_roast_feature import RandomRoastMixin\n',
              '    from random_roast_feature import RandomRoastMixin\n    from resource_failover_feature import ResourceFailoverMixin\n',
          )
          replace_once(
              'main.py',
              '    PermanentCollectionMixin,\n    _BaseRollPigPlugin,\n',
              '    PermanentCollectionMixin,\n    ResourceFailoverMixin,\n    _BaseRollPigPlugin,\n',
          )

          # New installs check more frequently; existing explicit values remain untouched.
          replace_once(
              'legacy_main.py',
              'self.config.get("resource_sync_interval_hours", 24)',
              'self.config.get("resource_sync_interval_hours", 6)',
          )
          replace_once(
              'legacy_main.py',
              '        except (TypeError, ValueError):\n            sync_hours = 24\n        self.resource_sync_interval_hours',
              '        except (TypeError, ValueError):\n            sync_hours = 6\n        self.resource_sync_interval_hours',
          )

          conf = Path('_conf_schema.json')
          text = conf.read_text(encoding='utf-8')
          marker = '''    "resource_sync_interval_hours": {\n        "description": "云资源自动同步间隔（小时）",\n        "hint": "范围 1-168，默认每 24 小时检查一次",\n        "type": "float",\n        "default": 24\n    },\n'''
          if text.count(marker) != 1:
              raise SystemExit('resource sync interval schema block changed unexpectedly')
          replacement = '''    "resource_vercel_mirror_url": {\n        "description": "Vercel 公共猪源备用 manifest",\n        "hint": "仅在使用默认官方公共源且主源不可用时尝试；留空可关闭这一层备用源",\n        "type": "string",\n        "default": "https://rollpig-public-source-mirror.vercel.app/v1/manifest.json"\n    },\n    "resource_github_fallback_enabled": {\n        "description": "启用 GitHub 公共猪源最终备用",\n        "hint": "仅在默认官方主源和 Vercel 镜像均不可用时尝试公开 GitHub 快照；不会影响私人 manifest",\n        "type": "bool",\n        "default": true\n    },\n    "resource_github_mirror_url": {\n        "description": "GitHub 公共猪源备用 manifest",\n        "hint": "默认指向项目公开只读镜像；通常无需修改",\n        "type": "string",\n        "default": "https://raw.githubusercontent.com/casama233/rollpig-public-source-mirror/main/public/v1/manifest.json"\n    },\n    "resource_sync_interval_hours": {\n        "description": "云资源自动同步间隔（小时）",\n        "hint": "范围 1-168，新安装默认每 6 小时检查一次",\n        "type": "float",\n        "default": 6\n    },\n'''
          conf.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          # Keep the canonical configuration reference in lockstep with schema keys.
          replace_once(
              'docs/CONFIGURATION.md',
              '| `resource_manifest_url` | string | 官方 AstrBot v1 | HTTPS URL | 可改成有權使用的相容私人 manifest |\n| `resource_sync_interval_hours` | float | `24` | `1-168` | 自動檢查間隔 |',
              '| `resource_manifest_url` | string | 官方 AstrBot v1 | HTTPS URL | 可改成有權使用的相容私人 manifest；自訂後不啟用官方備援鏈 |\n| `resource_vercel_mirror_url` | string | 官方 Vercel 鏡像 | HTTPS URL / 空字串 | 僅預設官方源失敗時使用；留空停用 Vercel 層 |\n| `resource_github_fallback_enabled` | bool | `true` | bool | Vercel 也失敗時是否再嘗試公開 GitHub 快照 |\n| `resource_github_mirror_url` | string | 官方 GitHub 鏡像 | HTTPS URL | GitHub 最終災備 manifest，通常不需修改 |\n| `resource_sync_interval_hours` | float | `6` | `1-168` | 新安裝自動檢查間隔；既有明確配置保持原值 |',
          )
          replace_once(
              'docs/CONFIGURATION.md',
              '同步失敗保留既有快取或內置資源。舊 `pig.felislab.cc` 精確地址會遷移到 AstrBot 專用源；其他自訂 URL 不擅自改寫。詳見 [RESOURCE-MANAGEMENT.md](RESOURCE-MANAGEMENT.md)。',
              '使用預設官方源時，故障轉移固定為 **curryudon 主源 → Vercel 驗證快照 → GitHub 公開快照 → 最近一次已驗證本地快取／內置資源**。備用源的 `schema_version`、`client`、大小與 SHA-256 仍走同一套校驗；數字版 `resource_version` 低於本地版本時拒絕降級。舊 `pig.felislab.cc` 精確地址會遷移到 AstrBot 專用源；其他自訂 URL 不擅自改寫，也不會被偷偷串到官方備援鏈。詳見 [RESOURCE-MANAGEMENT.md](RESOURCE-MANAGEMENT.md)。',
          )

          replace_once(
              'docs/RESOURCE-MANAGEMENT.md',
              '你也可以把 `resource_manifest_url` 改成有權使用的 HTTPS 私人 manifest。',
              '''預設官方源採固定故障轉移鏈：\n\n1. `curryudon.top` 生產主源（更新最快、最高優先級）；\n2. Vercel 部署的已驗證公開快照；\n3. `casama233/rollpig-public-source-mirror` 的 GitHub Raw 快照（可由配置停用）；\n4. 最近一次已驗證本地快取；沒有快取才回退插件內置資源。\n\n只有前一層連線、HTTP、協議或完整性校驗失敗才會嘗試下一層。備用鏡像版本低於本地數字版 `resource_version` 時拒絕自動降級。\n\n你也可以把 `resource_manifest_url` 改成有權使用的 HTTPS 私人 manifest。這是明確的運維選擇；一旦使用私人 URL，插件只同步該來源，不會在失敗時偷偷切回官方公共源。''',
          )
          replace_once(
              'docs/RESOURCE-MANAGEMENT.md',
              '- 新安裝預設啟用 AstrBot v1 專用源。',
              '- 新安裝預設啟用 AstrBot v1 專用源，並以 6 小時作為新的自動檢查預設值。',
          )

          # Record behavior under Unreleased without claiming a release version.
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## 未發佈\n\n- 暂无。'
          replacement = '''## 未發佈\n\n- 資源同步：預設官方源新增 `curryudon` 主源 → Vercel 驗證快照 → GitHub 公開快照的有序故障轉移；私人 manifest 維持單一來源語義，備源不允許把數字版 `resource_version` 自動降級。\n- 資源同步：新安裝自動檢查預設由 24 小時調整為 6 小時；既有明確配置不強制改寫。'''
          if marker not in text:
              raise SystemExit('CHANGELOG Unreleased placeholder changed unexpectedly')
          changelog.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Remove temporary patch workflow
        run: git rm .github/workflows/apply-resource-failover.yml

      - name: Sanity check
        run: |
          python -m json.tool _conf_schema.json >/dev/null
          python -m py_compile main.py legacy_main.py resource_failover_feature.py tests/test_resource_failover.py
          git diff --check

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate resilient public resource failover"
          git push
