name: PR 190 changelog helper

on:
  push:
    branches:
      - fix/fail-closed-public-mirrors

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fail-closed-public-mirrors
          fetch-depth: 0

      - name: Append maintenance record and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          bullet = "- 公共灾备猪源在来源／再分发审计期间改为 fail-closed：官方链只访问 curryudon primary，即使旧配置仍保留 Vercel/GitHub 镜像也不会读取；主源不可用时继续使用最近一次已验证本地缓存或内置资源。"
          if bullet not in text:
              marker = "## 未發佈\n\n"
              if marker not in text:
                  raise SystemExit("CHANGELOG.md missing 未發佈 section")
              text = text.replace(marker, marker + bullet + "\n", 1)
              path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/pr190-changelog.yml
          git add CHANGELOG.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record fail-closed public mirror hotfix"
          git push origin HEAD:fix/fail-closed-public-mirrors
