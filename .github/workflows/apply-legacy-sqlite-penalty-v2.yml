name: Apply legacy sqlite penalty v2

on:
  push:
    branches:
      - fix/eaten-next-day-duplicate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eaten-next-day-duplicate
          fetch-depth: 0
      - name: Patch storage/sqlite_storage.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('storage/sqlite_storage.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '                elif due_date == draw_date and failed:\n'
          end_marker = '            if not isinstance(pig, dict) or not str(pig.get("id") or "").strip():\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'legacy penalty region not found: start={start}, end={end}')
          replacement = '''                elif due_date == draw_date and isinstance(pig, dict) and str(\n                    pig.get("id") or ""\n                ).strip():\n                    # A triggered next-day penalty still permits today's draw.\n                    # Supplying the forced duplicate consumes the penalty atomically.\n                    connection.execute(\n                        "DELETE FROM eaten_penalties WHERE user_id = ?",\n                        (penalty_user,),\n                    )\n                    penalties_doc.pop(penalty_user, None)\n                    roast_changed = True\n                elif due_date == draw_date and (failed or penalty_should_fail):\n                    return {\n                        "status": "penalty-duplicate",\n                        "created": False,\n                        "history": history,\n                        "roast_state": roast,\n                    }\n\n'''
          updated = text[:start] + replacement + text[end:]
          if '"status": "penalty-blocked"' in updated:
              raise SystemExit('penalty-blocked still present after patch')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add storage/sqlite_storage.py
          git commit -m 'fix: align legacy sqlite eaten penalty semantics'
          git push origin HEAD:fix/eaten-next-day-duplicate
