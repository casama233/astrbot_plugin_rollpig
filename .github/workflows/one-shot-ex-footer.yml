name: One-shot EX footer patch

on:
  push:
    branches: [fix/ex-badge-card-footer]
    paths: [.github/workflows/one-shot-ex-footer.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Apply guarded renderer and documentation edits
        run: python .github/patch-ex-footer-once.py
      - name: Install renderer test dependencies
        run: python -m pip install 'Pillow>=10,<13' 'pytest>=8,<9'
      - name: Validate rendering and cache regressions
        run: |
          python -m py_compile renderers/pig_card.py renderers/animated_pig_card.py tests/test_ex_badge_footer.py
          python -m pytest -q tests/test_ex_badge_footer.py tests/test_ex_level_badge_rendering.py tests/test_pig_card_render_cache.py tests/test_animated_images.py
      - name: Commit tested renderer changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add renderers/pig_card.py renderers/animated_pig_card.py CHANGELOG.md docs/EX-VARIANTS.md
          git rm .github/patch-ex-footer-once.py
          git commit -m 'fix: anchor EX level badges at the bottom of pig cards'
          git push origin "HEAD:${GITHUB_REF_NAME}"
