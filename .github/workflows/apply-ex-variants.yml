name: Apply EX variant integration

# Temporary branch-only integration harness; removed from the clean feature commit.
on:
  push:
    branches:
      - feature/ex-variants
    paths:
      - .github/workflows/apply-ex-variants.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/ex-variants
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair strict patch guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_ex_variants.py')
          text = path.read_text(encoding='utf-8')
          old = 'if count < 3:\n    raise RuntimeError(f"expected at least 3 pig dictionary image lookups, found {count}")'
          new = 'if count != 2:\n    raise RuntimeError(f"expected exactly 2 pig dictionary image lookups, found {count}")'
          if old not in text:
              raise SystemExit('strict lookup guard marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply legacy integration
        run: python .github/scripts/apply_ex_variants.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate focused EX behavior
        run: |
          python -m compileall -q main.py legacy_main.py ex_variants.py ex_variant_feature.py gameplay_events.py daily_report_core.py daily_report_feature.py rollpig_core.py updater.py storage services scripts/build_resource_source.py
          pytest -q tests/test_ex_variants.py tests/test_resource_source_builder.py tests/test_gameplay_events.py tests/test_daily_report.py

      - name: Commit clean integration
        run: |
          rm -f .github/scripts/apply_ex_variants.py
          rm -f .github/workflows/apply-ex-variants.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: 接入 EX Lv. 差分资源运行时"
          git push origin HEAD:feature/ex-variants
