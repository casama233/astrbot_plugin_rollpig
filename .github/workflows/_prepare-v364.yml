name: Prepare v3.6.4

on:
  push:
    branches:
      - release/v3.6.4
    paths:
      - scripts/_prepare_v364.py
      - .github/workflows/_prepare-v364.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.6.4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pre-commit

      - name: Apply guarded release edits
        run: python scripts/_prepare_v364.py

      - name: Verify release contracts
        run: |
          python -m compileall -q .
          pytest -q
          pre-commit run --all-files
          python - <<'PY'
          from pathlib import Path
          metadata = Path('metadata.yaml').read_text(encoding='utf-8')
          main = Path('legacy_main.py').read_text(encoding='utf-8')
          updater = Path('updater.py').read_text(encoding='utf-8')
          assert 'version: "3.6.4"' in metadata
          assert 'AstrBot-RollPig/3.6.4' in main
          assert '"X-RollPig-Version": "3.6.4"' in main
          assert 'AstrBot-RollPig-Safe-Updater/3.6.4' in updater
          assert Path('.github/release-v3.6.4.md').is_file()
          PY
          git diff --check

      - name: Check Marketplace-equivalent package size
        run: |
          plugin_name=$(python - <<'PY'
          import re
          from pathlib import Path
          text=Path('metadata.yaml').read_text(encoding='utf-8')
          print(re.search(r'^name:\s*["\x27]?([^"\x27\n]+)', text, re.M).group(1))
          PY
          )
          mkdir -p "dist/$plugin_name"
          rsync -a ./ "dist/$plugin_name/" \
            --exclude '.git/' --exclude '.github/' --exclude '.venv/' \
            --exclude '__pycache__/' --exclude '.pytest_cache/' --exclude 'dist/' \
            --exclude 'tests/' --exclude 'scripts/' --exclude 'deploy/' \
            --exclude 'source_service/' --exclude 'node_modules/' \
            --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude '.pre-commit-config.yaml' --exclude 'CONTRIBUTING.md' \
            --exclude 'resource/font/HanyiYongZiXiaoXiongMaoFan.ttf' \
            --exclude '*.pyc' --exclude '*.pyo' --exclude '.env' \
            --exclude 'data/' --exclude 'plugin_data/'
          (cd dist && zip -qr release-check.zip "$plugin_name")
          size=$(stat -c%s dist/release-check.zip)
          echo "release archive size: $size"
          test "$size" -le 16000000

      - name: Commit prepared release branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/_prepare_v364.py .github/workflows/_prepare-v364.yml
          git add -A
          git commit -m "release: prepare v3.6.4"
          git push origin HEAD:release/v3.6.4
