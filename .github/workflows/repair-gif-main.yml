name: Align GIF entry point

on:
  push:
    branches:
      - agent/animated-gif-pigs
    paths:
      - .github/workflows/repair-gif-main.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/animated-gif-pigs
      - name: Reapply GIF wiring onto latest main.py
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:main.py > main.py
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")
          rel = "try:\n    from .animated_image_feature import AnimatedImageMixin\n"
          abs_ = "except ImportError:  # pragma: no cover - direct module loading compatibility\n    from animated_image_feature import AnimatedImageMixin\n"
          base_rel = "try:\n"
          base_abs = "except ImportError:  # pragma: no cover - direct module loading compatibility\n"
          klass = "class RollPigPlugin(\n"
          if "from .animated_image_feature import AnimatedImageMixin" not in text:
              text = text.replace(base_rel, rel, 1)
          if "from animated_image_feature import AnimatedImageMixin" not in text:
              text = text.replace(base_abs, abs_, 1)
          if "class RollPigPlugin(\n    AnimatedImageMixin," not in text:
              text = text.replace(klass, klass + "    AnimatedImageMixin,\n", 1)
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: preserve latest main entry-point changes"
          git push origin HEAD:agent/animated-gif-pigs
