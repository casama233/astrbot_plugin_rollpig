name: Prepare v3.11.4 release files
on:
  push:
    branches: [release/v3.11.4]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.11.4
          fetch-depth: 0
      - name: Cut release metadata changelog and notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import re
          from pathlib import Path

          version = '3.11.4'
          release_date = '2026-08-18'

          metadata_path = Path('metadata.yaml')
          metadata = metadata_path.read_text(encoding='utf-8')
          updated_metadata, count = re.subn(
              r'(?m)^version:\s*["\x27]?3\.11\.3["\x27]?\s*$',
              f'version: "{version}"',
              metadata,
              count=1,
          )
          if count != 1:
              raise SystemExit('expected metadata version 3.11.3 exactly once')
          metadata_path.write_text(updated_metadata, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '## 未發佈'
          start = changelog.index(marker) + len(marker)
          tail = changelog[start:]
          rel_end = tail.find('\n## ')
          if rel_end < 0:
              raise SystemExit('could not locate next changelog version section')
          end = start + rel_end
          unreleased = changelog[start:end].strip()
          if not unreleased or unreleased in {'- 暫無。', '- 暂无。'}:
              raise SystemExit('unreleased section has no substantive entries')
          release_section = f'''\n\n- 暫無。\n\n## v{version}\n\n發佈日期：{release_date}\n\nv{version} 是在 v3.11.3 基礎上的穩定整合修復版：收斂烤豬可靠性、被吃後次日懲罰體驗、豬圈日報投遞與版面，以及管理面板 KPI 視覺。依倉庫保守 SemVer 規則，本次不改公開資料／配置 schema，發佈為 patch。\n\n### 本版變更\n\n{unreleased}\n\n### 相容性\n\n- 可由 v3.11.3 直接升級；不修改 SQLite schema、Resource Protocol、插件身份或 AstrBot 最低版本。\n- 既有配置鍵 `eaten_next_day_failure_percent` 保留，數值無需遷移；其玩家語義改為「被吃後次日強制重複豬概率」。\n- 自動豬圈日報採 at-most-once 投遞：投遞結果不確定時寧可停止自動重試，管理員仍可手動 `/豬圈日報` 查看當日內容。\n'''
          changelog_path.write_text(changelog[:start] + release_section + changelog[end:], encoding='utf-8')

          notes = f'''# 今日小豬 · 增強版 v{version}\n\nv{version} 是 v3.11.3 之後的穩定整合修復版，集中改善群聊後廚、每日抽豬體驗、豬圈日報可靠性與管理面板資訊呈現。依倉庫保守 SemVer 政策，本次維持公開資料與配置契約相容，因此以 patch 版本發佈。\n\n## 群聊後廚與抽豬\n\n- `/隨機烤群友` 會先排除當日受豬身安全險保護的目標，且先成功消耗 Roast Charge 才會 @ 隨機群友；0 Charge 不再能先點名騷擾。\n- 烤群友的隨機目標與 60/30/10 結果改用插件私有 `SystemRandom`，避免同進程其他插件呼叫 `random.seed()` 污染結果；原有成功／逃跑／反噬比例不變。\n- 修復 EX 成長 mixin 與本地烤豬文案同時生效時 `render_roast_image` 的 `local_copy` 參數漂移，恢復 `/隨機烤群友` 等料理卡正常出圖。\n- 被吃後次日不再有「概率抽豬失敗並鎖整天」；沿用既有 20% 預設配置，命中時改為強制抽到已解鎖的重複豬。舊版當日已鎖玩家升級後也可恢復抽取。\n\n## 豬圈日報\n\n- 自動日報新增同群同日跨 instance 原子 delivery claim，並在真正投遞前強制持久化 `sending` 狀態。\n- 已開始平台投遞但結果不確定時標記 `uncertain` 並停止自動重試，避免 reload／timeout 後重複發送；只有 AstrBot 明確判定未找到匹配平台時才釋放 claim 允許重試。\n- 修正 1200×1280 緊湊日報中的 KPI 提示、五行搞事分布、補貨摘要與空熱豬榜溢出／錯位。\n\n## 管理面板\n\n- 五張核心 KPI 都補上與自身語義一致的 mini visualization：活躍覆蓋率、真實累計抽取軌跡、每日活躍曲線、圖鑑尺度標尺與收藏覆蓋環形進度。\n- 不使用同一組日活資料複製成多條假趨勢；缺少歷史序列時維持明確的空狀態。\n\n## 相容性\n\n- 可由 v3.11.3 直接升級。\n- 不修改 SQLite schema、Resource Protocol、插件身份或 AstrBot 最低版本（仍為 `>=4.24.2`）。\n- 保留 `eaten_next_day_failure_percent` 配置鍵與既有數值，無需配置遷移；僅調整其玩家可見效果。\n- 既有抽豬保底、EX 等級、烤豬 60/30/10 機率與 Roast Charge 容量規則保持不變。\n'''
          notes_path = Path(f'.github/release-v{version}.md')
          if notes_path.exists():
              raise SystemExit(f'{notes_path} already exists')
          notes_path.write_text(notes, encoding='utf-8')
          PY
          python scripts/maintenance_contract.py release
          git add metadata.yaml CHANGELOG.md .github/release-v3.11.4.md
          git commit -m "chore: prepare v3.11.4 release"
          git push origin HEAD:release/v3.11.4
