name: Apply gameplay event refactor

on:
  push:
    branches:
      - agent/gameplay-events
    paths:
      - .github/workflows/apply-gameplay-events-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/gameplay-events
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair patch helper marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_gameplay_events_refactor.py')
          text = path.read_text(encoding='utf-8')
          old = 'end = feature.find("    def _profile_for_report(\\n", start)'
          new = 'end = feature.find("    def _profile_for_report(", start)'
          if old not in text:
              raise SystemExit('patch helper marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply refactor
        run: python .github/scripts/apply_gameplay_events_refactor.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate focused behavior
        run: |
          python -m compileall -q main.py legacy_main.py daily_report_core.py daily_report_feature.py gameplay_events.py rollpig_core.py updater.py storage services
          pytest -q tests/test_gameplay_events.py tests/test_daily_report.py

      - name: Commit clean refactor
        run: |
          rm -f .github/scripts/apply_gameplay_events_refactor.py
          rm -f .github/workflows/apply-gameplay-events-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "refactor: 建立統一 Gameplay Event 層"
          git push origin HEAD:agent/gameplay-events
