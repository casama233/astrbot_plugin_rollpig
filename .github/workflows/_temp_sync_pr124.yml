name: Temporary sync PR 124

on:
  push:
    branches:
      - fix/compact-dynamic-help-card

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/compact-dynamic-help-card
      - name: Merge latest main while preserving compact-help conflict hunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X ours --no-edit origin/main
      - name: Validate combined help implementation
        run: |
          python -m compileall -q help_feature.py player_copy.py renderers/help.py
          python -m pip install -q pytest pillow
          pytest -q \
            tests/test_help_feature_contract.py \
            tests/test_help_renderer.py \
            tests/test_render_backpressure_contract.py \
            tests/test_wiki_product_bridge.py \
            tests/test_copy_voice_contract.py \
            tests/test_player_copy.py
      - name: Remove temporary workflow and push synchronized branch
        run: |
          rm -f .github/workflows/_temp_sync_pr124.yml
          git add -A
          git commit -m "chore: reconcile compact help with latest main" || true
          git push origin HEAD:fix/compact-dynamic-help-card
