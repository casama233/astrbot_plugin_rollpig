name: Apply simplified copy fix on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplify-user-facing-copy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runner dependencies
        run: python -m pip install --disable-pip-version-check pyyaml opencc-python-reimplemented
      - name: Execute staged codemod
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import yaml
          from pathlib import Path

          data = yaml.safe_load(Path('.github/workflows/apply-simplified-copy-fix.yml').read_text(encoding='utf-8'))
          steps = data['jobs']['apply']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Normalize bundled and runtime display copy')
          subprocess.run(['bash', '-lc', script], check=True)
          PY
      - name: Commit codemod result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize display copy to Simplified Chinese"
          git push origin HEAD:agent/simplify-user-facing-copy
