name: Apply simplified copy fix on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplify-user-facing-copy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runner dependencies
        run: python -m pip install --disable-pip-version-check opencc-python-reimplemented
      - name: Execute staged codemod
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          raw = Path('.github/workflows/apply-simplified-copy-fix.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Normalize bundled and runtime display copy\n        shell: bash\n        run: |\n'
          end_marker = '\n      - name: Commit codemod result\n'
          start = raw.index(start_marker) + len(start_marker)
          end = raw.index(end_marker, start)
          lines = raw[start:end].splitlines()
          normalized = []
          for line in lines:
              normalized.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(normalized) + '\n'
          subprocess.run(['bash', '-lc', script], check=True)
          PY
      - name: Commit codemod result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize display copy to Simplified Chinese"
          git push origin HEAD:agent/simplify-user-facing-copy
