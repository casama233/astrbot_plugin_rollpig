# Temporary, branch-scoped editing workspace; removed before the patch PR.
name: Maintenance patch workspace
on:
  push:
    branches: [maintenance/20260909-cache-recovery-fixes]
    paths:
      - .github/workflows/maintenance-workspace.yml
      - scripts/maintenance_patch_workspace.py
permissions:
  contents: read
jobs:
  patch:
    if: github.repository == 'casama233/astrbot_plugin_rollpig' && github.ref == 'refs/heads/maintenance/20260909-cache-recovery-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply exact-revision patches
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/maintenance_patch_workspace.py')
          script = path.read_text(encoding='utf-8')
          anchor = 'if len(sources[name].encode()) > len(Path(name).read_bytes()):'
          assert script.count(anchor) == 1
          adjustment = "replace(name, '事务式同步：完整下载、校验后才原子替换 active。', '完整下载、校验后才原子替换 active。')\n"
          script = script.replace(anchor, adjustment + anchor, 1)
          exec(compile(script, str(path), 'exec'), {'__name__': '__main__', '__file__': str(path)})
          PY
      - name: Test patched sources and commit only to the workspace branch
        shell: bash
        run: |
          test -f /tmp/rollpig-patch-ready
          python -m pip install -r requirements.txt pytest fonttools
          python -m compileall -q storage services resource_failover_feature.py legacy_main.py
          pytest -q
          npm ci
          npm test
          git diff --check
          git config user.name 'sama233'
          git config user.email '97009482+casama233@users.noreply.github.com'
          git add resource_failover_feature.py legacy_main.py storage/primary_manager.py pages/pig-manager/index.html tests CHANGELOG.md docs
          git commit -m 'fix: preserve cache provenance, preflight existing SQLite and label overlay sources'
          git push origin HEAD:refs/heads/maintenance/20260909-cache-recovery-fixes
