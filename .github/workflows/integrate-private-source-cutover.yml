name: Integrate Private Source Cutover

on:
  push:
    branches:
      - release/private-source-cutover-integration
    paths:
      - .github/workflows/integrate-private-source-cutover.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main-derived integration branch
        uses: actions/checkout@v6
        with:
          ref: release/private-source-cutover-integration
          fetch-depth: 0

      - name: Fetch source cutover branch
        run: git fetch origin agent/private-source-service-cutover

      - name: Reapply functional cutover commits
        run: |
          git cherry-pick a64d1962a0c0c4050b1df6e8c976fde37055fcd5
          git cherry-pick 322dcee0e4d96d57e28925b202a3eb4881b89602

      - name: Push integrated history
        run: git push origin HEAD:release/private-source-cutover-integration
