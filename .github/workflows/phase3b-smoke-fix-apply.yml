name: Phase 3B Smoke Fix Apply

on:
  push:
    branches:
      - feature/oven-refill-v3.7.0
    paths:
      - scripts/fix_phase3b_init_bool.py
      - .github/workflows/phase3b-smoke-fix-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oven-refill-v3.7.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check
      - name: Apply smoke fix
        run: python scripts/fix_phase3b_init_bool.py
      - name: Focused contracts
        run: pytest -q tests/test_oven_refill_feature_contract.py tests/test_oven_refill_service.py
      - name: Compile source
        run: python -m compileall -q main.py oven_refill_feature.py services storage
      - name: Full tests
        run: pytest -q
      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Diff check
        run: git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oven_refill_feature.py tests/test_oven_refill_feature_contract.py
          git diff --cached --check
          git commit -m "fix: make oven refill initialization self-contained"
          git push origin HEAD:feature/oven-refill-v3.7.0
