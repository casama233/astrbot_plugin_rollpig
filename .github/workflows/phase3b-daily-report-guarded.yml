name: Phase 3B Daily Report Guarded Apply

on:
  push:
    branches:
      - feature/oven-refill
    paths:
      - scripts/_apply_phase3b_daily_report.py
      - .github/workflows/phase3b-daily-report-guarded.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oven-refill
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check
      - name: Apply daily-report integration
        run: python scripts/_apply_phase3b_daily_report.py
      - name: Run focused report and refill tests
        run: pytest -q tests/test_daily_report.py tests/test_oven_refill_service.py tests/test_oven_refill_storage.py
      - name: Compile source
        run: python -m compileall -q daily_report_core.py daily_report_feature.py oven_refill_feature.py storage services
      - name: Run full test suite
        run: pytest -q
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Diff check
        run: git diff --check
      - name: Commit verified integration and remove one-shot helpers
        run: |
          git rm scripts/_apply_phase3b_daily_report.py .github/workflows/phase3b-daily-report-guarded.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: surface oven refill events in daily report"
          git push origin HEAD:feature/oven-refill
