name: Sync main before merge
on:
  push:
    branches: [fix/daily-report-at-most-once-delivery]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-report-at-most-once-delivery
          fetch-depth: 0
      - name: Merge latest main and reconcile unreleased changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          cp CHANGELOG.md /tmp/branch-changelog.md
          git show origin/main:CHANGELOG.md > /tmp/main-changelog.md
          git merge --no-ff --no-commit origin/main || true
          python - <<'PY'
          from pathlib import Path
          def bullets(text):
              m='## 未發佈'; s=text.index(m)+len(m); tail=text[s:]; e=tail.find('\n## '); block=tail if e<0 else tail[:e]
              return [x.strip() for x in block.splitlines() if x.strip().startswith('- ') and x.strip()!='- 暫無。']
          main=Path('/tmp/main-changelog.md').read_text(encoding='utf-8'); branch=Path('/tmp/branch-changelog.md').read_text(encoding='utf-8'); items=[]
          for x in bullets(main)+bullets(branch):
              if x not in items: items.append(x)
          m='## 未發佈'; s=main.index(m)+len(m); tail=main[s:]; re=tail.find('\n## '); e=len(main) if re<0 else s+re
          Path('CHANGELOG.md').write_text(main[:s]+'\n\n'+('\n'.join(items) if items else '- 暫無。')+'\n'+main[e:],encoding='utf-8')
          PY
          git add CHANGELOG.md
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then echo "$unresolved"; exit 1; fi
          git add -A
          git commit -m "chore: sync main before merge"
          git push origin HEAD:fix/daily-report-at-most-once-delivery
