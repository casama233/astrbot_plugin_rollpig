name: Sync main before merge

on:
  push:
    branches:
      - fix/kpi-balanced-mini-visuals

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kpi-balanced-mini-visuals
          fetch-depth: 0
      - name: Merge latest main and reconcile unreleased changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          cp CHANGELOG.md /tmp/branch-changelog.md
          git show origin/main:CHANGELOG.md > /tmp/main-changelog.md
          git merge --no-ff --no-commit origin/main || true
          python - <<'PY'
          from pathlib import Path

          def unreleased_bullets(text: str) -> list[str]:
              marker = '## 未發佈'
              start = text.index(marker) + len(marker)
              tail = text[start:]
              end = tail.find('\n## ')
              block = tail if end < 0 else tail[:end]
              return [
                  line.strip()
                  for line in block.splitlines()
                  if line.strip().startswith('- ') and line.strip() != '- 暫無。'
              ]

          main = Path('/tmp/main-changelog.md').read_text(encoding='utf-8')
          branch = Path('/tmp/branch-changelog.md').read_text(encoding='utf-8')
          bullets = []
          for item in unreleased_bullets(main) + unreleased_bullets(branch):
              if item not in bullets:
                  bullets.append(item)
          marker = '## 未發佈'
          start = main.index(marker) + len(marker)
          tail = main[start:]
          rel_end = tail.find('\n## ')
          end = len(main) if rel_end < 0 else start + rel_end
          replacement = '\n\n' + ('\n'.join(bullets) if bullets else '- 暫無。') + '\n'
          combined = main[:start] + replacement + main[end:]
          Path('CHANGELOG.md').write_text(combined, encoding='utf-8')
          PY
          git add CHANGELOG.md
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge conflicts remain:"
            echo "$unresolved"
            exit 1
          fi
          git add -A
          git commit -m "chore: sync main before merge"
          git push origin HEAD:fix/kpi-balanced-mini-visuals
