name: Prepare v3.6.1 hotfix

on:
  push:
    branches:
      - hotfix/v3.6.1-command-resource-recovery
    paths:
      - .github/workflows/prepare-v361-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/v3.6.1-command-resource-recovery
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply targeted hotfix
        run: python .github/scripts/prepare_v361_hotfix.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit

      - name: Compile source
        run: |
          python -m compileall -q main.py legacy_main.py daily_report_core.py daily_report_feature.py gameplay_events.py ex_variants.py ex_variant_feature.py roast_reservations.py roast_reservation_feature.py rollpig_core.py updater.py storage services tests/test_v361_hotfix_contract.py

      - name: Run regression suite
        run: pytest -q

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Commit verified hotfix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy_main.py main.py daily_report_feature.py CHANGELOG.md tests/test_v361_hotfix_contract.py
          git commit -m "fix: claim commands and recover missing pig images"
          git push origin HEAD:hotfix/v3.6.1-command-resource-recovery
