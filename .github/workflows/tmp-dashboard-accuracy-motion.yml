name: Temporary dashboard accuracy and motion audit
on:
  push:
    branches: [feat/dashboard-accuracy-motion-v1]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
      - name: Apply dashboard accuracy audit
        run: python scripts/tmp_dashboard_accuracy_patch.py
      - name: Apply dashboard motion redesign
        run: python scripts/tmp_dashboard_motion_patch.py
      - name: Correct generated UI contracts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('tests/test_dashboard_accuracy_contract.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'assert "ready + failed" in source or "ready||0) + Number(ai.failed" in source',
              'assert "Number(ai.ready || 0) + Number(ai.failed || 0)" in source',
          )
          path.write_text(text, encoding='utf-8')

          for name in ('test_analytics_spa_remount.py', 'test_ui_asset_delivery.py'):
              test_path = Path('tests') / name
              test_path.write_text(
                  test_path.read_text(encoding='utf-8').replace('3.1.2', '3.2.0'),
                  encoding='utf-8',
              )

          page_path = Path('pages/pig-manager/index.html')
          bootstrap_path = Path('pages/pig-manager/ui-bootstrap.js')
          page = page_path.read_text(encoding='utf-8')
          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          replacement = f'<script data-rollpig-bootstrap="3.2.0">{bootstrap}</script>'
          page, count = re.subn(
              r'<script data-rollpig-bootstrap="[^"]+">.*?</script>',
              lambda _: replacement,
              page,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('inline bootstrap marker not found')
          page_path.write_text(page, encoding='utf-8')
          check = re.search(r'<script data-rollpig-bootstrap="3.2.0">(.*?)</script>', page, re.S)
          assert check and check.group(1).strip() == bootstrap.strip()
          PY
      - name: Check JavaScript syntax
        run: |
          node --check pages/pig-manager/ui-bootstrap.js
          node --check pages/pig-manager/ui-analytics.js
          python - <<'PY'
          import re
          from pathlib import Path
          page = Path('pages/pig-manager/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?: [^>]*)?>(.*?)</script>', page, re.S)
          for i, source in enumerate(scripts):
              if not source.strip():
                  continue
              Path(f'/tmp/rollpig-inline-{i}.js').write_text(source, encoding='utf-8')
          print(f'inline scripts extracted: {len(scripts)}')
          PY
          for f in /tmp/rollpig-inline-*.js; do node --check "$f"; done
      - name: Compile Python source
        run: python -m compileall -q main.py legacy_main.py storage services source_service renderers
      - name: Accuracy contracts
        run: pytest -q tests/test_dashboard_accuracy_contract.py
      - name: SQL overview analytics
        run: pytest -q tests/test_dashboard_sql_analytics.py
      - name: Deep analytics
        run: pytest -q tests/test_dashboard_insights.py
      - name: New unlock projection
        run: pytest -q tests/test_new_unlock_trend.py
      - name: Analytics readability
        run: pytest -q tests/test_analytics_readability.py
      - name: Analytics bridge
        run: pytest -q tests/test_analytics_bridge_bootstrap.py
      - name: Analytics SPA remount
        run: pytest -q tests/test_analytics_spa_remount.py
      - name: UI asset delivery
        run: pytest -q tests/test_ui_asset_delivery.py
      - name: UI cache busting
        run: pytest -q tests/test_ui_cache_busting.py
      - name: Run full tests
        run: pytest -q
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Check diff
        run: git diff --check
      - name: Commit formal dashboard audit
        run: |
          rm -f scripts/tmp_dashboard_accuracy_patch.py scripts/tmp_dashboard_motion_patch.py .github/workflows/tmp-dashboard-accuracy-motion.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: calibrate dashboard facts and motion'
          git push origin HEAD:${GITHUB_REF_NAME}
