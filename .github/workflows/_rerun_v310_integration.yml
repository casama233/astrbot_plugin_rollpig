name: Prepare v3.10.0 release metadata

on:
  push:
    branches:
      - release/v3.10.0-integration
    paths:
      - .github/workflows/_rerun_v310_integration.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.10.0-integration
          fetch-depth: 0
      - name: Configure committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Prepare stable release files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          metadata = Path('metadata.yaml')
          text = metadata.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^version:\s*"3\.9\.1"\s*$', 'version: "3.10.0"', text, count=1)
          if count != 1:
              raise SystemExit('metadata version marker not found')
          metadata.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          start = text.index('## 未發佈\n')
          next_heading = text.index('\n## v3.9.1 ', start)
          release_body = '''## 未發佈\n\n- 暫無。\n\n## v3.10.0 (2026-08-17)\n\nv3.10.0 是一次功能整合版本：收斂目前仍有獨立價值的待合工作，補齊動畫 GIF、EX 預覽、AI 小豬工坊與群聊回覆識別，同時把今天已完成但尚未正式版本化的文案、管理分析與維護門禁一起納入穩定版。\n\n### 動畫 GIF 與公共豬源\n\n- PigHub／手動上傳的真正動畫 GIF 不再被單幀轉成 PNG；抽到動畫小豬時會逐幀合成完整 800×800 小豬卡並保留幀時長與循環設定。\n- EX 差分支援 `.gif`，本地保存、公共豬源投稿、審核預覽與發布均按實際格式保留動畫；管理縮圖仍使用輕量靜態 PNG。\n- 動畫加入 10 MiB、25 MP、8192 邊長、240 幀與 60 秒等安全上限；公共豬源服務端同步升級為 2.2.0。\n\n### EX 成長管理\n\n- 「實際生效預覽」同步顯示最終生效圖片與來源，支援未儲存本地圖片即時預覽，以及移除圖片後對稀疏繼承／公共 EX／基礎圖回退結果的模擬。\n- 新增 Base ↔ EX 圖文對比、圖片放大與更清楚的 chat-card 視覺，不改 EX 等級計算與既有稀疏繼承語義。\n\n### AI 小豬工坊\n\n- Pig Manager 新增 AI 小豬工坊：文字策劃復用 AstrBot 當前 AI Provider，可批量產生名稱、ID、視覺特徵、短描述與完整圖鑑文案。\n- 可選現有圖鑑小豬作生圖參考，完整圖片先保存在服務端短期草稿，支援按反饋重畫；只有管理員確認後才寫入本地圖鑑。\n- 生圖 API Key 不回傳瀏覽器；Base URL 預設要求 HTTPS，遠端生成圖只允許與生圖 API 同 hostname 的 HTTPS 地址，避免任意 URL 下載。\n\n### 群聊與烤豬體驗\n\n- 所有 RollPig 群聊指令的第一條機器人回覆在最上方單獨標示 `@指令發起者`；原有玩法目標 `@` 繼續保留，私聊不新增多餘提及。\n- 重做烤豬文案系統：內置 32 菜名 × 79 條豬言豬語正文，共 2,528 組；同群最近 24 次文案組合防重複，並支援 Resource Protocol v1 可選 `roast_copy` 同步。\n- AI 烤豬文案改為豬圈世界觀 prompt：每隻豬每天仍只調用模型一次，但一次生成最多 4 條候選，七日池最多 28 條，兼容舊單條快取並加入近期防重複。\n- `/豬豬幫助` 補充 `@` 指令輸入提示，提醒玩家手動輸入指令後再選擇群友，避免直接複製「指令 + @」失去結構化 At。\n\n### 管理、文檔與工程品質\n\n- 修正管理面板 KPI 迷你圖資料語義：累計抽取改為真實近 14 日每日抽取；沒有歷史序列的快照指標不再展示偽趨勢。\n- README 首屏加入 AI 生成代碼風險提示，明確建議重要環境部署前自行審查與測試。\n- PR／Release 維護門禁要求 Changelog 與 Wiki-Impact；canonical 指令或配置 schema 改動必須同步 Wiki。\n- CI 移除重複／低價值檢查，保留 Python 3.12、Marketplace Package、AstrBot 官方載入、Changelog/Wiki 與 pre-commit 等實質發布門禁。\n\n### 本版整合工作\n\n- #135 — 群聊指令首條回覆標示發起者。\n- #137 — CI 去重與發布門禁收斂。\n- #140 — AI 小豬工坊。\n- #142 — 動畫 GIF 小豬端到端支援。\n- #143 — EX 實際生效圖片預覽。\n- #144 — EX Base ↔ EX 對比、放大與第二階段預覽。\n- 公共豬源服務 #10 — GIF／EX GIF 服務端端到端支援。\n\n### 相容性\n\n- 可由 v3.9.1 直接升級。\n- SQLite schema 不變。\n- Resource Protocol 維持 v1；公共豬源 submission envelope 維持 v2。\n- 抽豬概率、新豬保底、跨日疲勞保底、EX 等級與 Roast Charge 規則不變。\n\n### 驗證\n\n- 整合樹全量 pytest：453 passed。\n- pre-commit：全部通過。\n- 各來源 PR 的 Python／Marketplace／AstrBot smoke 已逐一審查；最終 Release PR 再跑合併後正式門禁。\n'''
          text = text[:start] + release_body + text[next_heading + 1:]
          changelog.write_text(text, encoding='utf-8')

          notes = Path('.github/release-v3.10.0.md')
          notes.write_text('''# 今日小豬 · 增強版 v3.10.0\n\n這是一個整合型功能版本，將目前仍有獨立價值的待合工作集中收斂並完成組合回歸。\n\n## 主要更新\n\n- **動畫 GIF 小豬端到端支援**：PigHub／手動上傳、EX 差分、公共豬源、審核與完整小豬卡均可保留動畫。\n- **AI 小豬工坊**：復用 AstrBot AI Provider 批量策劃，支援圖鑑參考生圖、短期草稿、反饋重畫及確認後入庫。\n- **EX 預覽升級**：實際生效圖片來源、未儲存模擬、Base ↔ EX 圖文對比與圖片放大。\n- **群聊回覆識別**：RollPig 指令第一條群聊回覆會單獨標示發起者，原玩法目標提及不受影響。\n- **烤豬與管理品質**：2,528 組內置烤豬文案、AI 候選池、KPI 趨勢語義修正、幫助 At 提示與更精簡的 CI。\n\n## GIF 公共豬源配套\n\n公共豬源服務端已同步升級到 **2.2.0**，保留基礎 GIF 與 EX GIF 的投稿、審核、catalog 與 Resource Protocol v1 發布鏈路。\n\n## 安全與相容性\n\n- 動畫 GIF 受檔案大小、尺寸、幀數及總時長限制。\n- AI 小豬工坊不會把已保存的生圖 API Key 回傳瀏覽器，遠端生成圖限制為同源 HTTPS。\n- SQLite schema、Resource Protocol v1、抽豬概率、保底、EX 等級與 Roast Charge 規則均不變。\n- 可由 v3.9.1 直接升級。\n\n## 驗證\n\n整合分支在發版前完成 **453 項 pytest 全通過**及 **pre-commit 全通過**；正式 Release PR 另跑 Marketplace Package、AstrBot Market Smoke 與發布維護門禁。\n''', encoding='utf-8')
          PY
          git add metadata.yaml CHANGELOG.md .github/release-v3.10.0.md
          git commit -m "release: prepare v3.10.0"
      - name: Validate stable release contract
        run: |
          python scripts/maintenance_contract.py coverage
          python scripts/maintenance_contract.py release
          python -m pip install -r requirements.txt pytest pre-commit
          python -m py_compile main.py
          pytest -q
          pre-commit run --all-files
      - name: Push release preparation
        run: git push origin HEAD:release/v3.10.0-integration
