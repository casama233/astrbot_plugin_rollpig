name: Validate roast reservations

on:
  push:
    branches:
      - feature/roast-reservations
    paths:
      - .github/workflows/validate-roast-reservations.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/roast-reservations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile focused modules
        run: python -m compileall -q main.py roast_reservations.py roast_reservation_feature.py daily_report_feature.py ex_variant_feature.py gameplay_events.py
      - name: Run focused tests
        run: pytest -q tests/test_roast_reservations.py tests/test_daily_report.py tests/test_gameplay_events.py tests/test_ex_variants.py
