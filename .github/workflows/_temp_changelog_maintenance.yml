name: Temp Changelog Maintenance

on:
  push:
    branches:
      - chore/enforce-pr-docs-changelog

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/enforce-pr-docs-changelog

      - name: Update unreleased changelog and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          old = '## 未發佈\n\n- 暫無。\n'
          new = '''## 未發佈

- `/豬豬幫助` 新增 `@` 指令輸入提示：請手動輸入指令後再選擇群友，直接複製他人的整條「指令 + @」消息可能無法被 AstrBot 當成結構化 At 指令識別（#134）。
- 新增 PR／Release 文檔維護門禁：每個 PR 都必須新增 Changelog 記錄並聲明 `Wiki-Impact`；canonical 指令與配置 schema 變更必須同步對應 Wiki，Release 在打包前會再次驗證版本 Changelog、Release Notes 與 Wiki 覆蓋。
'''
          if old not in text:
              raise SystemExit('expected unreleased placeholder not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/_temp_changelog_maintenance.yml

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md .github/workflows/_temp_changelog_maintenance.yml
          git commit -m "docs: maintain unreleased changelog"
          git push origin HEAD:chore/enforce-pr-docs-changelog
