name: Agent RollPig Identity Migration

on:
  push:
    branches:
      - agent/rollpig-safe-identity-migration
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-bridge:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/rollpig-safe-identity-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/rollpig-safe-identity-migration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v3.1.4 migration bridge
        shell: bash
        run: |
          cat > /tmp/patch_bridge.py <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once("metadata.yaml", 'version: "3.1.3"', 'version: "3.1.4"')

          for path in (
              "main.py",
              "updater.py",
              "tests/test_v312_release_contract.py",
              "tests/test_source_regressions.py",
          ):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if "3.1.3" not in text:
                  raise SystemExit(f"{path}: expected current version marker 3.1.3")
              target.write_text(text.replace("3.1.3", "3.1.4"), encoding="utf-8")

          replace_once(
              "updater.py",
              "        current = self.current_version()\n        html_url = str(payload.get(\"html_url\") or \"\")\n",
              "        current = self.current_version()\n"
              "        if self._version_tuple(latest) >= (3, 2, 0):\n"
              "            raise UpdateError(\n"
              "                \"检测到今日小猪增强版已切换到新的插件身份；旧插件禁止直接覆盖安装 3.2.0+。\"\n"
              "                \"请从 AstrBot 插件市场安装「今日小猪 · 增强版」新包，完成数据迁移后再停用旧包。\"\n"
              "            )\n"
              "        html_url = str(payload.get(\"html_url\") or \"\")\n",
          )

          replace_once(
              "storage/manager.py",
              "class StorageManager:\n    \"\"\"Select, migrate, verify, export and roll back the storage backend.\"\"\"\n\n    MANAGED_PATHS = {\n",
              "class StorageManager:\n    \"\"\"Select, migrate, verify, export and roll back the storage backend.\"\"\"\n\n"
              "    IDENTITY_BRIDGE_MARKER = \".rollpig-enhanced-origin.json\"\n"
              "    IDENTITY_BRIDGE_VERSION = \"3.1.4\"\n\n"
              "    MANAGED_PATHS = {\n",
          )
          replace_once(
              "storage/manager.py",
              "        self.backup_root.mkdir(parents=True, exist_ok=True)\n        self.export_root.mkdir(parents=True, exist_ok=True)\n        self._last_error = \"\"\n",
              "        self.backup_root.mkdir(parents=True, exist_ok=True)\n"
              "        self.export_root.mkdir(parents=True, exist_ok=True)\n"
              "        self._write_identity_bridge_marker()\n"
              "        self._last_error = \"\"\n",
          )
          replace_once(
              "storage/manager.py",
              "    def _new_sqlite(self, path: Path | None = None) -> SQLiteStorage:\n",
              "    def _write_identity_bridge_marker(self) -> None:\n"
              "        \"\"\"Mark data created by the independently maintained enhanced fork.\n\n"
              "        The marker is deliberately written only to the historical data namespace.\n"
              "        It lets the future rollpig_plus package distinguish this fork's data from\n"
              "        MegSopern's original plugin before attempting any automatic migration.\n"
              "        \"\"\"\n"
              "        if self.data_root.name != \"astrbot_plugin_rollpig\":\n"
              "            return\n"
              "        marker = self.data_root / self.IDENTITY_BRIDGE_MARKER\n"
              "        payload = {\n"
              "            \"schema_version\": 1,\n"
              "            \"source_repository\": \"casama233/astrbot_plugin_rollpig\",\n"
              "            \"source_plugin_name\": \"astrbot_plugin_rollpig\",\n"
              "            \"bridge_version\": self.IDENTITY_BRIDGE_VERSION,\n"
              "            \"migration_target\": \"casama233/astrbot_plugin_rollpig_plus\",\n"
              "            \"written_at\": int(time.time()),\n"
              "        }\n"
              "        temporary = self.data_root / (\n"
              "            f\".{self.IDENTITY_BRIDGE_MARKER}.{uuid.uuid4().hex}.tmp\"\n"
              "        )\n"
              "        try:\n"
              "            temporary.write_text(\n"
              "                json.dumps(payload, ensure_ascii=False, indent=2) + \"\\n\",\n"
              "                encoding=\"utf-8\",\n"
              "            )\n"
              "            os.replace(temporary, marker)\n"
              "        finally:\n"
              "            temporary.unlink(missing_ok=True)\n\n"
              "    def _new_sqlite(self, path: Path | None = None) -> SQLiteStorage:\n",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          header = "# 更新\n\n"
          if not text.startswith(header):
              raise SystemExit("CHANGELOG.md: unexpected header")
          entry = (
              "## v3.1.4 (2026-08-11)\n\n"
              "### 插件身份迁移桥接\n\n"
              "- 为现有增强版数据目录写入原子化来源标记，供后续 `astrbot_plugin_rollpig_plus` 安全识别，避免误迁移原版插件数据。\n"
              "- 安全更新器遇到 `3.2.0+` 新插件身份时拒绝原地覆盖，改为提示从 AstrBot 插件市场安装新包并迁移。\n"
              "- 保持当前插件名、数据目录和配置命名不变，本版本只建立迁移桥，不搬动或删除任何用户数据。\n\n"
          )
          changelog.write_text(header + entry + text[len(header):], encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          anchor = "## 📦 安装："
          if anchor not in text:
              raise SystemExit("README.md: install heading not found")
          notice = (
              "## 🔄 插件身份迁移说明\n\n"
              "从 v3.1.4 起，本增强分支进入独立插件身份迁移阶段。v3.1.4 本身不会移动或删除现有数据；"
              "未来 `3.2.0+` 将以 `casama233/astrbot_plugin_rollpig_plus` 独立身份发布，并通过验证后复制旧增强版数据，"
              "避免与 MegSopern 原版共用数据目录。旧版内置更新器不会直接覆盖安装新身份。\n\n"
          )
          readme.write_text(text.replace(anchor, notice + anchor, 1), encoding="utf-8")

          Path("tests/test_identity_migration_bridge.py").write_text(
              '''import json\nfrom pathlib import Path\n\nfrom storage import StorageManager\n\n\ndef test_bridge_marker_identifies_enhanced_legacy_namespace(tmp_path: Path):\n    legacy = tmp_path / "astrbot_plugin_rollpig"\n    StorageManager(legacy, mode="json")\n    marker = legacy / ".rollpig-enhanced-origin.json"\n    assert marker.is_file()\n    payload = json.loads(marker.read_text(encoding="utf-8"))\n    assert payload["source_repository"] == "casama233/astrbot_plugin_rollpig"\n    assert payload["source_plugin_name"] == "astrbot_plugin_rollpig"\n    assert payload["bridge_version"] == "3.1.4"\n    assert payload["migration_target"] == "casama233/astrbot_plugin_rollpig_plus"\n\n\ndef test_bridge_marker_is_not_written_to_future_namespace(tmp_path: Path):\n    future = tmp_path / "astrbot_plugin_rollpig_plus"\n    StorageManager(future, mode="json")\n    assert not (future / ".rollpig-enhanced-origin.json").exists()\n\n\ndef test_bridge_release_keeps_legacy_identity():\n    metadata = Path("metadata.yaml").read_text(encoding="utf-8")\n    assert 'name: "astrbot_plugin_rollpig"' in metadata\n    assert 'author: "MegSopern, casama233"' in metadata\n    assert 'version: "3.1.4"' in metadata\n    updater = Path("updater.py").read_text(encoding="utf-8")\n    assert "self._version_tuple(latest) >= (3, 2, 0)" in updater\n    assert "禁止直接覆盖安装 3.2.0+" in updater\n''',
              encoding="utf-8",
          )
          PY
          python /tmp/patch_bridge.py
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          npm ci
      - name: Validate bridge
        run: |
          python -m pytest -q
          npm test
          python -m compileall -q main.py updater.py services storage
      - name: Commit verified bridge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-rollpig-identity-migration.yml
          git add metadata.yaml main.py updater.py storage/manager.py CHANGELOG.md README.md tests
          git commit -m "release: add v3.1.4 identity migration bridge"
          git push origin HEAD:agent/rollpig-safe-identity-migration
