name: Robustly finalize RollPig P1 release gate

on:
  push:
    branches:
      - fix/p1-release-ci-gate
    paths:
      - .github/workflows/p1-release-gate-bootstrap-robust.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact repair revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          BRANCH: fix/p1-release-ci-gate
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${REVISION}"
          git checkout -B "${BRANCH}" FETCH_HEAD

      - name: Generate candidate workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/p1-release-gate-bootstrap.yml').read_text(encoding='utf-8')
          start_marker = (
              '      - name: Write tested-SHA release gate and regression contract\n'
              '        run: |\n'
          )
          end_marker = '\n      - name: Run focused workflow contract\n'
          if start_marker not in source or end_marker not in source:
              raise SystemExit('无法定位已审计的工作流生成器')

          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          block = dedent(block)
          for old, new in (
              ('ci = ci.replace("          ", "")', 'ci = ci'),
              ('release = release.replace("          ", "")', 'release = release'),
              ('test = test.replace("          ", "")', 'test = test'),
          ):
              if old not in block:
                  raise SystemExit(f'无法定位生成器修正点: {old}')
              block = block.replace(old, new, 1)
          Path('/tmp/apply-release-gate.sh').write_text(block, encoding='utf-8')
          PY
          bash /tmp/apply-release-gate.sh

      - name: Replace fragile inline metadata parser
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          release_path = Path('.github/workflows/release.yml')
          release = release_path.read_text(encoding='utf-8')
          start_token = '- name: Resolve stable release metadata'
          end_token = '- name: Enforce release changelog and Wiki contract'

          try:
              name_index = release.index(start_token)
              next_name_index = release.index(end_token, name_index)
          except ValueError as exc:
              raise SystemExit('无法定位 Release metadata 步骤边界') from exc

          start_index = release.rfind('\n', 0, name_index) + 1
          end_index = release.rfind('\n', 0, next_name_index) + 1
          indent = release[start_index:name_index]
          if indent.strip():
              raise SystemExit('Release metadata 步骤前存在异常非空缩进内容')

          replacement = (
              f'{indent}- name: Resolve stable release metadata\n'
              f"{indent}  if: steps.current.outputs.current == 'true'\n"
              f'{indent}  id: meta\n'
              f'{indent}  run: python scripts/release_metadata.py >> "$GITHUB_OUTPUT"\n\n'
          )
          release = release[:start_index] + replacement + release[end_index:]
          release_path.write_text(release, encoding='utf-8')

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          compile_marker = 'scripts/maintenance_contract.py scripts/check_display_copy.py'
          if compile_marker not in ci:
              raise SystemExit('无法定位 CI compileall 脚本清单')
          ci = ci.replace(
              compile_marker,
              'scripts/maintenance_contract.py scripts/release_metadata.py scripts/check_display_copy.py',
              1,
          )
          ci_path.write_text(ci, encoding='utf-8')

          parser = dedent('''\
          from __future__ import annotations

          from pathlib import Path
          from string import ascii_letters, digits
          from typing import Mapping


          REQUIRED_FIELDS = ("name", "display_name", "version")
          SAFE_PLUGIN_NAME = frozenset(ascii_letters + digits + "_.-")


          def parse_metadata(text: str) -> dict[str, str]:
              fields: dict[str, str] = {}
              for raw_line in text.splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#") or ":" not in line:
                      continue
                  key, value = line.split(":", 1)
                  fields[key.strip()] = value.strip().strip('"').strip("'")

              missing = [name for name in REQUIRED_FIELDS if not fields.get(name)]
              if missing:
                  raise ValueError(
                      "metadata.yaml missing required fields: " + ", ".join(missing)
                  )

              version = fields["version"]
              parts = version.split(".")
              if len(parts) != 3 or not all(part and part.isdigit() for part in parts):
                  raise ValueError("metadata.yaml must contain a stable x.y.z version")

              plugin_name = fields["name"]
              if any(character not in SAFE_PLUGIN_NAME for character in plugin_name):
                  raise ValueError("metadata.yaml contains an unsafe plugin name")
              return fields


          def build_outputs(fields: Mapping[str, str]) -> dict[str, str]:
              version = fields["version"]
              plugin_name = fields["name"]
              return {
                  "version": version,
                  "tag": f"v{version}",
                  "plugin_name": plugin_name,
                  "display_name": fields["display_name"],
                  "archive": f"{plugin_name}-v{version}.zip",
              }


          def main() -> None:
              fields = parse_metadata(
                  Path("metadata.yaml").read_text(encoding="utf-8")
              )
              for key, value in build_outputs(fields).items():
                  print(f"{key}={value}")


          if __name__ == "__main__":
              main()
          ''')
          Path('scripts/release_metadata.py').write_text(parser, encoding='utf-8')

          parser_test = dedent('''\
          from __future__ import annotations

          import importlib.util
          from pathlib import Path

          import pytest


          ROOT = Path(__file__).resolve().parents[1]
          SPEC = importlib.util.spec_from_file_location(
              "rollpig_release_metadata",
              ROOT / "scripts/release_metadata.py",
          )
          assert SPEC and SPEC.loader
          MODULE = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(MODULE)


          def test_stable_metadata_outputs_are_deterministic():
              fields = MODULE.parse_metadata(
                  'name: astrbot_plugin_rollpig\n'
                  'display_name: 豬豬源\n'
                  'version: "3.12.0"\n'
              )
              assert MODULE.build_outputs(fields) == {
                  "version": "3.12.0",
                  "tag": "v3.12.0",
                  "plugin_name": "astrbot_plugin_rollpig",
                  "display_name": "豬豬源",
                  "archive": "astrbot_plugin_rollpig-v3.12.0.zip",
              }


          @pytest.mark.parametrize("version", ["3.12", "v3.12.0", "3.12.0-rc1"])
          def test_non_stable_versions_are_rejected(version):
              with pytest.raises(ValueError, match="stable x.y.z"):
                  MODULE.parse_metadata(
                      f'name: astrbot_plugin_rollpig\n'
                      f'display_name: 豬豬源\n'
                      f'version: "{version}"\n'
                  )


          def test_empty_version_is_rejected_as_missing():
              with pytest.raises(ValueError, match="missing required fields: version"):
                  MODULE.parse_metadata(
                      'name: astrbot_plugin_rollpig\n'
                      'display_name: 豬豬源\n'
                      'version: ""\n'
                  )


          def test_unsafe_plugin_name_is_rejected():
              with pytest.raises(ValueError, match="unsafe plugin name"):
                  MODULE.parse_metadata(
                      'name: ../rollpig\n'
                      'display_name: 豬豬源\n'
                      'version: 3.12.0\n'
                  )
          ''')
          Path('tests/test_release_metadata.py').write_text(parser_test, encoding='utf-8')
          PY

      - name: Install focused validation dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Parse workflows and run release tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              Path('.github/workflows/ci.yml'),
              Path('.github/workflows/release.yml'),
          ):
              document = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(document, dict) or 'jobs' not in document:
                  raise SystemExit(f'{path} is not a valid workflow mapping')
          PY
          python -m pytest -q \
            tests/test_release_workflow_contract.py \
            tests/test_release_metadata.py
          python scripts/release_metadata.py > /tmp/release-metadata.out
          grep -Fx 'tag=v3.12.0' /tmp/release-metadata.out

      - name: Commit generated repair
        env:
          BRANCH: fix/p1-release-ci-gate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            scripts/release_metadata.py \
            tests/test_release_workflow_contract.py \
            tests/test_release_metadata.py \
            CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m "fix(P1): gate releases on the tested CI revision"
          git push origin "HEAD:${BRANCH}"
