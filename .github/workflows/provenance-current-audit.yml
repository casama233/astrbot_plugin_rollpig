name: Current Provenance Audit

on:
  push:
    branches:
      - audit/resource-provenance-restoration
    paths:
      - .github/workflows/provenance-current-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read current provenance and pinned MIT resource
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import urllib.parse
          import urllib.request

          headers = {
              "User-Agent": "AstrBot-RollPig/3.11.5 (+https://github.com/casama233/astrbot_plugin_rollpig)",
              "X-RollPig-Client": "astrbot_plugin_rollpig_plus",
              "X-RollPig-Protocol": "1",
              "Accept": "application/json, application/octet-stream;q=0.9, */*;q=0.1",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          }

          def get(url, h=None):
              req = urllib.request.Request(url, headers=h or {})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          manifest_url = "https://curryudon.top/astrbot-rollpig/v1/manifest.json"
          manifest = json.loads(get(manifest_url, headers).decode("utf-8-sig"))
          print("MANIFEST_KEYS=" + json.dumps(sorted(manifest), ensure_ascii=False))
          print("MANIFEST=" + json.dumps(manifest, ensure_ascii=False, sort_keys=True))

          for candidate in ("provenance", "provenance_json", "provenance_file"):
              meta = manifest.get(candidate)
              if isinstance(meta, dict) and meta.get("path"):
                  raw = get(urllib.parse.urljoin(manifest_url, meta["path"]), headers)
                  expected = str(meta.get("sha256") or "").strip().lower()
                  actual = hashlib.sha256(raw).hexdigest()
                  if expected and expected != actual:
                      raise SystemExit(f"{candidate} sha mismatch")
                  data = json.loads(raw.decode("utf-8-sig"))
                  print("CURRENT_PROVENANCE=" + json.dumps(data, ensure_ascii=False, sort_keys=True))
                  break
          else:
              for path in ("PROVENANCE.json", "provenance.json"):
                  try:
                      raw = get(urllib.parse.urljoin(manifest_url, path), headers)
                  except Exception:
                      continue
                  data = json.loads(raw.decode("utf-8-sig"))
                  print("CURRENT_PROVENANCE=" + json.dumps(data, ensure_ascii=False, sort_keys=True))
                  break

          elephant_url = (
              "https://raw.githubusercontent.com/Felis2026/nonebot-plugin-rollpig-plus/"
              "22b5357c3b6ae87fa5b048304cfab6913d83dda1/"
              "nonebot_plugin_rollpig_plus/resource/image/elephant-pig.png"
          )
          raw = get(elephant_url, {"User-Agent": headers["User-Agent"]})
          print("ELEPHANT_SIZE=" + str(len(raw)))
          print("ELEPHANT_SHA256=" + hashlib.sha256(raw).hexdigest())
          print("ELEPHANT_GIT_BLOB_SHA1=" + hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest())
          PY
