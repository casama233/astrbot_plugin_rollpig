name: Apply audit fixes

on:
  push:
    branches:
      - agent/fix-audit-findings-v2.4.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-audit-fixes-v2.4.0
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-audit-findings-v2.4.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate patch scripts
        run: python -m py_compile scripts/prepare_audit_patcher.py scripts/apply_audit_fixes.py scripts/postprocess_audit_fixes.py scripts/finalize_catalog_transactions.py

      - name: Apply guarded fixes
        run: |
          python scripts/prepare_audit_patcher.py
          python scripts/apply_audit_fixes.py
          python scripts/postprocess_audit_fixes.py
          python scripts/finalize_catalog_transactions.py

      - name: Validate generated source
        run: |
          python -m pip install --upgrade pip pytest
          python -m compileall -q main.py rollpig_core.py
          pytest -q

      - name: Remove one-shot migration files
        run: |
          git rm scripts/prepare_audit_patcher.py scripts/apply_audit_fixes.py scripts/postprocess_audit_fixes.py scripts/finalize_catalog_transactions.py
          git rm .github/workflows/apply-audit-fixes.yml

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden state identity sync and dashboard"
          git push origin HEAD:agent/fix-audit-findings-v2.4.0
