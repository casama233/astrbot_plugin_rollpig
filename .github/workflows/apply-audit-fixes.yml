name: Apply audit fixes

on:
  push:
    branches:
      - agent/fix-audit-findings-v2.4.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-audit-fixes-v2.4.0
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-audit-findings-v2.4.0
          fetch-depth: 0

      - name: Detect post-review patch
        id: guard
        run: |
          if [ -f scripts/post_review_fixes.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply guarded corrections
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m py_compile scripts/post_review_fixes.py
          python scripts/post_review_fixes.py

      - name: Validate corrected source
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip pytest
          python -m compileall -q main.py rollpig_core.py
          pytest -q

      - name: Commit validated corrections
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/post_review_fixes.py
          git add -A
          git diff --cached --check
          git commit -m "fix: address post-review regressions"
          git push origin HEAD:agent/fix-audit-findings-v2.4.0
