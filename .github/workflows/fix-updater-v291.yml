name: Fix updater v2.9.1

on:
  push:
    branches:
      - agent/fix-updater-compare-digest-v2.9.1

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-updater-compare-digest-v2.9.1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply hotfix
        run: python .github/scripts/fix_updater_v291.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Validate hotfix
        run: |
          python -m compileall -q main.py rollpig_core.py updater.py storage
          pytest -q
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use hmac.compare_digest in safe updater"
          git push origin HEAD:agent/fix-updater-compare-digest-v2.9.1
