name: Integrate v3.10.0 open PRs

on:
  push:
    branches:
      - release/v3.10.0-integration
    paths:
      - .github/workflows/_integrate_v310_open_prs.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.10.0-integration
          fetch-depth: 0
      - name: Configure committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Integrate reviewed PR deltas
        shell: bash
        run: |
          set -euo pipefail
          apply_delta() {
            local base="$1" head="$2" label="$3"; shift 3
            echo "==> applying ${label}"
            git diff --binary "$base" "$head" -- . ':(exclude)CHANGELOG.md' ':(exclude)main.py' "$@" > "/tmp/${label}.patch"
            if [ -s "/tmp/${label}.patch" ]; then
              git apply --3way --index "/tmp/${label}.patch"
              git commit -m "integrate: ${label}"
            fi
          }

          # #142: apply everything except the EX admin file that overlaps #143.
          apply_delta ec91065eb0bd7a03eee50721dd7d12542cf7fba0 2142dfd692b7a7a39ff063a2fcc8ba2b9ece1715 pr142-gif ':(exclude)ex_admin_feature.py'

          python - <<'PY'
          from pathlib import Path
          p = Path('ex_admin_feature.py')
          s = p.read_text(encoding='utf-8')
          old = '''try:\n    from .ex_variants import resolve_ex_variant, serialize_ex_variants, validate_ex_variants\nexcept ImportError:  # pragma: no cover - direct module loading compatibility\n    from ex_variants import resolve_ex_variant, serialize_ex_variants, validate_ex_variants\n'''
          new = '''try:\n    from .animated_images import (\n        image_extension_from_bytes,\n        image_mime_type_from_bytes,\n        normalize_image_bytes,\n    )\n    from .ex_variants import resolve_ex_variant, serialize_ex_variants, validate_ex_variants\nexcept ImportError:  # pragma: no cover - direct module loading compatibility\n    from animated_images import (\n        image_extension_from_bytes,\n        image_mime_type_from_bytes,\n        normalize_image_bytes,\n    )\n    from ex_variants import resolve_ex_variant, serialize_ex_variants, validate_ex_variants\n'''
          assert old in s
          s = s.replace(old, new, 1)
          marker = '''    def _write_local_ex_image(self, filename: str, data: bytes) -> None:\n'''
          normalizer = '''    def _normalise_local_ex_upload(self, encoded: str) -> bytes:\n        value = str(encoded or "").strip()\n        if not value:\n            raise ValueError("EX 图片内容为空")\n        if "," in value:\n            value = value.split(",", 1)[1]\n        try:\n            raw = base64.b64decode(value, validate=True)\n        except Exception as exc:\n            raise ValueError("EX 图片不是有效 Base64") from exc\n        if not raw or len(raw) > self.LOCAL_EX_IMAGE_MAX_SIZE:\n            raise ValueError("EX 图片为空或超过 10MB")\n        normalized = normalize_image_bytes(raw, (512, 512))\n        if not normalized or len(normalized) > self.LOCAL_EX_IMAGE_MAX_SIZE:\n            raise ValueError("正規化后的 EX 图片超过 10MB")\n        return normalized\n\n'''
          assert marker in s
          s = s.replace(marker, normalizer + marker, 1)
          old = '''        if len(data) > self.LOCAL_EX_IMAGE_MAX_SIZE:\n            raise ValueError("EX 图片超过 10MB")\n        root.mkdir(parents=True, exist_ok=True)\n'''
          new = '''        if len(data) > self.LOCAL_EX_IMAGE_MAX_SIZE:\n            raise ValueError("EX 图片超过 10MB")\n        extension = image_extension_from_bytes(data)\n        if extension not in {"png", "gif"} or Path(filename).suffix.lower() != f".{extension}":\n            raise ValueError("EX 图片副档名与实际格式不一致")\n        root.mkdir(parents=True, exist_ok=True)\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''                normalized_image = await asyncio.to_thread(\n                    self._normalise_uploaded_image, image_content\n                )\n                if len(normalized_image) > self.LOCAL_EX_IMAGE_MAX_SIZE:\n                    raise ValueError("EX 图片超过 10MB")\n'''
          new = '''                normalized_image = await asyncio.to_thread(\n                    self._normalise_local_ex_upload, image_content\n                )\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''                filename = f"{pig_id}-ex{level}.png"\n                if normalized_image is not None:\n                    self._write_local_ex_image(filename, normalized_image)\n                    item["image"] = filename\n                elif payload.get("remove_image") is True:\n                    item.pop("image", None)\n'''
          new = '''                previous_image = str(item.get("image") or "")\n                image_to_remove = ""\n                if normalized_image is not None:\n                    extension = image_extension_from_bytes(normalized_image)\n                    if extension not in {"png", "gif"}:\n                        raise ValueError("EX 图片格式无效")\n                    filename = f"{pig_id}-ex{level}.{extension}"\n                    self._write_local_ex_image(filename, normalized_image)\n                    item["image"] = filename\n                    if previous_image and previous_image != filename:\n                        image_to_remove = previous_image\n                elif payload.get("remove_image") is True:\n                    image_to_remove = previous_image\n                    item.pop("image", None)\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''                if payload.get("remove_image") is True and normalized_image is None:\n                    root = self.local_ex_variant_image_dir\n                    if isinstance(root, Path):\n                        try:\n                            (root / filename).unlink(missing_ok=True)\n                        except OSError as exc:\n                            logger.warning(f"清理未引用 EX 图片失败：{exc}")\n'''
          new = '''                if image_to_remove:\n                    root = self.local_ex_variant_image_dir\n                    if isinstance(root, Path):\n                        try:\n                            (root / image_to_remove).unlink(missing_ok=True)\n                        except OSError as exc:\n                            logger.warning(f"清理未引用 EX 图片失败：{exc}")\n'''
          assert old in s
          s = s.replace(old, new, 1)
          # #143 already resolves MIME from extension; use content sniffing so GIF preview remains correct.
          old = '''            ext = path.suffix.lower().lstrip(".")\n            mime_types = getattr(self, "IMAGE_MIME_TYPES", {})\n            mime_type = (\n                str(mime_types.get(ext) or "")\n                if isinstance(mime_types, dict)\n                else ""\n            ) or ("image/png" if ext == "png" else "application/octet-stream")\n'''
          assert old in s
          s = s.replace(old, '            mime_type = image_mime_type_from_bytes(raw)\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git add ex_admin_feature.py
          git commit -m "integrate: merge GIF EX handling with effective preview"

          # #144 incremental commit on top of already-merged #143, excluding its tiny backend overlap.
          apply_delta dbbfa200fb6a4730c53ded6a8b24651219fafc57 88603e354776f016fdcbc99b07e076babc38a777 pr144-ex-preview-stage2 ':(exclude)ex_admin_feature.py'
          python - <<'PY'
          from pathlib import Path
          p = Path('ex_admin_feature.py')
          s = p.read_text(encoding='utf-8')
          old = '''            if payload.get("effective") is True:\n                path, source, image_level = self._effective_ex_image_preview_path(\n'''
          new = '''            if payload.get("base") is True:\n                path = self.find_image_file(pig_id)\n                source = "base"\n                image_level = 0\n            elif payload.get("effective") is True:\n                path, source, image_level = self._effective_ex_image_preview_path(\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git add ex_admin_feature.py
          git commit -m "integrate: add read-only Base EX preview mode"

          apply_delta ec91065eb0bd7a03eee50721dd7d12542cf7fba0 9a41de05cbc59a3272aeca3dd9591df5849d4620 pr140-ai-studio
          apply_delta a5c2a9830d7d74949d0cfc63651ef09ceda2967e 763219c3e5d05404e669ba992fa0918c25bff105 pr135-actor-header
          apply_delta a5c2a9830d7d74949d0cfc63651ef09ceda2967e 077c6263db4aca0df48706833867d9689cf3831b pr137-ci-trim

          # Centralized MRO/import wiring for #135 + #140 + #142.
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          for needle, insert in [
              ('try:\n    from .daily_report_feature import DailyReportMixin\n', 'try:\n    from .animated_image_feature import AnimatedImageMixin\n    from .command_actor_feature import CommandActorMentionMixin\n    from .daily_report_feature import DailyReportMixin\n'),
              ('    from .permanent_collection_feature import PermanentCollectionMixin\n', '    from .permanent_collection_feature import PermanentCollectionMixin\n    from .pig_studio_admin import PigStudioAdminMixin\n    from .pig_studio_feature import PigStudioMixin\n'),
              ('except ImportError:  # pragma: no cover - direct module loading compatibility\n    from daily_report_feature import DailyReportMixin\n', 'except ImportError:  # pragma: no cover - direct module loading compatibility\n    from animated_image_feature import AnimatedImageMixin\n    from command_actor_feature import CommandActorMentionMixin\n    from daily_report_feature import DailyReportMixin\n'),
              ('    from permanent_collection_feature import PermanentCollectionMixin\n', '    from permanent_collection_feature import PermanentCollectionMixin\n    from pig_studio_admin import PigStudioAdminMixin\n    from pig_studio_feature import PigStudioMixin\n'),
              ('class RollPigPlugin(\n    ReservationFirewoodMixin,\n', 'class RollPigPlugin(\n    CommandActorMentionMixin,\n    AnimatedImageMixin,\n    ReservationFirewoodMixin,\n'),
              ('    DailyReportMixin,\n    ExPublicSourceMixin,\n', '    DailyReportMixin,\n    PigStudioAdminMixin,\n    PigStudioMixin,\n    ExPublicSourceMixin,\n'),
          ]:
              assert needle in s, needle
              s = s.replace(needle, insert, 1)
          p.write_text(s, encoding='utf-8')
          PY

          # Consolidate user-visible release notes without duplicating old history.
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          marker = '## 未發佈\n\n'
          assert marker in s
          bullets = [
              '- v3.10.0 整合：群聊 RollPig 指令首條回覆統一在頂部標示 `@指令發起者`，保留玩法目標 @，私聊不新增提及。',
              '- Pig Manager 新增「AI 小豬工坊」：復用 AstrBot AI Provider 批量策劃，支援圖鑑參考生圖、服務端短期草稿、微調重畫與確認後本地入庫；生圖密鑰不回傳前端，遠端圖片限同源 HTTPS。',
              '- 新增 GIF 小豬端到端支援：PigHub／手動上傳、EX 差分、公共豬源與完整小豬卡都可保留動畫 GIF，並加入幀數、總時長、尺寸與檔案大小安全上限。',
              '- EX 成長管理預覽升級：顯示真正生效圖片與來源，支援未儲存圖片即時模擬、Base ↔ EX 圖文對比及圖片放大。',
              '- CI 收斂重複與低價值檢查，保留 Python 3.12、Marketplace、AstrBot 官方載入、Changelog/Wiki 與 pre-commit 等發布門禁。',
          ]
          prefix = '\n'.join(b for b in bullets if b not in s) + '\n'
          s = s.replace(marker, marker + prefix, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git add main.py CHANGELOG.md
          git commit -m "release: consolidate v3.10.0 integration wiring"

      - name: Validate integrated tree
        run: |
          python -m pip install -r requirements.txt pytest pre-commit
          python -m py_compile main.py animated_image_feature.py animated_images.py ex_admin_feature.py ex_public_source_feature.py pig_studio_feature.py pig_studio_admin.py command_actor_feature.py
          pytest -q
          pre-commit run --all-files
      - name: Push integrated tree
        run: git push origin HEAD:release/v3.10.0-integration
