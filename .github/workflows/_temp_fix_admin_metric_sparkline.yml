name: Temporary fix admin metric sparkline

on:
  push:
    branches:
      - fix/admin-metric-sparkline-scale

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-metric-sparkline-scale
          fetch-depth: 0
      - name: Repair metric sparkline scaling
        run: |
          echo '' | base64 -d > /tmp/fix_sparkline.py
          python /tmp/fix_sparkline.py
      - name: Validate repair
        run: |
          python -m pip install -q pytest
          pytest -q tests/test_admin_trend_ui_contract.py tests/test_admin_ex_integration_contract.py
          python - <<'PY' > /tmp/admin-inline.js
          from pathlib import Path
          import re
          text = Path('pages/pig-manager/index.html').read_text(encoding='utf-8')
          print('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>', text, re.S)))
          PY
          node --check /tmp/admin-inline.js
      - name: Commit repair
        run: |
          rm -f .github/workflows/_temp_fix_admin_metric_sparkline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair admin metric sparkline scaling"
          git push origin HEAD:fix/admin-metric-sparkline-scale
