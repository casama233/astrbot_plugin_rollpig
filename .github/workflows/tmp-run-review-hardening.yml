name: Temporary run review hardening

on:
  push:
    branches:
      - agent/harden-public-source-review-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-public-source-review-ui
          fetch-depth: 0
      - name: Execute embedded patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          source = Path('.github/workflows/tmp-harden-public-source-review.yml').read_text(encoding='utf-8')
          match = re.search(r"          python - <<'PY'\n(?P<body>.*?)\n          PY\n", source, re.DOTALL)
          if not match:
              raise SystemExit('embedded patch script not found')
          body = textwrap.dedent(match.group('body'))
          exec(compile(body, '<review-hardening>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Validate focused contracts
        run: |
          python -m compileall -q legacy_main.py
          python -m pytest -q tests/test_group_report_source_review_hardening.py tests/test_public_source_review_capability.py
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy_main.py pages/pig-manager/index.html CHANGELOG.md tests/test_public_source_review_capability.py
          git diff --cached --check
          git commit -m "fix: capability-gate public source reviews [review-hardening-applied]"
          git push origin HEAD:agent/harden-public-source-review-ui
