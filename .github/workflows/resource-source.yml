name: AstrBot Resource Source

on:
  push:
    branches: [main]
    paths:
      - "resource/**"
      - "ex_variants.py"
      - "scripts/build_resource_source.py"
      - "scripts/check_asset_provenance.py"
      - "scripts/prepare_resource_catalog.py"
      - ".github/workflows/resource-source.yml"
  pull_request:
    branches: [main]
    paths:
      - "resource/**"
      - "ex_variants.py"
      - "scripts/build_resource_source.py"
      - "scripts/check_asset_provenance.py"
      - "scripts/prepare_resource_catalog.py"
      - ".github/workflows/resource-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install image validator
        run: python -m pip install -r requirements.txt

      - name: Enforce quarantined authored resource boundary
        run: |
          test ! -e resource/pig_ex_variants.json
          test ! -d resource/ex_curated

      - name: Verify legacy compatibility helper fails closed
        run: |
          set +e
          python scripts/prepare_resource_catalog.py \
            --primary resource \
            --compat /tmp/not-used \
            --output /tmp/not-used-output >/tmp/compat.out 2>/tmp/compat.err
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'publishing is disabled\|publishing.*disabled\|compatibility-floor publishing is disabled' /tmp/compat.err

      - name: Build validated AstrBot source from bundled lineage only
        env:
          RESOURCE_VERSION: ${{ github.sha }}
        run: |
          python scripts/build_resource_source.py \
            --source resource \
            --output dist/astrbot-rollpig-source \
            --version "git-${RESOURCE_VERSION:0:12}"

          python scripts/check_asset_provenance.py \
            --source resource \
            --artifact-manifest dist/astrbot-rollpig-source/manifest.json \
            --git-root . \
            --output dist/astrbot-rollpig-source/asset_provenance.json

          python -m json.tool dist/astrbot-rollpig-source/manifest.json >/dev/null
          python -m json.tool dist/astrbot-rollpig-source/asset_provenance.json >/dev/null
          test -f dist/astrbot-rollpig-source/health.json
          test -f dist/astrbot-rollpig-source/pig.json
          test -f dist/astrbot-rollpig-source/pig_ex_variants.json
          test -f dist/astrbot-rollpig-source/asset_provenance.json
          test -d dist/astrbot-rollpig-source/images
          test ! -e dist/astrbot-rollpig-source/compatibility_floor.json

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("dist/astrbot-rollpig-source")
          records = json.loads((root / "pig.json").read_text(encoding="utf-8"))
          ids = {str(item["id"]) for item in records}
          variants = json.loads((root / "pig_ex_variants.json").read_text(encoding="utf-8"))
          ex_pigs = variants.get("pigs", {})

          if set(ex_pigs) != ids:
              missing = sorted(ids - set(ex_pigs))[:10]
              extra = sorted(set(ex_pigs) - ids)[:10]
              raise SystemExit(f"generated EX coverage mismatch: missing={missing}, extra={extra}")

          expected_levels = {"1", "2", "3", "4", "5"}
          for pig_id, levels in ex_pigs.items():
              if set(levels) != expected_levels:
                  raise SystemExit(f"{pig_id} does not have generated EX1-EX5 materialization")
              descriptions = [str(levels[str(level)].get("description") or "") for level in range(1, 6)]
              analyses = [str(levels[str(level)].get("analysis") or "") for level in range(1, 6)]
              if not all(descriptions) or len(set(descriptions)) != 5:
                  raise SystemExit(f"{pig_id} generated EX descriptions are incomplete/duplicated")
              if not all(analyses) or len(set(analyses)) != 5:
                  raise SystemExit(f"{pig_id} generated EX analyses are incomplete/duplicated")

          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          health = json.loads((root / "health.json").read_text(encoding="utf-8"))
          provenance = json.loads((root / "asset_provenance.json").read_text(encoding="utf-8"))
          if manifest.get("pig_count") != len(ids):
              raise SystemExit("manifest pig count does not match bundled catalog")
          if manifest.get("ex_variant_pig_count") != len(ids):
              raise SystemExit("manifest generated EX count does not match pig count")
          if health.get("ex_variant_pig_count") != len(ids):
              raise SystemExit("health generated EX count does not match pig count")
          approved = provenance.get("assets", {})
          if not approved:
              raise SystemExit("asset provenance contains no approved derived assets")
          if not all(item.get("redistribution_allowed") is True for item in approved.values()):
              raise SystemExit("approved asset provenance contains a non-redistributable entry")
          print(
              f"bundled lineage source: {len(ids)} pigs; generated EX: {len(ex_pigs)} pigs; "
              f"approved derived assets: {len(approved)}"
          )
          PY

      - name: Upload deployable source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: astrbot-rollpig-source-${{ github.sha }}
          path: dist/astrbot-rollpig-source/
          if-no-files-found: error
          retention-days: 14
