name: Add EX Growth Help Card

on:
  push:
    branches:
      - feat/piggy-copy-polish-mainline
    paths:
      - .github/workflows/add-ex-help-card.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/piggy-copy-polish-mainline

      - name: Add localized EX growth copy and help entry
        run: |
          python - <<'PY'
          from pathlib import Path

          copy_path = Path('player_copy.py')
          text = copy_path.read_text(encoding='utf-8')
          tw = '''        "help.mechanic.duplicate_pity": "連續多天都抽到已收藏小豬，再額外疊一層新豬機會",\n'''
          tw_new = tw + '''        "help.mechanic.ex_growth_title": "EX 成長｜同一隻豬，抽熟了會進化",\n        "help.mechanic.ex_growth": "重複收藏同一隻小豬會逐步升到 EX Lv.1–5；官方豬會跟著換圖、換描述、換整段梗文案",\n'''
          cn = '''        "help.mechanic.duplicate_pity": "连续多天都抽到已收藏小猪，再额外叠一层新猪机会",\n'''
          cn_new = cn + '''        "help.mechanic.ex_growth_title": "EX 成长｜同一只猪，抽熟了会进化",\n        "help.mechanic.ex_growth": "重复收藏同一只小猪会逐步升到 EX Lv.1–5；官方猪会跟着换图、换描述、换整段梗文案",\n'''
          for old, new in ((tw, tw_new), (cn, cn_new)):
              if text.count(old) != 1:
                  raise SystemExit(f'player_copy EX insertion baseline mismatch: {old!r}')
              text = text.replace(old, new, 1)
          copy_path.write_text(text, encoding='utf-8')

          help_path = Path('help_system.py')
          help_text = help_path.read_text(encoding='utf-8')
          marker = '''    if state.enable_daily_duplicate_pity:\n        mechanics.append(\n            HelpEntry(\n                t("help.mechanic.duplicate_pity_title"),\n                t("help.mechanic.duplicate_pity"),\n                kind="feature",\n            )\n        )\n'''
          replacement = marker + '''    mechanics.append(\n        HelpEntry(\n            t("help.mechanic.ex_growth_title"),\n            t("help.mechanic.ex_growth"),\n            kind="feature",\n        )\n    )\n'''
          if help_text.count(marker) != 1:
              raise SystemExit('help_system EX insertion baseline mismatch')
          help_path.write_text(help_text.replace(marker, replacement, 1), encoding='utf-8')

          test_path = Path('tests/test_copy_voice_contract.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_marker = '''    assert "補貨進行中" in traditional["help.group.firewood_router"]\n    assert "多张预约请 @目标" in simplified["help.group.firewood_router"]\n'''
          test_replacement = test_marker + '''    assert "同一隻豬，抽熟了會進化" in traditional["help.mechanic.ex_growth_title"]\n    assert "同一只猪，抽熟了会进化" in simplified["help.mechanic.ex_growth_title"]\n'''
          if test_text.count(test_marker) != 1:
              raise SystemExit('copy voice EX test baseline mismatch')
          test_path.write_text(test_text.replace(test_marker, test_replacement, 1), encoding='utf-8')
          PY

      - name: Verify EX help compiles
        run: python -m py_compile player_copy.py help_system.py

      - name: Commit EX help card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player_copy.py help_system.py tests/test_copy_voice_contract.py
          git commit -m "content: surface EX growth in dynamic help"
          git push origin HEAD:feat/piggy-copy-polish-mainline
