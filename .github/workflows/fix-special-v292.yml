name: Fix special pig copy v2.9.2

on:
  push:
    branches:
      - agent/fix-special-pig-copy-v2.9.2

permissions:
  contents: write

concurrency:
  group: fix-special-v292
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-special-pig-copy-v2.9.2
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply fix
        run: python .github/scripts/fix_special_v292.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Validate
        run: |
          python -m compileall -q main.py rollpig_core.py updater.py storage
          pytest -q
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/fix_special_v292.py
          git add main.py rollpig_core.py updater.py metadata.yaml CHANGELOG.md tests/test_rollpig_core.py tests/test_source_regressions.py
          git commit -m "fix: separate special pig action and target rules (v2.9.2)"
          git push origin HEAD:agent/fix-special-pig-copy-v2.9.2
