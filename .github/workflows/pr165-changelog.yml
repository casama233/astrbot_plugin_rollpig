name: Add PR 165 changelog entry

on:
  push:
    branches: [fix/ex-preview-production-card]
    paths:
      - .github/workflows/pr165-changelog.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ex-preview-production-card
          fetch-depth: 0
      - name: Add Unreleased entry and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## 未發佈\n\n'
          entry = '- 修复 EX 管理器“聊天卡效果预览”与真实发送样式不一致：Base／EX 预览改由后端直接调用生产 `render_pig_image` 渲染链生成，前端只展示最终 800×800 聊天卡；Base ↔ EX 对比继续保留，并同步继承真实字体、排版、EX 图片解析与 GIF 动画卡行为。未保存的编辑会明确标记为待保存；主管理 modal 的动态小猪／EX 字段改由 DOM `textContent`／`value` 填充，移除动态 `innerHTML` 注入面。\n'
          if marker not in text:
              raise SystemExit('missing Unreleased marker')
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/pr165-changelog.yml
          git diff --check
      - name: Commit changelog entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/pr165-changelog.yml
          git commit -m "docs: record production EX preview fix"
          git push
