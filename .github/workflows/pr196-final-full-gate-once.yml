name: PR 196 final full release gate

on:
  push:
    branches:
      - content/handcrafted-nonfelis-ex-phase1
    paths:
      - ".github/workflows/pr196-final-full-gate-once.yml"

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  validate:
    name: Full repository and release validation
    runs-on: ubuntu-latest
    env:
      EXPECTED_CONTENT_HEAD: 225022dd4ce54e4dbac8c69b48143ac7ee24831e
      EXPECTED_CONTENT_TREE: 23913fcf7435cc3e351cfc4901850bf3725e5c98
    steps:
      - name: Check out exact gate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify clean content parent and corpus before validation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CONTENT_HEAD"
          test "$(git rev-parse HEAD^{tree})" != "$EXPECTED_CONTENT_TREE"
          test "$(git rev-parse HEAD^^{tree})" = "$EXPECTED_CONTENT_TREE"
          test -f resource/bundled_ex_copy_phase13.json
          test -f tests/test_bundled_ex_phase13.py
          test ! -e .github/pr196_phase13_integrate.py
          test ! -e .github/workflows/pr196-phase13-integrate-once.yml
          test ! -e .github/workflows/pr196-final-rebuild-once.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project, test, pre-commit and Wiki dependencies
        run: |
          python -m pip install -r requirements.txt pytest pre-commit fonttools pyyaml packaging
          python -m pip install -r requirements-docs.txt
          python -m pip check

      - name: Enforce PR Changelog and Wiki contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          gh api "repos/$GITHUB_REPOSITORY/pulls/196" > /tmp/pr.json
          python - <<'PY'
          import json
          from pathlib import Path

          pull = json.loads(Path("/tmp/pr.json").read_text(encoding="utf-8"))
          Path("/tmp/event.json").write_text(
              json.dumps({"pull_request": pull}, ensure_ascii=False),
              encoding="utf-8",
          )
          PY
          python scripts/maintenance_contract.py pr \
            --base origin/main \
            --head HEAD \
            --event /tmp/event.json
          python scripts/maintenance_contract.py coverage

      - name: Compile source
        run: python -m compileall -q main.py legacy_main.py felis_direct_feature.py daily_report_core.py daily_report_feature.py gameplay_events.py ex_variants.py ex_variant_feature.py installation_migrations.py random_roast_feature.py roast_reservations.py roast_reservation_feature.py rollpig_core.py updater.py display_copy.py storage services scripts/maintenance_contract.py scripts/check_display_copy.py

      - name: Verify Simplified display copy and bundled font coverage
        run: python scripts/check_display_copy.py

      - name: Run all Python tests
        run: pytest -q

      - name: Run browser regression
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-timeout=15000 tests/browser/dashboard-repeat-metric.test.mjs

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Build and validate Resource Source
        env:
          RESOURCE_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test ! -e resource/pig_ex_variants.json
          test ! -d resource/ex_curated

          set +e
          python scripts/prepare_resource_catalog.py \
            --primary resource \
            --compat /tmp/not-used \
            --output /tmp/not-used-output >/tmp/compat.out 2>/tmp/compat.err
          compat_status=$?
          set -e
          test "$compat_status" -ne 0
          grep -q 'publishing is disabled\|publishing.*disabled\|compatibility-floor publishing is disabled' /tmp/compat.err

          rm -rf dist/astrbot-rollpig-source
          python scripts/build_resource_source.py \
            --source resource \
            --output dist/astrbot-rollpig-source \
            --version "git-${RESOURCE_VERSION:0:12}"
          python scripts/check_asset_provenance.py \
            --source resource \
            --artifact-manifest dist/astrbot-rollpig-source/manifest.json \
            --git-root . \
            --output dist/astrbot-rollpig-source/asset_provenance.json

          python -m json.tool dist/astrbot-rollpig-source/manifest.json >/dev/null
          python -m json.tool dist/astrbot-rollpig-source/asset_provenance.json >/dev/null
          test -f dist/astrbot-rollpig-source/health.json
          test -f dist/astrbot-rollpig-source/pig.json
          test -f dist/astrbot-rollpig-source/pig_ex_variants.json
          test -d dist/astrbot-rollpig-source/images
          test ! -e dist/astrbot-rollpig-source/compatibility_floor.json

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("dist/astrbot-rollpig-source")
          records = json.loads((root / "pig.json").read_text(encoding="utf-8"))
          ids = {str(item["id"]) for item in records}
          variants = json.loads((root / "pig_ex_variants.json").read_text(encoding="utf-8"))
          ex_pigs = variants.get("pigs", {})
          assert set(ex_pigs) == ids
          expected = {"1", "2", "3", "4", "5"}
          for pig_id, levels in ex_pigs.items():
              assert set(levels) == expected, pig_id
              descriptions = [levels[str(level)]["description"] for level in range(1, 6)]
              analyses = [levels[str(level)]["analysis"] for level in range(1, 6)]
              assert all(descriptions) and len(set(descriptions)) == 5, pig_id
              assert all(analyses) and len(set(analyses)) == 5, pig_id
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          health = json.loads((root / "health.json").read_text(encoding="utf-8"))
          assert manifest.get("pig_count") == len(ids)
          assert manifest.get("ex_variant_pig_count") == len(ids)
          assert health.get("ex_variant_pig_count") == len(ids)
          print(f"Resource Source: {len(ids)} pigs / {len(ex_pigs)} complete EX sets")
          print(f"Manifest package payload: {manifest.get('package_size')} bytes")
          PY
          du -sb dist/astrbot-rollpig-source

      - name: Validate Marketplace package
        run: |
          set -euo pipefail
          plugin_name=$(python - <<'PY'
          import yaml
          print(yaml.safe_load(open("metadata.yaml", encoding="utf-8"))["name"])
          PY
          )
          archive="${plugin_name}-marketplace.zip"
          rm -rf "dist/$plugin_name" "dist/$archive"
          mkdir -p "dist/$plugin_name"
          rsync -a ./ "dist/$plugin_name/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude 'dist/' \
            --exclude 'tests/' \
            --exclude 'scripts/' \
            --exclude 'deploy/' \
            --exclude 'node_modules/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '.pre-commit-config.yaml' \
            --exclude 'CONTRIBUTING.md' \
            --exclude 'resource/font/HanyiYongZiXiaoXiongMaoFan.ttf' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'plugin_data/'
          python scripts/prepare_install_bundle.py "dist/$plugin_name"
          python - <<PY
          import json
          from pathlib import Path
          root = Path("dist/$plugin_name/resource")
          pigs = json.loads((root / "pig.json").read_text(encoding="utf-8-sig"))
          images = [path for path in (root / "image").iterdir() if path.is_file()]
          assert len(pigs) == 22, len(pigs)
          assert len(images) == 22, len(images)
          print(f"Marketplace install bundle: {len(pigs)} pigs / {len(images)} images")
          PY
          test -f "dist/$plugin_name/metadata.yaml"
          test -f "dist/$plugin_name/main.py"
          test -f "dist/$plugin_name/requirements.txt"
          test -f "dist/$plugin_name/resource/font/荆南麦圆体.otf"
          (cd dist && zip -qr "$archive" "$plugin_name")
          archive_size=$(stat -c%s "dist/$archive")
          echo "Marketplace archive size: $archive_size bytes"
          test "$archive_size" -le 16000000

      - name: Build Wiki strictly
        run: |
          mkdocs build --strict --clean
          python scripts/check_wiki_rendered_markdown.py site

      - name: Reconfirm final authored corpus and repaired base copy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("resource/pig.json").read_text(encoding="utf-8-sig"))
          by_id = {str(item["id"]): item for item in catalog}
          catalog_ids = set(by_id)
          ids = []
          descriptions = []
          analyses = []
          for path in sorted(Path("resource").glob("bundled_ex_copy*.json")):
              payload = json.loads(path.read_text(encoding="utf-8-sig"))
              assert payload["provenance"]["scope"] == "bundled-lineage-text-only"
              assert payload["provenance"]["quarantined_ex_used"] is False
              for pig_id, spec in payload["pigs"].items():
                  ids.append(pig_id)
                  assert set(spec) == {"levels"}, pig_id
                  assert set(spec["levels"]) == {"1", "2", "3", "4", "5"}, pig_id
                  for level in ("1", "2", "3", "4", "5"):
                      item = spec["levels"][level]
                      assert set(item) == {"description", "analysis"}, (pig_id, level)
                      descriptions.append(item["description"])
                      analyses.append(item["analysis"])
          assert set(ids) == catalog_ids
          assert len(ids) == len(set(ids)) == 99
          assert len(descriptions) == len(set(descriptions)) == 495
          assert len(analyses) == len(set(analyses)) == 495
          assert by_id["elephant-pig"]["name"] == "装象猪"
          assert by_id["elephant-pig"]["description"] == "猪鼻插葱，装相"
          assert by_id["hanging-pig"]["name"] == "吊运猪"
          assert by_id["hanging-pig"]["description"] == "吊带绕身，安全落地"
          assert not Path(".github/pr196_phase13_integrate.py").exists()
          assert not Path(".github/workflows/pr196-phase13-integrate-once.yml").exists()
          assert not Path(".github/workflows/pr196-final-rebuild-once.yml").exists()
          print("Final corpus: 99 pigs / 495 globally unique descriptions / 495 globally unique analyses")
          PY
          git diff --check

  astrbot-smoke:
    name: AstrBot ${{ matrix.astrbot_ref }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot_ref:
          - v4.26.0
          - master
    env:
      ASTRBOT_REF: ${{ matrix.astrbot_ref }}
      EXPECTED_CONTENT_HEAD: 225022dd4ce54e4dbac8c69b48143ac7ee24831e
    steps:
      - name: Check out exact gate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify clean content parent
        run: test "$(git rev-parse HEAD^)" = "$EXPECTED_CONTENT_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Clone target AstrBot and official market validator
        run: |
          git clone --depth 1 --branch "$ASTRBOT_REF" https://github.com/AstrBotDevs/AstrBot .cache/AstrBot
          git clone --depth 1 --branch main https://github.com/AstrBotDevs/AstrBot_Plugins_Collection .cache/PluginCollection

      - name: Install AstrBot dependencies
        run: python -m pip install -r .cache/AstrBot/requirements.txt

      - name: Verify plugin import and command ownership
        run: |
          mkdir -p .cache/runtime/data/plugins
          ln -s "$GITHUB_WORKSPACE" .cache/runtime/data/plugins/astrbot_plugin_rollpig_plus
          PYTHONPATH="$GITHUB_WORKSPACE/.cache/AstrBot:$GITHUB_WORKSPACE/.cache/runtime" python - <<'PY'
          import importlib
          from astrbot.core.star.filter.command import CommandFilter
          from astrbot.core.star.star_handler import star_handlers_registry

          prefix = "data.plugins.astrbot_plugin_rollpig_plus"
          entry = f"{prefix}.main"
          importlib.import_module(entry)
          handlers = [
              handler for handler in star_handlers_registry
              if str(getattr(getattr(handler, "handler", None), "__module__", "")).startswith(prefix)
          ]
          assert handlers, "RollPig registered no handlers"
          assert all(handler.handler_module_path == entry for handler in handlers)
          assert all(getattr(handler.handler, "__module__", "") == entry for handler in handlers)
          commands = [
              handler for handler in handlers
              if any(isinstance(item, CommandFilter) for item in (handler.event_filters or ()))
          ]
          assert commands, "RollPig registered no command handlers"
          assert all(int((handler.extras_configs or {}).get("priority", 0) or 0) >= 1000 for handler in commands)
          assert any(handler.handler_name == "roll_pig" for handler in commands)
          print(f"verified {len(handlers)} handlers / {len(commands)} commands on {entry}")
          PY

      - name: Build checked-out revision snapshot
        run: |
          mkdir -p .cache/plugin-source
          git archive HEAD | tar -x -C .cache/plugin-source
          test -f .cache/plugin-source/main.py
          test -f .cache/plugin-source/metadata.yaml
          test -f .cache/plugin-source/resource/bundled_ex_copy_phase13.json
          test -f .cache/plugin-source/tests/test_bundled_ex_phase13.py

      - name: Run official AstrBot plugin load worker
        run: |
          python .cache/PluginCollection/scripts/validate_plugins/run.py \
            --worker \
            --astrbot-path .cache/AstrBot \
            --plugin-source-dir .cache/plugin-source \
            --plugin-dir-name astrbot_plugin_rollpig_plus \
            --normalized-repo-url https://github.com/casama233/astrbot_plugin_rollpig

  cleanup:
    name: Remove gate and restore one clean content commit
    needs:
      - validate
      - astrbot-smoke
    if: ${{ always() && needs.validate.result == 'success' && needs.astrbot-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: content/handcrafted-nonfelis-ex-phase1
      EXPECTED_CONTENT_TREE: 23913fcf7435cc3e351cfc4901850bf3725e5c98
    steps:
      - name: Check out authoring branch for cleanup
        uses: actions/checkout@v4
        with:
          ref: content/handcrafted-nonfelis-ex-phase1
          fetch-depth: 0

      - name: Remove gate and squash back onto current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          remote_head="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          git rm .github/workflows/pr196-final-full-gate-once.yml
          git reset --soft origin/main
          test "$(git write-tree)" = "$EXPECTED_CONTENT_TREE"
          test -z "$(git diff --cached --name-only | grep -E '(^|/)(\.audit|pr196[_-].*once|pr196_phase)' || true)"
          git diff --cached --check
          git commit -m "content: handwrite EX1-EX5 for all 99 bundled pigs"
          final_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$main_sha"
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$remote_head" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Final clean head: $final_head (parent $main_sha)"
