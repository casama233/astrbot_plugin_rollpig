name: Temp Fix Roast Tests

on:
  push:
    branches:
      - feature/richer-roast-copy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/richer-roast-copy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update stale AI roast implementation contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_source_regressions.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "random.choice(list(recent.values()))" in ai\n'
          new = '    assert "self._select_ai_from_recent(event, recent)" in ai\n    assert "self._select_ai_bundle(event, generated)" in ai\n'
          if old not in text:
              raise SystemExit('stale source regression assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m pip install -r requirements.txt pytest
          pytest -q tests/test_source_regressions.py tests/test_v213_ai_roast_semantics.py tests/test_roast_copy_catalog.py tests/test_roast_copy_sync_contract.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_source_regressions.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'test: update roast cache regression contract'
            git push origin HEAD:feature/richer-roast-copy
          fi
