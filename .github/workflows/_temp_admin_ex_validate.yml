name: Temporary admin EX frontend validation

on:
  push:
    branches:
      - fix/admin-ex-public-source-actions

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-ex-public-source-actions
          fetch-depth: 0
      - name: Check frontend syntax and contract
        run: |
          node --check pages/pig-manager/ex-integration.js
          python -m pip install -q pytest
          python -m pytest -q tests/test_admin_ex_integration_contract.py
      - name: Remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_temp_admin_ex_validate.yml
          git commit -m "test: validate integrated EX admin frontend"
          git push origin HEAD:fix/admin-ex-public-source-actions
