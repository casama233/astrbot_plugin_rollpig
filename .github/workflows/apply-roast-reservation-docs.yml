name: Apply roast reservation docs

on:
  push:
    branches:
      - feature/roast-reservations
    paths:
      - .github/workflows/apply-roast-reservation-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/roast-reservations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply documentation patch
        run: python .github/scripts/apply_roast_reservation_docs.py
      - name: Validate docs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('.')
          config = json.loads((root / '_conf_schema.json').read_text(encoding='utf-8'))
          assert config['enable_roast_reservation']['default'] is True
          assert config['roast_reservation_max_participants']['default'] == 12
          assert '預約烤豬' in (root / 'docs/COMMANDS.md').read_text(encoding='utf-8')
          assert 'ROAST-RESERVATIONS.md' in (root / 'docs/README.md').read_text(encoding='utf-8')
          assert '未抽目标可预约' in (root / 'legacy_main.py').read_text(encoding='utf-8')
          PY
      - name: Commit content changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs legacy_main.py
          git commit -m "docs: 完整記錄預約烤豬玩法"
          git push origin HEAD:feature/roast-reservations
