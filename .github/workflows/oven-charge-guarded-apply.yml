name: Oven Charge Guarded Apply

on:
  push:
    branches:
      - feat/oven-charge-refill
    paths:
      - scripts/apply_oven_charge_phase3.py
      - .github/workflows/oven-charge-guarded-apply.yml
      - tests/test_command_registration_boundary.py
      - tests/test_v361_hotfix_contract.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oven-charge-refill
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check
      - name: Apply guarded phase3 patch
        run: python scripts/apply_oven_charge_phase3.py
      - name: Run focused tests
        run: pytest -q tests/test_oven_charge_service.py tests/test_oven_charge_feature_contract.py tests/test_daily_report.py tests/test_command_registration_boundary.py tests/test_v361_hotfix_contract.py
      - name: Compile source
        run: python -m compileall -q main.py legacy_main.py daily_report_core.py daily_report_feature.py gameplay_events.py ex_variants.py ex_variant_feature.py roast_reservations.py roast_reservation_feature.py oven_charge_feature.py rollpig_core.py updater.py storage services
      - name: Run full tests
        run: pytest -q
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Diff check
        run: git diff --check
      - name: Persist verified files with GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            legacy_main.py
            roast_reservation_feature.py
            _conf_schema.json
            .github/workflows/ci.yml
            daily_report_core.py
            daily_report_feature.py
            tests/test_daily_report.py
          )
          for file in "${files[@]}"; do
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=feat/oven-charge-refill" --jq .sha)
            python - "$file" "$sha" <<'PY'
          import base64, json, pathlib, sys
          path, sha = sys.argv[1], sys.argv[2]
          payload = {
              "message": "feat: persist verified oven charge integration",
              "content": base64.b64encode(pathlib.Path(path).read_bytes()).decode("ascii"),
              "sha": sha,
              "branch": "feat/oven-charge-refill",
          }
          pathlib.Path("/tmp/contents-payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${file}" --input /tmp/contents-payload.json >/dev/null
          done
