name: Oven Charge Guarded Apply

on:
  push:
    branches:
      - feat/oven-charge-refill
    paths:
      - scripts/apply_oven_charge_phase3.py
      - .github/workflows/oven-charge-guarded-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oven-charge-refill
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check
      - name: Apply guarded phase3 patch
        run: python scripts/apply_oven_charge_phase3.py
      - name: Run focused tests
        run: pytest -q tests/test_oven_charge_service.py tests/test_oven_charge_feature_contract.py tests/test_daily_report.py
      - name: Compile source
        run: python -m compileall -q main.py legacy_main.py daily_report_core.py daily_report_feature.py gameplay_events.py ex_variants.py ex_variant_feature.py roast_reservations.py roast_reservation_feature.py oven_charge_feature.py rollpig_core.py updater.py storage services
      - name: Run full tests
        run: pytest -q
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Diff check
        run: git diff --check
      - name: Remove one-shot helpers
        run: git rm scripts/apply_oven_charge_phase3.py .github/workflows/oven-charge-guarded-apply.yml
      - name: Commit verified Phase 3 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add oven charge and group refill gameplay"
          git push origin HEAD:feat/oven-charge-refill
