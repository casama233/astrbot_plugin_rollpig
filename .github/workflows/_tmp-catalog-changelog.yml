name: TEMP catalog boundary changelog

on:
  push:
    branches:
      - refactor/catalog-read-boundary

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/catalog-read-boundary
      - name: Update unreleased changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          anchor = '- 新增 AST 契約測試，禁止 `legacy_main.py` / feature mixin 再註冊 AstrBot command，並要求入口 wrapper 保持完整指令面與 `super()` 委派。\n'
          extra = (
              '- 完成 catalog/resource read boundary 第二階段：新增純 `CatalogService`，集中 base/local/tombstone 合併、ID 查找、圖鑑排序、頁數、隨機與搜尋；`legacy_main.py` 改為委派，不再重複實作讀策略。\n'
              '- 新增 `ResourceReadService` 固定 local override → EX variant → cloud → bundled 圖片解析順位，並以單元與 AST 契約測試鎖定；PIL renderer、同步、寫入、storage schema 與資源協議均不變。\n'
          )
          if extra not in text:
              if anchor not in text:
                  raise SystemExit('unreleased architecture anchor not found')
              text = text.replace(anchor, anchor + extra, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp-catalog-changelog.yml
          git add CHANGELOG.md
          git diff --cached --check
          git commit -m 'docs: record catalog read boundary refactor'
          git push origin HEAD:refactor/catalog-read-boundary
