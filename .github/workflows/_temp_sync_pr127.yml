name: Temporary sync PR 127

on:
  push:
    branches:
      - fix/admin-ex-public-source-actions

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/admin-ex-public-source-actions
      - name: Merge latest main while preserving EX integration hunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X ours --no-edit origin/main
      - name: Validate combined admin features
        run: |
          python -m pip install -q pytest
          node --check pages/pig-manager/ex-integration.js
          pytest -q \
            tests/test_admin_ex_integration_contract.py \
            tests/test_admin_trend_ui_contract.py \
            tests/test_wiki_product_bridge.py
      - name: Remove temporary workflow and push synchronized branch
        run: |
          rm -f .github/workflows/_temp_sync_pr127.yml
          git add -A
          git commit -m "chore: reconcile EX admin integration with latest main" || true
          git push origin HEAD:fix/admin-ex-public-source-actions
