name: P2 normalize changelog

on:
  push:
    branches:
      - refactor/p2-legacy-shrink-budget
    paths:
      - .github/workflows/p2-normalize-changelog.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refactor/p2-legacy-shrink-budget
          fetch-depth: 0

      - name: Restore canonical changelog and insert one P2 entry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:CHANGELOG.md > CHANGELOG.md
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "## 未發佈\n"
          bullet = (
              "- P2 架構收斂新增 `legacy_main.py` shrink-only budget：以 2026-08-31 的 "
              "286,646 bytes 為硬上限，CI 禁止 legacy 相容層重新膨脹；新功能必須進入 "
              "canonical `main.py`、feature、service、renderer 或 storage 邊界，後續每次成功拆分"
              "都應同步下調上限。\n"
          )
          if marker not in text:
              raise SystemExit("missing unreleased changelog marker")
          if bullet not in text:
              text = text.replace(marker, marker + "\n" + bullet, 1)
          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/p2-normalize-changelog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/p2-normalize-changelog.yml
          git commit -m "docs(P2): normalize legacy shrink changelog entry"
          git push origin HEAD:refactor/p2-legacy-shrink-budget
