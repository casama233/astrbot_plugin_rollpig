name: Prepare v3.12.4 release

on:
  push:
    branches: [release/v3.12.4]
    paths:
      - .github/workflows/release-prep-v3.12.4.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'casama233/astrbot_plugin_rollpig'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Apply exact release-only edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace('metadata.yaml', 'version: "3.12.3"', 'version: "3.12.4"')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          old = '''## 未發佈\n\n- 小修補：同版本同步保留快取實際來源及鏡像批准雜湊；來源切換、manifest 改變或舊快取缺少完整驗證記錄時重新校驗。撤回依據不再只看來源名稱。\n- 既有 SQLite 在建表／遷移前先唯讀核驗檔頭、核心表及 schema 版本；空檔案、截斷或非本插件資料庫停止載入，保留 WAL／SHM 恢復材料。新安裝及有效舊庫升級不變。\n- 管理頁完整顯示 cloud／bundled 與 Felis 直讀疊加來源；未知狀態不再誤報內置兜底。新增實際資源交易、資料庫及 DOM 回歸測試。\n\n'''
          new = '''## 未發佈\n\n- 暫無。\n\n## v3.12.4\n\n發布日期：2026-09-09\n\n- 同版本同步保留快取實際來源、manifest 雜湊及鏡像批准記錄；來源切換、manifest 改變或舊快取缺少完整驗證記錄時重新下載校驗，撤回不再只依賴可被覆寫的來源名稱。\n- 既有 SQLite 在任何建表／遷移前先唯讀核驗檔頭、RollPig 核心表及可支援 schema 版本；0-byte、截斷或其他用途資料庫停止載入並保留 WAL／SHM 恢復材料，新安裝、健康空庫及有效舊庫升級不變。\n- 管理頁正確區分 cloud、cloud+felis-direct、bundled、bundled+felis-direct；未知來源不再誤報內置兜底。README／運維與恢復文件同步收口，不改玩法、資料 schema、配置鍵或素材批准範圍。\n\n'''
          if text.count(old) != 1:
              raise SystemExit('CHANGELOG unreleased section changed unexpectedly')
          changelog.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('README.md',
                  '本分支程式版本：**v3.12.3** · 已審核公共鏡像恢復、完整快照校驗及撤回保護。',
                  '本分支程式版本：**v3.12.4** · 鏡像來源／撤回收口、既有 SQLite 啟動前檢查與管理頁來源顯示修正。')
          readme = Path('README.md')
          rtext = readme.read_text(encoding='utf-8')
          if rtext.count('60/30/10') != 4:
              raise SystemExit(f'README 60/30/10 count changed unexpectedly: {rtext.count("60/30/10")}')
          readme.write_text(rtext.replace('60/30/10', '70/20/10'), encoding='utf-8')

          replace('docs/OPERATIONS.md',
                  '> 本頁的 SQLite 停止載入／JSON 唯讀預檢及管理頁狀態修正是此分支的**未發佈維護變更**，不代表 v3.12.1 已包含。可安裝版本以 GitHub 正式穩定 Release 的 tag、ZIP 與 SHA256SUMS 為準。',
                  '> 本頁對應 v3.12.4 的資料恢復、資源同步與安全更新語義。可安裝版本仍以 GitHub 正式穩定 Release 的 tag、ZIP 與 SHA256SUMS 為準；main 上的版本字樣不等於 Release 已完成。')
          replace('docs/OPERATIONS.md', '### v3.12.1 更新前確認', '### v3.12.4 更新前確認')
          replace('docs/OPERATIONS.md',
                  '目前 metadata 版本仍是 v3.12.1，最低支援 AstrBot `>=4.26.0`。分支新增修補不會自動成為 v3.12.1 的既有 Release 資產。',
                  '目前 metadata 版本為 v3.12.4，最低支援 AstrBot `>=4.26.0`。只有 Release workflow 對通過 CI 的精確 main 提交建立 v3.12.4 tag、ZIP 與 SHA256SUMS 後，才算可更新的正式版本。')

          replace('docs/SQLITE-RECOVERY.md',
                  '資料權威與 JSON 預檢保護已隨維護版本提供；本次未發佈小修補再加入既有 SQLite 的建表前檢查。',
                  'v3.12.4 已包含資料權威／JSON 預檢，以及既有 SQLite 在建表與遷移前的唯讀結構檢查。')
          replace('docs/PUBLIC-MIRROR-FAIL-CLOSED.md',
                  '## 同版本與來源記錄（本次未發佈小修補）',
                  '## v3.12.4 同版本與來源記錄')

          notes = Path('.github/release-v3.12.4.md')
          if notes.exists():
              raise SystemExit('release notes already exist unexpectedly')
          notes.write_text('''# v3.12.4\n\n這是一個針對 v3.12.3 維護收尾的補丁版，集中修正鏡像來源／撤回、既有 SQLite 啟動邊界與管理頁來源顯示。\n\n- **鏡像來源不再被同版本檢查洗掉。** 沒有真正替換檔案時保留原 `source_name`、`source_url`、manifest 雜湊與批准雜湊；鏡像切回主源、切換私人源、manifest 改變，或舊快取缺少完整驗證記錄時，會重新走完整下載與校驗。只有完整交易成功後才更新來源。\n- **撤回判斷更穩健。** 除批准雜湊外也辨識固定鏡像 URL／來源，避免舊版本曾誤標成 primary 的鏡像快取跳過撤回；批准資料被移除、撤回或格式不合法時不繼續把該鏡像留在 active。批准 API 無法讀取時仍維持既有 fail-safe：不能憑斷網推斷已撤回。\n- **既有 SQLite 先檢查再初始化。** 在任何 `CREATE TABLE`／遷移之前，以可讀 WAL 視圖唯讀核驗 SQLite 檔頭、RollPig 核心表及 schema 版本。0-byte、截斷或其他用途的既有資料庫會停止載入並保留恢復材料，不再可能被初始化成新的空 RollPig DB。正常新安裝、健康空庫、舊版可支援資料庫升級與 WAL 中最新收藏均有回歸測試。\n- **管理頁來源標籤修正。** `cloud`／`bundled` 與 Felis 官方直讀 overlay 分開呈現；`cloud+felis-direct` 不再誤報「內置兜底」，未知狀態也不冒充 bundled。\n- **文件收口。** README 修正仍殘留的 60/30/10 舊描述為實際核心政策 70/20/10，運維、SQLite 恢復與鏡像來源文件改成 v3.12.4 的正式語義。\n\n不改玩家指令、玩法概率、SQLite schema、資料路徑、配置鍵、公共豬源批准範圍或最低 AstrBot `>=4.26.0`。從 v3.12.3 更新後重載插件或重啟 AstrBot。\n\n舊 v3.12.3 資源快取沒有新增的 `manifest_sha256` 記錄，升級後下一次成功同步可能完整重新驗證一次；這不會重置玩家收藏、豬籍或本地自訂資源。\n''', encoding='utf-8')
          PY
          git diff --check
      - name: Validate release-only changes
        run: |
          python -m pip install --disable-pip-version-check pytest pyyaml packaging
          python scripts/maintenance_contract.py coverage
          python -m compileall -q scripts/maintenance_contract.py
          pytest -q tests/test_source_regressions.py tests/test_v312_release_contract.py tests/test_v3122_release_contract.py tests/test_v3123_release_contract.py || pytest -q tests/test_source_regressions.py
      - name: Commit release preparation
        shell: bash
        run: |
          git config user.name 'sama233'
          git config user.email '97009482+casama233@users.noreply.github.com'
          git add metadata.yaml CHANGELOG.md README.md docs/OPERATIONS.md docs/SQLITE-RECOVERY.md docs/PUBLIC-MIRROR-FAIL-CLOSED.md .github/release-v3.12.4.md
          git commit -m 'release: prepare v3.12.4'
          git push origin HEAD:refs/heads/release/v3.12.4
