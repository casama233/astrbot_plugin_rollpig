name: Apply Analytics SPA remount fix v3.0.3

on:
  push:
    branches:
      - fix/analytics-spa-remount-v3.0.3

permissions:
  contents: write

concurrency:
  group: apply-analytics-spa-fix-v303
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/analytics-spa-remount-v3.0.3
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Apply fix
        run: python scripts/apply_analytics_spa_fix_v303.py

      - name: Validate frontend syntax
        run: |
          node --check pages/pig-manager/ui-feedback.js
          node --check pages/pig-manager/ui-feedback-core.js
          node --check pages/pig-manager/ui-enterprise.js
          node --check pages/pig-manager/ui-analytics.js

      - name: Compile source
        run: python -m compileall -q main.py rollpig_core.py updater.py storage services tests

      - name: Run full tests
        run: pytest -q

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remount Analytics in AstrBot SPA (v3.0.3)"
          git push origin HEAD:fix/analytics-spa-remount-v3.0.3

# Triggered after workflow registration so GitHub can execute it.
