name: PR 193 one-shot ready transition

on:
  push:
    branches:
      - content/handcrafted-ex-phase1
    paths:
      - ".github/workflows/pr193-ready-once.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 193 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 193 --repo "$GITHUB_REPOSITORY"
