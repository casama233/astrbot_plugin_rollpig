name: Release v3.1.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.repository == 'casama233/astrbot_plugin_rollpig' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check target version
        id: version
        shell: bash
        run: |
          if ! grep -q 'version: "3.1.1"' metadata.yaml; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v3.1.1 >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
      - name: Install and test
        if: steps.version.outputs.release == 'true'
        run: |
          npm ci
          python -m pip install -r requirements.txt pytest
          npm test
          python -m pytest -q
          python -m compileall -q main.py updater.py services storage
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          CHROME_PATH="$CHROME_PATH" npm run test:browser-perf
      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.1.1 \
            --target "$GITHUB_SHA" \
            --title "v3.1.1 · 管理页性能修复" \
            --notes-file .github/release-v3.1.1.md
