name: Temporary public source review v2
on:
  push:
    branches: [fix/public-source-review-browser-v2]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
      - name: Apply public source review/browser patch
        run: |
          python scripts/tmp_apply_public_source_review_browser.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_public_source_review.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert reviewed["status"] == "rejected"\n    assert reviewed["reviewer_note"] == "内容不符合公共源要求"\n    assert app.list_submissions("pending") == []\n    rejected = app.list_submissions("rejected")\n    assert rejected[0]["submission_id"] == submission_id\n'''
          new = '''    assert reviewed["status"] == "rejected"\n    assert app.list_submissions("pending") == []\n    rejected = app.list_submissions("rejected")\n    assert rejected[0]["submission_id"] == submission_id\n    assert rejected[0]["reviewer_note"] == "内容不符合公共源要求"\n'''
          if old not in text:
              raise SystemExit('reject test patch marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile source
        run: python -m compileall -q main.py legacy_main.py daily_report_core.py daily_report_feature.py gameplay_events.py ex_variants.py ex_variant_feature.py roast_reservations.py roast_reservation_feature.py rollpig_core.py updater.py storage services source_service
      - name: Run focused regression tests
        run: pytest -q tests/test_public_source_review.py tests/test_public_source_ui_confirmation.py tests/test_public_source_browser_contract.py tests/test_group_report_source_review_hardening.py
      - name: Run full tests
        run: pytest -q
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Check diff
        run: git diff --check
      - name: Commit formal fix and remove one-shot tooling
        run: |
          rm -f scripts/tmp_apply_public_source_review_browser.py .github/workflows/tmp-public-source-review-v2.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make public source review sandbox-safe'
          git push origin HEAD:${GITHUB_REF_NAME}
