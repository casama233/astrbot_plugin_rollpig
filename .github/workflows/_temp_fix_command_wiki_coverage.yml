name: Temp Fix Command Wiki Coverage

on:
  push:
    branches:
      - chore/enforce-pr-docs-changelog

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/enforce-pr-docs-changelog

      - name: Cover compact canonical daily-report commands
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/COMMANDS.md')
          text = path.read_text(encoding='utf-8')
          old = (
              '控制入口：\n\n'
              '- `/豬圈日報 狀態` 或 compact `/豬圈日報狀態`\n'
              '- `/豬圈日報 開啟` 或 compact `/豬圈日報開啟`\n'
              '- `/豬圈日報 關閉` 或 compact `/豬圈日報關閉`\n\n'
              '對應簡體／混合字形也由 command surface 保持相容。現在每群自動推送預設關閉；管理操作由 AstrBot 管理員權限判定。\n'
          )
          new = (
              '控制入口：\n\n'
              '- 狀態：canonical `/猪圈日报状态`；同時相容 `/豬圈日報狀態` 與帶空格 `/豬圈日報 狀態`。\n'
              '- 開啟：canonical `/猪圈日报开启`；同時相容 `/豬圈日報開啟` 與帶空格 `/豬圈日報 開啟`。\n'
              '- 關閉：canonical `/猪圈日报关闭`；同時相容 `/豬圈日報關閉` 與帶空格 `/豬圈日報 關閉`。\n\n'
              '簡體 canonical、繁體／混合字形 alias 與既有帶空格形式都由同一 Daily Report handler 處理。現在每群自動推送預設關閉；管理操作由 AstrBot 管理員權限判定。\n'
          )
          if old not in text:
              raise SystemExit('daily-report control block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/_temp_fix_command_wiki_coverage.yml

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/COMMANDS.md .github/workflows/_temp_fix_command_wiki_coverage.yml
          git commit -m "docs: cover canonical daily-report commands"
          git push origin HEAD:chore/enforce-pr-docs-changelog
