name: TEMP renderer boundary refactor

on:
  push:
    branches:
      - refactor/renderer-boundary

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: refactor/renderer-boundary
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
      - name: Apply renderer boundary
        run: python scripts/_apply_renderer_boundary.py
      - name: Compile source
        run: python -m compileall -q main.py legacy_main.py renderers services tests
      - name: Run full tests
        run: pytest -q
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Review generated diff
        run: |
          git status --short
          git diff --check
          git diff --stat
          python - <<'PY'
          import ast
          from pathlib import Path
          src = Path('legacy_main.py').read_text(encoding='utf-8')
          tree = ast.parse(src)
          cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'RollPigPlugin')
          for name in ('render_pig_image', 'render_pigsty_image', 'render_catalog_grid', 'render_weekly_summary'):
              fn = next(n for n in cls.body if isinstance(n, ast.FunctionDef) and n.name == name)
              print(f'{name}: L{fn.lineno}-L{fn.end_lineno} ({fn.end_lineno - fn.lineno + 1} lines)')
          PY
      - name: Commit verified refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp-renderer-inventory.yml scripts/_apply_renderer_boundary.py
          git add legacy_main.py renderers tests docs/ARCHITECTURE.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'refactor: extract core image renderers'
          git push origin HEAD:refactor/renderer-boundary
