name: Temporary prepare v3.9.1

on:
  push:
    branches:
      - release/v3.9.1-maintenance
    paths:
      - .github/workflows/_temp_prepare_v391.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare release files
        run: python scripts/_temp_prepare_v391.py
      - name: Commit prepared release
        shell: bash
        run: |
          rm -f .github/workflows/_temp_prepare_v391.yml scripts/_temp_prepare_v391.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare v3.9.1 maintenance release"
          git push origin HEAD:release/v3.9.1-maintenance
