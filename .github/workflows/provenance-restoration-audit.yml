name: Provenance Restoration Audit

on:
  push:
    branches:
      - audit/resource-provenance-restoration
    paths:
      - .github/workflows/provenance-restoration-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruct 204-to-current resource delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          import urllib.parse

          HEADERS = {
              "User-Agent": "AstrBot-RollPig/3.11.5 (+https://github.com/casama233/astrbot_plugin_rollpig)",
              "X-RollPig-Client": "astrbot_plugin_rollpig_plus",
              "X-RollPig-Protocol": "1",
              "Accept": "application/json, application/octet-stream;q=0.9, */*;q=0.1",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          }

          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          primary_manifest_url = "https://curryudon.top/astrbot-rollpig/v1/manifest.json"
          manifest_raw = get(primary_manifest_url, HEADERS)
          manifest = json.loads(manifest_raw.decode("utf-8-sig"))
          pig_meta = manifest["pig_json"]
          current_pig_url = urllib.parse.urljoin(primary_manifest_url, pig_meta["path"])
          current_raw = get(current_pig_url, HEADERS)
          current_sha = hashlib.sha256(current_raw).hexdigest()
          if current_sha != pig_meta["sha256"]:
              raise SystemExit(f"current pig.json sha mismatch: {current_sha} != {pig_meta['sha256']}")
          current = json.loads(current_raw.decode("utf-8-sig"))

          old_url = (
              "https://raw.githubusercontent.com/casama233/rollpig-public-source-mirror/"
              "aac88ec24d2a31fc532fd9cf42cc02eeaa3e7b36/public/v1/pig.json"
          )
          old_raw = get(old_url, {"User-Agent": "RollPig-Provenance-Audit/1"})
          old = json.loads(old_raw.decode("utf-8-sig"))

          current_ids = {str(x["id"]) for x in current}
          old_ids = {str(x["id"]) for x in old}
          quarantined = sorted(old_ids - current_ids)
          added_since = sorted(current_ids - old_ids)

          result = {
              "current_resource_version": manifest.get("resource_version"),
              "current_profile": manifest.get("profile"),
              "current_count": len(current_ids),
              "current_pig_sha256": current_sha,
              "historical_count": len(old_ids),
              "historical_commit": "aac88ec24d2a31fc532fd9cf42cc02eeaa3e7b36",
              "quarantined_count": len(quarantined),
              "quarantined_ids": quarantined,
              "added_since_count": len(added_since),
              "added_since_ids": added_since,
          }
          print("PROVENANCE_AUDIT_RESULT=" + json.dumps(result, ensure_ascii=False, sort_keys=True))
          with open("provenance-audit-result.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Trace remaining historical image blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/provenance-repos
          cd /tmp/provenance-repos
          repos=(
            "Bearlele/nonebot-plugin-rollpig"
            "MegSopern/astrbot_plugin_rollpig"
            "Felis2026/nonebot-plugin-rollpig-plus"
            "Felis2026/rollpig-resources"
            "BadFish-HSrui/PigHub-DB"
          )
          for repo in "${repos[@]}"; do
            dir="${repo//\//__}"
            git clone --quiet --filter=blob:none --no-checkout "https://github.com/${repo}.git" "$dir"
          done

          cat > /tmp/targets.tsv <<'EOF'
          elephant-pig	26d0396e16891faeae9ad11d5330bb482a780c77
          fishing-pig	17432cb28ab4ec15a8bf7baf6b18bb9fbce90286
          hanging-pig	d0cff749c9aacd694adf6f948da81263f68d61b3
          papa-pig	6db3355eaa6095c58ceb010ab0251227b5dec735
          pighub-pig-14670a8c	ec5b09bce17df7fcc16287c509571f4bf33fb5aa
          pighub-pig-27a30dee	c84bf288f5230d164389c80786fde3694a75fc36
          EOF

          : > /tmp/blob-matches.tsv
          while IFS=$'\t' read -r pig_id blob; do
            for repo in "${repos[@]}"; do
              dir="${repo//\//__}"
              matches="$(git -C "$dir" rev-list --objects --all | awk -v b="$blob" '$1 == b {print substr($0, length($1)+2)}')"
              if [[ -n "$matches" ]]; then
                while IFS= read -r path; do
                  printf '%s\t%s\t%s\t%s\n' "$pig_id" "$blob" "$repo" "$path" >> /tmp/blob-matches.tsv
                done <<< "$matches"
              fi
            done
          done < /tmp/targets.tsv

          echo "BLOB_MATCHES_BEGIN"
          cat /tmp/blob-matches.tsv || true
          echo "BLOB_MATCHES_END"

          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          p=Path('/tmp/blob-matches.tsv')
          if p.exists():
              for line in p.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  pig_id, blob, repo, path = line.split('\t', 3)
                  rows.append({'id': pig_id, 'git_blob_sha1': blob, 'repository': repo, 'path': path})
          Path('blob-trace-result.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: provenance-audit-result
          path: |
            provenance-audit-result.json
            /tmp/provenance-repos/blob-trace-result.json
          if-no-files-found: error
