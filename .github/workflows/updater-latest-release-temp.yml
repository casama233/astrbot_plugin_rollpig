name: Temporary updater release-discovery hotfix

on:
  push:
    branches:
      - fix/updater-latest-release
    paths:
      - .github/workflows/updater-latest-release-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/updater-latest-release
          fetch-depth: 0

      - name: Apply and validate hotfix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_updater_hotfix_temp.py
          python -m pytest -q tests/test_storage_and_updater.py tests/test_updater_latest_release_endpoint.py
          python scripts/maintenance_contract.py release
          git diff --check

      - name: Commit hotfix and remove temporary staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/updater-latest-release-temp.yml scripts/_updater_hotfix_temp.py
          git add updater.py tests/test_updater_latest_release_endpoint.py metadata.yaml CHANGELOG.md .github/release-v3.11.3.md
          git commit -m "fix: repair stable release discovery for panel updater"
          git push origin HEAD:fix/updater-latest-release
