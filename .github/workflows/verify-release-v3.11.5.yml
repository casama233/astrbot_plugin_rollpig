name: Verify v3.11.5 release

on:
  push:
    branches:
      - release/v3.11.5

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.11.5
          fetch-depth: 0
      - name: Poll published release and latest endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 30); do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.11.5" > /tmp/release.json 2>/dev/null; then
              found=1
              break
            fi
            sleep 4
          done
          if [ "$found" -ne 1 ]; then
            echo "v3.11.5 release did not appear in time" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > /tmp/latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('/tmp/release.json').read_text())
          latest = json.loads(Path('/tmp/latest.json').read_text())
          payload = {
              'tag_name': release.get('tag_name'),
              'name': release.get('name'),
              'draft': release.get('draft'),
              'prerelease': release.get('prerelease'),
              'target_commitish': release.get('target_commitish'),
              'html_url': release.get('html_url'),
              'latest_tag_name': latest.get('tag_name'),
              'assets': [
                  {
                      'name': item.get('name'),
                      'size': item.get('size'),
                      'digest': item.get('digest'),
                      'state': item.get('state'),
                  }
                  for item in release.get('assets', [])
              ],
          }
          Path('release-verify-v3.11.5.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          required = {'astrbot_plugin_rollpig_plus-v3.11.5.zip', 'SHA256SUMS'}
          names = {item['name'] for item in payload['assets']}
          if payload['tag_name'] != 'v3.11.5' or payload['latest_tag_name'] != 'v3.11.5':
              raise SystemExit('release/latest tag mismatch')
          if payload['draft'] or payload['prerelease']:
              raise SystemExit('release is not stable')
          if not required.issubset(names):
              raise SystemExit(f'missing release assets: {sorted(required - names)}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-verify-v3.11.5.json
          git commit -m "chore: record v3.11.5 release verification"
          git push origin HEAD:release/v3.11.5
