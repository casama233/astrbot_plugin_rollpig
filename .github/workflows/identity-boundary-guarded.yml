name: Identity Boundary Guarded Apply

on:
  push:
    branches:
      - tmp/identity-boundary-safety-net

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: tmp/identity-boundary-safety-net

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Apply identity boundary patch
        run: python scripts/_apply_collection_identity_boundary.py

      - name: Run focused identity contracts
        run: |
          pytest -q tests/test_collection_service.py tests/test_collection_identity_boundary_contract.py

      - name: Compile source
        run: python -m compileall -q main.py legacy_main.py daily_report_core.py daily_report_feature.py gameplay_events.py ex_variants.py ex_variant_feature.py roast_reservations.py roast_reservation_feature.py rollpig_core.py updater.py storage services

      - name: Run full test suite
        run: pytest -q

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Check diff whitespace
        run: git diff --check

      - name: Commit verified implementation and remove one-shot helpers
        run: |
          rm -f scripts/_apply_collection_identity_boundary.py
          rm -f .github/workflows/identity-boundary-guarded.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: add claim-aware collection identity boundary"
          git push origin HEAD:tmp/identity-boundary-safety-net
