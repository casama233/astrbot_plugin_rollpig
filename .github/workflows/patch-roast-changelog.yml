name: Patch roast changelog

on:
  push:
    branches:
      - agent/fix-roast-rng-and-random-targeting

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-roast-rng-and-random-targeting
          fetch-depth: 0

      - name: Update unreleased changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          placeholder = '## 未發佈\n\n- 暫無。'
          replacement = (
              '## 未發佈\n\n'
              '- 修復 `/隨機烤群友` 候選未先排除豬身安全險、0 Charge 仍可先隨機 @ 群友；'
              '烤群友結果與隨機目標改用插件私有 `SystemRandom`，避免同進程其他插件 `random.seed()` 污染。'
          )
          if replacement in text:
              raise SystemExit(0)
          if placeholder not in text:
              raise SystemExit('CHANGELOG 未找到預期的未發佈佔位段落')
          path.write_text(text.replace(placeholder, replacement, 1), encoding='utf-8')
          PY

      - name: Commit changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs: record roast reliability fixes'
          git push origin HEAD:agent/fix-roast-rng-and-random-targeting
