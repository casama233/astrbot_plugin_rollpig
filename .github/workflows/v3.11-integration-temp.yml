name: Temporary v3.11.0 integration

on:
  push:
    branches:
      - release/v3.11.0
    paths:
      - .github/workflows/v3.11-integration-temp.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate validated PRs and prepare release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin \
            fix/main-ex-modal-preview-parity \
            agent/harden-public-source-review-ui

          git show origin/fix/main-ex-modal-preview-parity:pages/pig-manager/ex-integration.js > pages/pig-manager/ex-integration.js
          git show origin/fix/main-ex-modal-preview-parity:tests/test_admin_ex_integration_contract.py > tests/test_admin_ex_integration_contract.py
          git show origin/fix/main-ex-modal-preview-parity:pages/pig-manager/ex-integration.css > /tmp/pr148-ex-integration.css

          git show origin/agent/harden-public-source-review-ui:legacy_main.py > legacy_main.py
          git show origin/agent/harden-public-source-review-ui:pages/pig-manager/index.html > pages/pig-manager/index.html
          git show origin/agent/harden-public-source-review-ui:tests/test_public_source_review_capability.py > tests/test_public_source_review_capability.py
          git show origin/agent/harden-public-source-review-ui:tests/test_public_source_ui_confirmation.py > tests/test_public_source_ui_confirmation.py

          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('pages/pig-manager/ex-integration.css')
          current_css = css_path.read_text(encoding='utf-8')
          incoming_css = Path('/tmp/pr148-ex-integration.css').read_text(encoding='utf-8')
          marker = '/* Admin dashboard overhaul: semantic KPI states, tighter panels and a real leaderboard surface. */'
          if marker not in current_css:
              raise SystemExit('dashboard overhaul CSS marker missing from current main')
          dashboard_tail = marker + current_css.split(marker, 1)[1]
          css_path.write_text(incoming_css.rstrip() + '\n\n' + dashboard_tail.rstrip() + '\n', encoding='utf-8')

          metadata = Path('metadata.yaml')
          metadata_text = metadata.read_text(encoding='utf-8')
          updated_metadata, count = re.subn(
              r'(?m)^version:\s*["\x27]?3\.10\.0["\x27]?\s*$',
              'version: "3.11.0"',
              metadata_text,
              count=1,
          )
          if count != 1:
              raise SystemExit('expected metadata version 3.10.0 not found exactly once')
          metadata.write_text(updated_metadata, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          release_section = '''## 未發佈

          - 暫無。

          ## v3.11.0

          發佈日期：2026-08-17

          v3.11.0 聚焦管理面板資訊語義、EX 日常管理入口的一致性，以及公共豬源審核權限邊界；本版把 #147、#148、#149 收斂成一個經完整回歸後發布的穩定版本。

          ### 管理面板語義與視覺

          - 重整總覽 KPI 與資訊密度：累計抽取不再偽裝成短期趨勢，今日活躍明確標示近 14 日範圍，熱門小豬改為緊湊排行榜並移除大片無效留白。
          - AI 烤豬文案運行健康改為狀態驅動：區分未啟用、已啟用無樣本、生成中與已有完成樣本；生成中不進成功率分母，未啟用時不再顯示誤導性的 0%。
          - 新增管理面板回歸契約，鎖定資源版本相容、AI 狀態語義、累計值呈現與排行榜版式。

          ### EX 成長管理入口一致性

          - 修復 v3.10.0 第二階段 EX 預覽只落在獨立頁、主管理圖鑑內嵌 modal 仍停留舊版的整合漂移。
          - 主管理 modal 現在同步顯示實際生效圖片、名稱、EX 等級、短描述、完整文案與來源，並支援未儲存本地圖片即時預覽與移除圖片後的繼承／基礎圖回退模擬。
          - 新增 Base ↔ EX 圖文對比、lazy-load Base 圖、頁內 lightbox 放大與手機端堆疊；雙入口 parity contract 防止日後再次只更新其中一頁。

          ### 公共豬源審核權限

          - 公共豬源 review proxy routes 只在本機存在有效 maintainer token 時註冊；普通安裝者不再暴露審核路由。
          - `overview` 只返回布林 capability，不回傳 token；運行中移除 token 會立即撤銷前端審核能力。
          - 審核面板、modal、備註與批准／拒絕操作改為 capability 為真時才動態掛載；遠端 Bearer token 驗證繼續作為第二道授權邊界。

          ### 相容性

          - 可由 v3.10.0 直接升級。
          - 不修改 SQLite schema、Resource Protocol、抽豬概率、保底、EX 等級與稀疏繼承規則。
          - 公共豬源審核 route registration 屬啟動期能力：運行中新增 maintainer token 後需重新啟動插件；移除 token 則 capability 立即失效。

          ### 本版整合工作

          - #147 — 管理面板語義、AI Runtime 狀態與熱門榜大翻修。
          - #148 — 主管理 EX modal 與 v3.10 Stage 2 預覽對齊。
          - #149 — 公共豬源審核 capability / route / DOM 三層收緊。

          ### 驗證

          - #147 合入前 CI、Marketplace Package、AstrBot Market Smoke 全部通過。
          - #148、#149 各自來源分支 CI 與 Marketplace Package 均通過；正式 Release PR 會在整合樹上重新執行完整 pytest、pre-commit、Marketplace Package 與 AstrBot Market Smoke。

          '''
          pattern = re.compile(r'(?ms)^## 未發佈\s*$\n.*?(?=^## v3\.10\.0\s*$)')
          updated_changelog, count = pattern.subn(release_section, changelog_text, count=1)
          if count != 1:
              raise SystemExit('unable to replace unreleased section before v3.10.0')
          changelog.write_text(updated_changelog, encoding='utf-8')

          notes = Path('.github/release-v3.11.0.md')
          notes.write_text('''# 今日小豬 · 增強版 v3.11.0

          v3.11.0 集中完成三條管理端收斂：總覽 Analytics 語義與視覺、主管理 EX 預覽一致性，以及公共豬源審核權限邊界。

          ## 主要更新

          - **管理面板大翻修**：累計值與短期趨勢分離、14 日活躍範圍明確、熱門小豬改為緊湊排行榜；AI 文案健康改為未啟用／無樣本／生成中／完成樣本四態，成功率只統計完成樣本。
          - **EX 主管理入口對齊**：主管理 modal 補齊實際生效圖片、待保存圖片模擬、移除後回退、Base ↔ EX 對比與頁內 lightbox，並加入雙入口 parity 回歸契約。
          - **公共豬源審核收緊**：只有具有效 maintainer token 的安裝才註冊 review proxy routes 並掛載審核 UI；普通安裝不再暴露審核 DOM 或管理路由，token 本身不回傳前端。

          ## 相容性

          - 可由 v3.10.0 直接升級。
          - SQLite schema、Resource Protocol、抽豬概率、保底、EX 等級與稀疏繼承規則均不變。
          - 若運行中新增公共豬源 maintainer token，需要重新啟動插件以註冊審核路由；移除 token 時前端 capability 會立即撤銷。

          ## 驗證

          #147、#148、#149 的來源分支門禁已通過；v3.11.0 Release PR 會再次在最終整合樹上執行 CI、pytest、pre-commit、Marketplace Package 與 AstrBot Market Smoke。
          ''', encoding='utf-8')

          # Normalise indentation introduced by the embedded workflow script.
          for path in (changelog, notes):
              text = path.read_text(encoding='utf-8')
              text = '\n'.join(line[10:] if line.startswith('          ') else line for line in text.splitlines()) + '\n'
              path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/v3.11-integration-temp.yml
          git add CHANGELOG.md metadata.yaml .github/release-v3.11.0.md \
            legacy_main.py \
            pages/pig-manager/index.html \
            pages/pig-manager/ex-integration.css \
            pages/pig-manager/ex-integration.js \
            tests/test_admin_ex_integration_contract.py \
            tests/test_public_source_review_capability.py \
            tests/test_public_source_ui_confirmation.py

          python -m compileall -q legacy_main.py
          git diff --cached --check
          git commit -m "release: prepare v3.11.0 integrated admin hardening"
          git push origin HEAD:release/v3.11.0
