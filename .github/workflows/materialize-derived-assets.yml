name: Materialize approved derived assets

on:
  push:
    branches:
      - resource/derived-asset-replacements
    paths:
      - ".asset-upload/READY"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Reconstruct exact approved PNGs
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-upload/roasted-pig.part-* | base64 --decode > resource/image/roasted-pig.png
          cat .asset-upload/pigsleep.part-* | base64 --decode > resource/image/pigsleep.png

          printf '%s  %s\n' \
            'f096f63e77e109efc0cdc29cfa85aac121336ced66082a4fd84745f96ad6d547' \
            'resource/image/roasted-pig.png' > /tmp/approved.sha256
          printf '%s  %s\n' \
            '5f38caab39ecdbe23be25d6df9e9ad24538779de727a9563052aa93d1a0cdeb4' \
            'resource/image/pigsleep.png' >> /tmp/approved.sha256
          sha256sum --check /tmp/approved.sha256

      - name: Finalize provenance and changelog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          provenance = Path('resource/asset_provenance.json')
          data = json.loads(provenance.read_text(encoding='utf-8'))
          data['publication_state'] = 'approved'
          for pig_id in ('roasted-pig', 'pigsleep'):
              data['assets'][pig_id]['binary_committed'] = True
          provenance.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## 未發佈\n'
          entry = (
              '\n- `roasted-pig` 与 `pigsleep` 正式采用来源受控的高质量替换图：'
              '两者沿用既有 Bearlele/MegSopern MIT 资源 ID，不增加目录数量；'
              '前者为同图优化，后者为基于 MIT 原图的大幅重绘，并由 machine-readable '
              'provenance 与精确 SHA-256 gate 验证。\n'
              '- `papa-pig` 继续因外部下载来源／再分发权未证实而保持 withheld；'
              'PigHub-only 本地资源不在本次迁移范围内。\n'
          )
          if '`roasted-pig` 与 `pigsleep` 正式采用来源受控' not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG 未找到未發佈段落')
              text = text.replace(marker, marker + entry, 1)
              changelog.write_text(text, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify provenance and focused resource tests
        run: |
          python scripts/check_asset_provenance.py --source resource
          pytest -q tests/test_asset_provenance.py tests/test_resource_source_builder.py
          python scripts/build_resource_source.py \
            --source resource \
            --output /tmp/astrbot-rollpig-source \
            --version "derived-assets-${GITHUB_SHA:0:12}"
          python scripts/check_asset_provenance.py \
            --source resource \
            --output /tmp/astrbot-rollpig-source/asset_provenance.json

      - name: Commit exact binaries and remove transport staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-upload
          rm -f .github/workflows/materialize-derived-assets.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'resource: materialize approved derived image replacements'
          git push origin HEAD:resource/derived-asset-replacements
