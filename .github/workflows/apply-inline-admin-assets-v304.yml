name: Apply inline admin assets v3.0.4

on:
  push:
    branches:
      - fix/inline-admin-assets-v3.0.4

permissions:
  contents: write

concurrency:
  group: apply-inline-admin-assets-v304
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/inline-admin-assets-v3.0.4
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Apply inline bundle fix
        run: python scripts/apply_inline_admin_assets_v304.py

      - name: Validate frontend source syntax
        run: |
          node --check pages/pig-manager/ui-feedback.js
          node --check pages/pig-manager/ui-feedback-core.js
          node --check pages/pig-manager/ui-enterprise.js
          node --check pages/pig-manager/ui-analytics.js

      - name: Compile source
        run: python -m compileall -q main.py rollpig_core.py updater.py storage services tests

      - name: Run full tests
        run: pytest -q

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: inline authenticated admin assets (v3.0.4)"
          git push origin HEAD:fix/inline-admin-assets-v3.0.4

# Triggered after workflow registration.
