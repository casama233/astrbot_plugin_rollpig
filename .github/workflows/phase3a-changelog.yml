name: Phase 3A Changelog Update

on:
  push:
    branches:
      - feature/roast-charge
    paths:
      - .github/workflows/phase3a-changelog.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/roast-charge
      - name: Update Unreleased changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          source = path.read_text(encoding='utf-8')
          marker = '## 未發佈\n\n'
          addition = '''## 未發佈\n\n### Added\n- Phase 3A 烤箱 Charge：普通 `/烤群友` 與建立預約改為按「使用者 × 群組」消耗可儲存能量，預設 2 格；沿用 `group_roast_cooldown_hours` 作每格恢復週期，新增 `group_roast_max_charges`（1–5，預設 2）。\n- SQLite/JSON 共用同一 token-bucket policy；舊 `roast_cooldowns.last_used_at` lazy 遷移為 charge state，活動中的舊冷卻視為已消耗 1 格，避免升級重置或雙重懲罰。\n- 預約主廚建立預約消耗 1 格，添柴與日後觸發不重複消耗；後門 bypass 與 60/30/10 outcome policy 保持不變。\n\n'''
          if marker not in source:
              raise SystemExit('Unreleased marker missing')
          if 'Phase 3A 烤箱 Charge' not in source:
              source = source.replace(marker, addition, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          git rm .github/workflows/phase3a-changelog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --check
          git commit -m "docs: record roast charge Phase 3A"
          git push origin HEAD:feature/roast-charge
