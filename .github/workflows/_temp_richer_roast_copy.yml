name: Temp Richer Roast Copy

on:
  push:
    branches:
      - feature/richer-roast-copy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/richer-roast-copy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and validate
        shell: bash
        run: |
          python -m pip install -r requirements.txt pytest
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_temp_patch_richer_roast_copy.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('pattern.subn(replacement, text, count=1)', 'pattern.subn(lambda _match: replacement, text, count=1)')
          text = text.replace('send_pattern.subn(send_replacement, text, count=1)', 'send_pattern.subn(lambda _match: send_replacement, text, count=1)')
          text = text.replace('render_pattern.subn(render_replacement, text, count=1)', 'render_pattern.subn(lambda _match: render_replacement, text, count=1)')
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/_temp_patch_richer_roast_copy.py
          python -m py_compile legacy_main.py main.py roast_copy.py renderers/roast.py
          pytest -q tests/test_roast_copy_catalog.py tests/test_resource_sync.py tests/test_renderer_delegation_contract.py || pytest -q tests/test_roast_copy_catalog.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legacy_main.py main.py CHANGELOG.md docs/gameplay/roast-outcomes.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat: make roast copy richer and remotely syncable'
            git push origin HEAD:feature/richer-roast-copy
          fi
