name: v3.7.0 Release Guard

on:
  push:
    branches:
      - release/v3.7.0
    paths:
      - scripts/apply_v370_release.py
      - .github/workflows/v370-release-guard.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.7.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check
      - name: Apply release patch
        run: python scripts/apply_v370_release.py
      - name: Verify canonical version surfaces
        run: |
          grep -F 'version: "3.7.0"' metadata.yaml
          grep -F 'AstrBot-RollPig/3.7.0' legacy_main.py
          grep -F 'current-3.7.0' README.md
          grep -F '## v3.7.0 (2026-08-15)' CHANGELOG.md
          grep -F '本文以 v3.7.0' docs/COMMANDS.md
          test -s .github/release-v3.7.0.md
      - name: Compile source
        run: python -m compileall -q main.py legacy_main.py oven_refill_feature.py daily_report_core.py daily_report_feature.py gameplay_events.py roast_charges.py storage services renderers
      - name: Full test suite
        run: pytest -q
      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Diff check
        run: git diff --check
      - name: Show remaining 3.6.5 references for historical review
        run: grep -RFn --exclude-dir=.git '3.6.5' . || true
      - name: Commit verified release content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata.yaml legacy_main.py README.md CHANGELOG.md docs/COMMANDS.md .github/release-v3.7.0.md
          git diff --cached --check
          git commit -m "release: prepare v3.7.0"
          git push origin HEAD:release/v3.7.0
