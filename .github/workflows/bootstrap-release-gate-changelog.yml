name: Bootstrap release-gate changelog

on:
  push:
    branches:
      - fix/p1-release-gate
    paths:
      - .github/workflows/bootstrap-release-gate-changelog.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/p1-release-gate
          fetch-depth: 0

      - name: Insert unreleased entry and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          source = changelog.read_text(encoding="utf-8")
          marker = "## 未發佈\n\n"
          entry = (
              "- RollPig 發布鏈改為只在 `main` 的 CI 成功後，針對該次已測試的精確 commit 發布；"
              "加入 stale-SHA 阻擋、不可變 Action SHA、固定 Python／Node 工具鏈與政策回歸測試，"
              "消除 `metadata.yaml` 推送與測試並行的發版競態。\n"
          )
          if entry not in source:
              if marker not in source:
                  raise SystemExit("CHANGELOG.md missing unreleased section")
              source = source.replace(marker, marker + entry, 1)
              changelog.write_text(source, encoding="utf-8")

          Path(".github/workflows/bootstrap-release-gate-changelog.yml").unlink()
          PY

      - name: Commit atomic changelog update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/bootstrap-release-gate-changelog.yml
          git commit -m "docs(rollpig): record release gate hardening"
          git push origin HEAD:fix/p1-release-gate
