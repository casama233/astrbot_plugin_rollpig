name: Repair v3.2.0 Dual Release Channels

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.repository == 'casama233/astrbot_plugin_rollpig' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify dual-channel source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          metadata = Path('metadata.yaml').read_text(encoding='utf-8')
          updater = Path('updater.py').read_text(encoding='utf-8')
          assert 'name: "astrbot_plugin_rollpig_plus"' in metadata
          assert 'version: "3.2.0"' in metadata
          assert 'author: "casama233"' in metadata
          assert 'RELEASES_API' in updater
          assert 'releases?per_page=30' in updater
          assert '/releases/latest' not in updater
          assert 'PACKAGE_NAME = "astrbot_plugin_rollpig_plus"' in updater
          PY

      - name: Remove stale v3.2.0 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v3.2.0 >/dev/null 2>&1; then
            gh release delete v3.2.0 --yes --cleanup-tag
          else
            git push origin :refs/tags/v3.2.0 || true
          fi

      - name: Remove one-time repair workflow from release tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-v3.2.0-dual-channel.yml
          git commit -m "ci: remove one-time dual-channel release repair"
          git push origin HEAD:main

      - name: Build clean RollPig Plus archive and checksum
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile

          root = 'astrbot_plugin_rollpig_plus'
          asset = Path('astrbot_plugin_rollpig_plus-v3.2.0.zip')
          excluded_prefixes = (
              '.github/',
              'tests/',
              'scripts/',
              'node_modules/',
              '__pycache__/',
          )
          excluded_files = {
              '.pre-commit-config.yaml',
              '.gitignore',
              'package.json',
              'package-lock.json',
          }
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(asset, 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in tracked:
                  if not name or name in excluded_files or name.startswith(excluded_prefixes):
                      continue
                  path = Path(name)
                  if path.is_file():
                      archive.write(path, f'{root}/{name}')
          if not asset.is_file() or asset.stat().st_size == 0:
              raise SystemExit('release archive was not created')
          print(f'archive_bytes={asset.stat().st_size}')
          PY
          sha256sum astrbot_plugin_rollpig_plus-v3.2.0.zip > SHA256SUMS

      - name: Recreate v3.2.0 and reserve global latest for bridge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)"
          git tag -a v3.2.0 "$RELEASE_SHA" -m "RollPig Plus v3.2.0 dual-channel updater"
          git push origin v3.2.0
          cat > /tmp/release-notes.md <<'EOF'
          ## 今日小豬 · 增強版 v3.2.0

          本版本使用獨立 AstrBot 身份 `casama233/astrbot_plugin_rollpig_plus`，並修正舊版與 Plus 共用 GitHub `latest` 所造成的升級通道衝突。

          ### 升級通道
          - 舊 `astrbot_plugin_rollpig` v3.1.3 及更早版本：GitHub Global Latest 保留為 **v3.1.4 bridge**，先安全升級到橋接版。
          - `astrbot_plugin_rollpig_plus` v3.2.0+：更新器改讀 Releases 列表，只選擇名稱與版本精確匹配的 `astrbot_plugin_rollpig_plus-vX.Y.Z.zip`。
          - 因此未來 Plus 發布不再讓舊插件誤認為可就地覆蓋更新。

          ### 安全遷移
          - v3.1.4 bridge 寫入增強版來源 marker，不移動、不刪除舊資料。
          - Plus 首次安裝採 Copy → Verify → Atomic Commit 遷移到 `data/plugin_data/astrbot_plugin_rollpig_plus`。
          - 無法安全確認來源時拒絕自動遷移。

          ### 驗證
          - Python 3.10 CI：passed
          - Python 3.12 CI：passed
          - pytest / compileall / pre-commit：passed
          EOF
          gh release create v3.2.0 \
            astrbot_plugin_rollpig_plus-v3.2.0.zip \
            SHA256SUMS \
            --target "$RELEASE_SHA" \
            --title "今日小豬 · 增強版 v3.2.0" \
            --notes-file /tmp/release-notes.md
          gh release edit v3.1.4 --latest
