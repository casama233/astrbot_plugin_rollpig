name: Sync Pig Manager Bootstrap

on:
  push:
    branches:
      - feat/wiki-product-bridge
    paths:
      - pages/pig-manager/ui-bootstrap.js
      - scripts/sync_pig_manager_bootstrap.py
      - .github/workflows/sync-pig-manager-bootstrap.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/wiki-product-bridge

      - name: Synchronize generated inline bootstrap
        run: python scripts/sync_pig_manager_bootstrap.py

      - name: Commit synchronized page
        run: |
          if git diff --quiet -- pages/pig-manager/index.html; then
            echo "pig-manager page already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/pig-manager/index.html
          git commit -m "build: sync pig-manager inline bootstrap"
          git push origin HEAD:feat/wiki-product-bridge
