name: Align eaten transaction regression test

on:
  push:
    branches:
      - fix/eaten-next-day-duplicate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eaten-next-day-duplicate
          fetch-depth: 0
      - name: Patch regression test to mirror runtime probe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_sqlite_storage.py')
          text = path.read_text(encoding='utf-8')
          old = '''    result = storage.create_daily_draw(\n        draw_date="2026-08-04",\n        user_id="v2|qq|user|1",\n        pig={"id": "pig-a", "name": "A"},\n        penalty_should_fail=True,\n    )\n    assert result["status"] == "penalty-duplicate"\n'''
          new = '''    result = storage.create_daily_draw(\n        draw_date="2026-08-04",\n        user_id="v2|qq|user|1",\n        pig=None,\n        penalty_should_fail=True,\n    )\n    assert result["status"] == "penalty-duplicate"\n'''
          if old not in text:
              raise SystemExit('expected transaction test block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit test fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_sqlite_storage.py
          git commit -m 'test: mirror eaten duplicate probe transaction'
          git push origin HEAD:fix/eaten-next-day-duplicate
