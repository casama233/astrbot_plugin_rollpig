name: Phase 3B Guarded Apply

on:
  push:
    branches:
      - feature/oven-refill-v3.7.0
    paths:
      - scripts/apply_phase3b_integration.py
      - .github/workflows/phase3b-guarded-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oven-refill-v3.7.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check
      - name: Apply guarded integration
        run: python scripts/apply_phase3b_integration.py
      - name: Focused Phase 3B tests
        run: pytest -q tests/test_oven_refill_service.py tests/test_oven_refill_feature_contract.py tests/test_roast_charges.py tests/test_dynamic_help_system.py tests/test_daily_report.py tests/test_command_registration_boundary.py tests/test_v361_hotfix_contract.py
      - name: Compile source
        run: python -m compileall -q main.py legacy_main.py oven_refill_feature.py daily_report_core.py daily_report_feature.py gameplay_events.py roast_charges.py storage services
      - name: Full test suite
        run: pytest -q
      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Diff check
        run: git diff --check
      - name: Remove one-shot integration helpers
        run: git rm scripts/apply_phase3b_integration.py .github/workflows/phase3b-guarded-apply.yml
      - name: Commit verified Phase 3B
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add cooperative group oven refill"
          git push origin HEAD:feature/oven-refill-v3.7.0
