name: One-shot validate and merge EX coverage v2

on:
  push:
    branches:
      - fix/ex-handwritten-coverage-gate
    paths:
      - .github/workflows/one-shot-validate-merge-ex-coverage-v2.yml

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  validate-and-merge-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/ex-handwritten-coverage-gate
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate repository implementation and regressions
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/check_ex_handwritten_coverage.py
          test -f tests/test_ex_handwritten_coverage.py
          grep -Fq 'Check explicit bundled EX authoring coverage' .github/workflows/resource-source.yml
          grep -Fq -- "--fragments 'resource/bundled_ex_copy*.json'" .github/workflows/resource-source.yml
          grep -Fq 'deterministic baseline' docs/EX-VARIANTS.md
          grep -Fq 'EX 手寫覆蓋 CI' CHANGELOG.md

          python -m py_compile \
            scripts/check_ex_handwritten_coverage.py \
            tests/test_ex_handwritten_coverage.py \
            ex_level_notice.py \
            tests/test_ex_level_notice.py \
            tests/test_ex_level_badge_rendering.py

          python scripts/check_ex_handwritten_coverage.py \
            --catalog resource/pig.json \
            --fragments 'resource/bundled_ex_copy*.json' \
            --json-out /tmp/ex-handwritten-coverage.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

          python -m pip install --disable-pip-version-check -q pytest pytest-asyncio pillow
          python -m pytest -q \
            tests/test_ex_handwritten_coverage.py \
            tests/test_ex_level_notice.py \
            tests/test_ex_level_badge_rendering.py

      - name: Wait for non-temporary sibling checks
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          sha="$GITHUB_SHA"
          for attempt in $(seq 1 120); do
            payload="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$owner/$repo/commits/$sha/check-runs?per_page=100")"
            failed="$(jq '[
              .check_runs[]
              | select((.name // "") | startswith("validate-and-merge") | not)
              | select(.status == "completed")
              | select(((.conclusion // "") as $c | ["success","neutral","skipped"] | index($c) | not))
            ] | length' <<<"$payload")"
            pending="$(jq '[
              .check_runs[]
              | select((.name // "") | startswith("validate-and-merge") | not)
              | select(.status != "completed")
            ] | length' <<<"$payload")"
            if [ "$failed" -gt 0 ]; then
              jq -r '.check_runs[]
                | select((.name // "") | startswith("validate-and-merge") | not)
                | select(.status == "completed")
                | select(((.conclusion // "") as $c | ["success","neutral","skipped"] | index($c) | not))
                | "failed check: \(.name) => \(.conclusion)"' <<<"$payload" >&2
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'timed out waiting for non-temporary sibling checks' >&2
          exit 1

      - name: Remove all temporary workflows and push a clean PR head
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-shot-ex-handwritten-coverage-gate.yml \
            .github/workflows/one-shot-validate-merge-ex-coverage.yml \
            .github/workflows/one-shot-validate-merge-ex-coverage-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary EX coverage workflows'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Resolve PR and verify the clean diff
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" \
            --state open \
            --json number \
            --jq '.[0].number')"
          test -n "$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 30); do
            remote_sha="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
            local_sha="$(git rev-parse HEAD)"
            if [ "$remote_sha" = "$local_sha" ]; then
              break
            fi
            sleep 2
          done
          test "$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = "$(git rev-parse HEAD)"

          names="$(gh pr diff "$number" --repo "$GITHUB_REPOSITORY" --name-only)"
          printf '%s\n' "$names"
          if grep -q 'one-shot-.*ex.*coverage' <<<"$names"; then
            echo 'temporary workflow remains in PR diff' >&2
            exit 1
          fi
          grep -Fxq 'scripts/check_ex_handwritten_coverage.py' <<<"$names"
          grep -Fxq 'tests/test_ex_handwritten_coverage.py' <<<"$names"
          grep -Fxq '.github/workflows/resource-source.yml' <<<"$names"

      - name: Refuse unresolved review threads
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          unresolved="$(gh api graphql \
            -f owner='casama233' \
            -f name='astrbot_plugin_rollpig' \
            -F number="$PR_NUMBER" \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          test "$unresolved" = '0'

      - name: Squash merge verified coverage gate
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --subject 'ci: enforce explicit bundled EX authoring coverage' \
            --body 'Audit the catalog against explicit bundled EX fragments before Resource Source materialization; fail on missing, unknown, duplicate, incomplete, empty, or copied level text so deterministic fallback cannot disguise a handwritten-coverage regression.'
