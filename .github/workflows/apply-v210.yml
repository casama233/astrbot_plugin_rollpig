name: Apply v2.10 storage iteration

on:
  push:
    branches:
      - agent/sql-read-paths-projection-repair-v2.10.0

permissions:
  contents: write

concurrency:
  group: apply-v210-storage
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/sql-read-paths-projection-repair-v2.10.0
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Keep schema migration atomic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_v210.py')
          text = path.read_text(encoding='utf-8')
          old = '''                connection.executescript(
                    """
                    CREATE TABLE IF NOT EXISTS daily_draw_groups (
                        draw_date TEXT NOT NULL,
                        user_id TEXT NOT NULL,
                        group_id TEXT NOT NULL,
                        PRIMARY KEY (draw_date, user_id, group_id),
                        FOREIGN KEY (draw_date, user_id)
                            REFERENCES daily_draws(draw_date, user_id)
                            ON DELETE CASCADE
                    );
                    CREATE INDEX IF NOT EXISTS idx_identities_namespace_raw
                        ON identities(namespace, raw_id);
                    CREATE INDEX IF NOT EXISTS idx_daily_draw_groups_group_date
                        ON daily_draw_groups(group_id, draw_date);
                    """
                )
'''
          new = '''                connection.execute(
                    """
                    CREATE TABLE IF NOT EXISTS daily_draw_groups (
                        draw_date TEXT NOT NULL,
                        user_id TEXT NOT NULL,
                        group_id TEXT NOT NULL,
                        PRIMARY KEY (draw_date, user_id, group_id),
                        FOREIGN KEY (draw_date, user_id)
                            REFERENCES daily_draws(draw_date, user_id)
                            ON DELETE CASCADE
                    )
                    """
                )
                connection.execute(
                    "CREATE INDEX IF NOT EXISTS idx_identities_namespace_raw "
                    "ON identities(namespace, raw_id)"
                )
                connection.execute(
                    "CREATE INDEX IF NOT EXISTS idx_daily_draw_groups_group_date "
                    "ON daily_draw_groups(group_id, draw_date)"
                )
'''
          if text.count(old) != 1:
              raise SystemExit('atomic migration anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply iteration
        run: python .github/scripts/apply_v210.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Validate
        run: |
          python -m compileall -q main.py rollpig_core.py updater.py storage services
          pytest -q
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_v210.py
          git add CHANGELOG.md README.md metadata.yaml updater.py main.py \
            storage services pages/pig-manager/index.html tests \
            .github/workflows/ci.yml
          git commit -m "feat: add indexed SQLite reads and projection repair (v2.10.0)"
          git push origin HEAD:agent/sql-read-paths-projection-repair-v2.10.0
