name: Temporary KPI mini visual staging

on:
  push:
    branches:
      - fix/kpi-balanced-mini-visuals
    paths:
      - .github/workflows/kpi-balanced-mini-visuals-temp.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/_stage_kpi_balanced_visuals_v2.py
      - name: Validate focused contracts
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_admin_trend_ui_contract.py
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/browser/admin-ui.test.mjs
          git diff --check
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kpi-balanced-mini-visuals-temp.yml scripts/_stage_kpi_balanced_visuals.py scripts/_stage_kpi_balanced_visuals_v2.py
          git add pages/pig-manager/index.html tests/test_admin_trend_ui_contract.py tests/browser/admin-ui.test.mjs CHANGELOG.md
          git diff --cached --check
          git commit -m "fix: balance KPI mini visualizations"
          git push origin HEAD:fix/kpi-balanced-mini-visuals
