name: Apply v2.8 integration

on:
  push:
    branches:
      - agent/storage-abstraction-safe-updater-v2.8.0

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/storage-abstraction-safe-updater-v2.8.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply integration patch
        run: python .github/scripts/apply_v28.py

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Validate source and tests
        run: |
          python -m compileall -q main.py rollpig_core.py updater.py storage
          pytest -q
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit integrated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add storage abstraction and safe panel updater"
          git push origin HEAD:agent/storage-abstraction-safe-updater-v2.8.0

# synchronization trigger for the main-branch pull_request_target workflow
