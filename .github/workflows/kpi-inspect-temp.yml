name: Temporary KPI renderer inspection

on:
  push:
    branches: [fix/kpi-strip-v2]
    paths: [.github/workflows/kpi-inspect-temp.yml]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print KPI renderer context
        shell: bash
        run: |
          set -euo pipefail
          echo '=== KPI DOM ==='
          grep -n -A12 -B2 '<section class="metrics"' pages/pig-manager/index.html || true
          echo '=== renderer symbols ==='
          grep -n -E 'renderSpark|renderMetric|vToday|vDraws|mPigs|trend\.map|metric-snapshot' pages/pig-manager/index.html | head -n 100 || true
          echo '=== renderer context ==='
          for pat in 'function renderSpark' 'function renderMetric' "renderSpark('vToday'" 'renderMetricVisuals'; do
            line=$(grep -n -F "$pat" pages/pig-manager/index.html | head -n1 | cut -d: -f1 || true)
            if [ -n "$line" ]; then
              start=$((line>30 ? line-30 : 1)); end=$((line+90));
              echo "--- $pat @ $line ---"; sed -n "${start},${end}p" pages/pig-manager/index.html;
            fi
          done
          echo '=== responsive metric css ==='
          grep -n -E '\.metrics\{|#view-overview \.metrics|metric-snapshot-viz|metric-signal' pages/pig-manager/index.html pages/pig-manager/ex-integration.css | head -n 120 || true
