name: One-shot validate and merge EX notice

on:
  push:
    branches:
      - fix/ex-level-up-notice
    paths:
      - .github/workflows/one-shot-validate-merge-ex-notice.yml

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  validate-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '201'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/ex-level-up-notice
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate implementation exists
        shell: bash
        run: |
          test -f ex_level_notice.py
          test -f tests/test_ex_level_notice.py
          grep -Fq 'if _ex_event_created is True:' ex_variant_feature.py
          grep -Fq '_queue_ex_level_notice_from_locals(locals())' ex_variant_feature.py
          grep -Fq '_consume_ex_level_up_notice()' legacy_main.py
          grep -Fq '重逢第' ex_level_notice.py
          grep -Fq 'EX Lv.{level - 1} → Lv.{level}' ex_level_notice.py

          python -m py_compile \
            ex_level_notice.py \
            ex_variant_feature.py \
            legacy_main.py \
            tests/test_ex_level_notice.py
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_ex_level_notice.py

      - name: Remove temporary workflows and push clean head
        shell: bash
        run: |
          rm -f \
            .github/workflows/one-shot-ex-level-up-notice.yml \
            .github/workflows/one-shot-validate-merge-ex-notice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary EX notice workflows"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Ensure the PR contains no temporary workflow
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            names="$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null || true)"
            if [ -n "$names" ] && ! grep -q 'one-shot-.*ex.*notice' <<<"$names"; then
              printf '%s\n' "$names"
              exit 0
            fi
            sleep 2
          done
          echo 'PR diff still contains a temporary workflow or could not be read' >&2
          exit 1

      - name: Wait for the clean-head checks
        shell: bash
        run: gh pr checks "$PR_NUMBER" --watch --required

      - name: Refuse unresolved review threads
        shell: bash
        run: |
          unresolved="$(gh api graphql \
            -f owner='casama233' \
            -f name='astrbot_plugin_rollpig' \
            -F number="$PR_NUMBER" \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          test "$unresolved" = '0'

      - name: Squash merge verified fix
        shell: bash
        run: |
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --subject 'fix: show one-time EX level-up notice (#201)' \
            --body 'Queue the visible upgrade line only when the deduplicated ex_level_up event is newly persisted; consume it once per command context, fail closed for EX0 or uncertain events, preserve uncapped levels, and cover the behavior with focused regressions.'
