name: Diagnose live RollPig source

on:
  push:
    branches:
      - diagnostic/live-source-catalog
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare live official source with Felis full source
        run: |
          python - <<'PY'
          import json
          import urllib.request

          official_base = "https://curryudon.top/astrbot-rollpig/v1/"
          official_headers = {
              "User-Agent": "AstrBot-RollPig/3.6.3 (+https://github.com/casama233/astrbot_plugin_rollpig)",
              "X-RollPig-Client": "astrbot_plugin_rollpig_plus",
              "X-RollPig-Protocol": "1",
          }
          felis_url = "https://raw.githubusercontent.com/Felis2026/rollpig-resources/main/rollpig/pig.json"

          def load(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("GET", url, "status", resp.status)
                  return json.loads(resp.read().decode("utf-8-sig"))

          official = load(official_base + "pig.json", official_headers)
          felis = load(felis_url, {"User-Agent": "github-actions-rollpig-diagnostic"})
          official_by_id = {str(x.get("id")): x for x in official if isinstance(x, dict)}
          felis_by_id = {str(x.get("id")): x for x in felis if isinstance(x, dict)}
          only_felis = sorted(set(felis_by_id) - set(official_by_id))
          only_official = sorted(set(official_by_id) - set(felis_by_id))

          print("OFFICIAL COUNT", len(official_by_id))
          print("FELIS COUNT", len(felis_by_id))
          print("ONLY FELIS COUNT", len(only_felis))
          print("ONLY OFFICIAL COUNT", len(only_official))
          print("ONLY FELIS RECORDS")
          for pig_id in only_felis:
              item = felis_by_id[pig_id]
              print(json.dumps({"id": pig_id, "name": item.get("name"), "description": item.get("description")}, ensure_ascii=False, sort_keys=True))
          print("ONLY OFFICIAL IDS", only_official)
          for pig_id in ("miku-pig", "wechat-pig", "duke-pig"):
              print("TARGET", pig_id, "official=", pig_id in official_by_id, "felis=", pig_id in felis_by_id)
          PY
