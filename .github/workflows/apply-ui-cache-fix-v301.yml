name: Apply UI cache fix v3.0.1

on:
  push:
    branches:
      - fix/ui-cache-busting-v3.0.1
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-ui-cache-fix-v301
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'fix/ui-cache-busting-v3.0.1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/ui-cache-busting-v3.0.1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Apply cache-busting fix
        run: python scripts/apply_ui_cache_fix_v301.py

      - name: Validate frontend syntax
        run: |
          node --check pages/pig-manager/ui-feedback.js
          node --check pages/pig-manager/ui-feedback-core.js
          node --check pages/pig-manager/ui-enterprise.js
          node --check pages/pig-manager/ui-analytics.js

      - name: Compile source
        run: python -m compileall -q main.py rollpig_core.py updater.py storage services tests

      - name: Run focused cache tests
        shell: bash
        run: |
          set +e
          pytest -vv \
            tests/test_ui_cache_busting.py \
            tests/test_v301_release_contract.py \
            tests/test_dashboard_feedback.py \
            > pytest-focused.log 2>&1
          status=$?
          cat pytest-focused.log
          exit $status

      - name: Upload focused test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v301-focused-test-log
          path: pytest-focused.log
          if-no-files-found: warn
          retention-days: 2

      - name: Run full tests
        shell: bash
        run: |
          set +e
          pytest -q > pytest-full.log 2>&1
          status=$?
          cat pytest-full.log
          exit $status

      - name: Upload full test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v301-full-test-log
          path: pytest-full.log
          if-no-files-found: warn
          retention-days: 2

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Commit validated fix
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: cache-bust management UI assets (v3.0.1)"
          git push origin HEAD:fix/ui-cache-busting-v3.0.1
