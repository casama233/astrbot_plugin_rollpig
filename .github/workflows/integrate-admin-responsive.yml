name: Integrate Admin Responsive Patch

on:
  push:
    branches:
      - release/admin-responsive-integration
    paths:
      - .github/workflows/integrate-admin-responsive.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v6
        with:
          ref: release/admin-responsive-integration
          fetch-depth: 0

      - name: Fetch source PR branch
        run: git fetch origin agent/fix-admin-responsive-layout

      - name: Apply responsive patch on latest main-derived page
        run: |
          git diff 2dcb21d756592c1305365ee4791d4a33668e5feb..origin/agent/fix-admin-responsive-layout -- pages/pig-manager/index.html > /tmp/admin-responsive.patch
          git apply --3way /tmp/admin-responsive.patch
          git checkout origin/agent/fix-admin-responsive-layout -- tests/browser/responsive-layout.test.mjs

      - name: Commit integrated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/pig-manager/index.html tests/browser/responsive-layout.test.mjs
          git commit -m "fix: integrate admin responsive layout on latest main"
          git push origin HEAD:release/admin-responsive-integration
