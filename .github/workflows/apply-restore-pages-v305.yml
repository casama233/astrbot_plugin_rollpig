name: Apply emergency page restore v3.0.5

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-restore-pages-v305
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'fix/restore-pages-v3.0.5'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-pages-v3.0.5
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Apply emergency restore
        run: python scripts/apply_restore_pages_v305.py

      - name: Validate frontend sources
        run: |
          node --check pages/pig-manager/ui-feedback.js
          node --check pages/pig-manager/ui-feedback-core.js
          node --check pages/pig-manager/ui-enterprise.js
          node --check pages/pig-manager/ui-analytics.js

      - name: Compile source
        run: python -m compileall -q main.py rollpig_core.py updater.py storage services tests

      - name: Run full tests
        run: pytest -q

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Commit validated restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore plugin page availability (v3.0.5)"
          git push origin HEAD:fix/restore-pages-v3.0.5
