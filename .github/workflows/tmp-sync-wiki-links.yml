name: Temporary Pig Manager Bootstrap Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'fix/wiki-links-in-sandbox'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/wiki-links-in-sandbox
          fetch-depth: 0

      - name: Synchronize inline bootstrap
        run: python scripts/sync_pig_manager_bootstrap.py

      - name: Commit generated page
        run: |
          if git diff --quiet -- pages/pig-manager/index.html; then
            echo "index.html already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/pig-manager/index.html
          git commit -m "chore: sync pig-manager bootstrap"
          git push origin HEAD:fix/wiki-links-in-sandbox
