name: Publish v2.4.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v2.4.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: c9238d0cfa362329fb1c30fa92b6a979957e49d9
        run: |
          if gh release view v2.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.4.0 already exists"
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## v2.4.0 — 稳定性与安全更新

          - 修复并发抽取造成当日缓存与永久图鉴不一致的问题，并为相关 JSON 写入加入预写、备份和失败回滚。
          - `@他人` 改为严格只读查看，不再替对方抽取或绕过次日惩罚。
          - 新增跨平台身份命名空间与旧 ID 认领机制，防止不同平台同号串数据。
          - JSON 损坏时保留原始副本并尝试从备份恢复。
          - AI 文案增加每猪独立锁与可配置超时。
          - 管理页增加同源与 CSRF 校验，并优化统计、缩略图和 PigHub 预览性能。
          - 云同步增加跳转主机、公网 IP、图片尺寸与内存峰值限制。
          - 新增 IANA 时区配置，修复图片处理、文案溢出、管理员 ID 与 WhatsApp LID 相容问题。
          - 新增 Python 3.10／3.12 CI、9 项回归测试与 pre-commit 检查。

          升级前建议保留插件数据目录备份；本版本会继续读取旧格式 ID，并在首次使用时记录平台认领关系。
          EOF
          gh release create v2.4.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "v2.4.0" \
            --notes-file /tmp/release-notes.md
