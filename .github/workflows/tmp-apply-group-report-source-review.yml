name: Temporary group report and source review fix

on:
  push:
    branches:
      - fix/group-report-and-source-review-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: |
          sed -i 's/marker = "## \[Unreleased\]"/marker = "## 未發佈"/' scripts/apply_group_report_source_review_fix.py
          sed -i 's/pattern.subn(replacement, text, count=1)/pattern.subn(lambda _: replacement, text, count=1)/' scripts/apply_group_report_source_review_fix.py
          python scripts/apply_group_report_source_review_fix.py
          python - <<'PY'
          from pathlib import Path
          p = Path('daily_report_feature.py')
          s = p.read_text(encoding='utf-8')
          old = '        """Manual report plus per-group automatic-push management."""\n'
          new = '        """manual views never sacrifice; manage per-group automatic push."""\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one report docstring, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          page = Path('pages/pig-manager/index.html')
          html = page.read_text(encoding='utf-8')
          page.write_text('\n'.join(line.rstrip() for line in html.splitlines()) + '\n', encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pre-commit
      - name: Compile
        run: python -m compileall -q .
      - name: Test
        run: pytest -q
      - name: Pre-commit
        run: pre-commit run --all-files
      - name: Diff check
        run: git diff --check
      - name: Remove temporary applicator
        run: |
          rm -f scripts/apply_group_report_source_review_fix.py
          rm -f .github/workflows/tmp-apply-group-report-source-review.yml
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: make reports opt-in and harden source review'
          git push origin HEAD:fix/group-report-and-source-review-hardening
