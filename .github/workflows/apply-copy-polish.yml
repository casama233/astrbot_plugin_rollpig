name: Apply Piggy Copy Polish

on:
  push:
    branches:
      - feat/piggy-copy-polish
    paths:
      - .github/workflows/apply-copy-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/piggy-copy-polish

      - name: Apply copy polish
        run: python scripts/apply_piggy_copy_polish.py

      - name: Commit polished copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player_copy.py oven_refill_feature.py reservation_firewood_feature.py roast_reservation_feature.py services/roast_service.py legacy_main.py permanent_collection_feature.py resource/pig.json
          if git diff --cached --quiet; then
            echo "no copy changes produced"
            exit 1
          fi
          git commit -m "content: unify player-facing Piggy voice"
          git push origin HEAD:feat/piggy-copy-polish
