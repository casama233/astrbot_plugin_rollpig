name: Finalize Piggy Copy Polish

on:
  push:
    branches:
      - feat/piggy-copy-polish
    paths:
      - .github/workflows/apply-copy-polish.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/piggy-copy-polish

      - name: Repair generated newline escapes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('roast_reservation_feature.py')
          text = path.read_text(encoding='utf-8')
          repairs = [
              ('这口埋伏会立刻结算。\n"', '这口埋伏会立刻结算。\\n"'),
              ('后厨埋伏立刻掀锅！\n主厨带着 ', '后厨埋伏立刻掀锅！\\n主厨带着 '),
              ('烤架顺着火舌反咬主厨。\n这次轮到主厨的小猪上桌。', '烤架顺着火舌反咬主厨。\\n这次轮到主厨的小猪上桌。'),
          ]
          for old, new in repairs:
              if old not in text:
                  raise SystemExit(f'generated newline baseline not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify repaired Python compiles
        run: |
          python -m py_compile roast_reservation_feature.py
          python -m py_compile reservation_firewood_feature.py services/roast_service.py oven_refill_feature.py legacy_main.py player_copy.py

      - name: Remove temporary transformation tooling
        run: rm -f scripts/apply_piggy_copy_polish.py .github/workflows/apply-copy-polish.yml

      - name: Commit final generated copy state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: finalize Piggy copy polish"
          git push origin HEAD:feat/piggy-copy-polish
