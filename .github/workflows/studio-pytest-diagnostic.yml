name: Studio Pytest Diagnostic

on:
  push:
    branches:
      - feat/ai-pig-studio
    paths:
      - .github/workflows/studio-pytest-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-pig-studio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio pre-commit
      - name: Run pytest and capture complete log
        shell: bash
        run: |
          set +e
          pytest -q > pytest.log 2>&1
          code=$?
          echo "$code" > pytest-exit-code.txt
          cat pytest.log
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: studio-pytest-log
          path: |
            pytest.log
            pytest-exit-code.txt
          if-no-files-found: error
