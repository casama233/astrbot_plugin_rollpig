name: CI

on:
  push:
    branches:
      - main
      - agent/fix-audit-findings-v2.4.0
      - agent/fix-new-unlock-trend-v2.13.1
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-v2131:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/agent/fix-new-unlock-trend-v2.13.1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-new-unlock-trend-v2.13.1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Apply v2.13.1 patch and restore permanent CI
        run: |
          python tools/apply_v2131.py
          rm tools/apply_v2131.py
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('      - agent/fix-new-unlock-trend-v2.13.1\n', '', 1)
          start = text.index('  apply-v2131:\n')
          end = text.index('  test:\n', start)
          text = text[:start] + text[end:]
          text = text.replace(
              "  test:\n    if: github.ref != 'refs/heads/agent/fix-new-unlock-trend-v2.13.1'\n",
              '  test:\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patched source
        run: |
          python -m compileall -q main.py rollpig_core.py updater.py storage services
          pytest -q
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit validated patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restore new unlock dashboard trend (v2.13.1)"
          git push origin HEAD:agent/fix-new-unlock-trend-v2.13.1

  test:
    if: github.ref != 'refs/heads/agent/fix-new-unlock-trend-v2.13.1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Compile source
        run: python -m compileall -q main.py rollpig_core.py updater.py storage services

      - name: Run tests
        run: pytest -q

      - name: Run pre-commit checks
        if: matrix.python-version == '3.12'
        run: pre-commit run --all-files --show-diff-on-failure
