name: CI

on:
  push:
    branches:
      - main
      - agent/fix-audit-findings-v2.4.0
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-v212:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/sql-roast-ai-catalog-v2.12.0'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/sql-roast-ai-catalog-v2.12.0
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Apply SQL-primary migration
        run: |
          python tools/apply_v212.py
          python tools/fix_v212_round2.py
          rm tools/apply_v212.py tools/fix_v212_round2.py

      - name: Validate migration
        run: |
          python -m compileall -q main.py rollpig_core.py updater.py storage services
          pytest -q
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add SQL-primary roast, AI cache and catalog writes (v2.12.0)"
          git push origin HEAD:agent/sql-roast-ai-catalog-v2.12.0

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Compile source
        run: python -m compileall -q main.py rollpig_core.py updater.py storage services

      - name: Run tests
        run: pytest -q

      - name: Run pre-commit checks
        if: matrix.python-version == '3.12'
        run: pre-commit run --all-files --show-diff-on-failure
