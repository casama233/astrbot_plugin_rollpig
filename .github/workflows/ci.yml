name: CI

on:
  push:
    branches:
      - main
      - agent/fix-audit-findings-v2.4.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-v28:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/storage-abstraction-safe-updater-v2.8.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/storage-abstraction-safe-updater-v2.8.0
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply v2.8 integration
        run: python .github/scripts/apply_v28.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Validate integrated source
        run: |
          python -m compileall -q main.py rollpig_core.py updater.py storage
          pytest -q
          pre-commit run --all-files --show-diff-on-failure

      - name: Restore permanent CI definition
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          old = 'run: python -m compileall -q main.py ' + 'rollpig_core.py'
          new = old + ' updater.py storage'
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit integrated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add storage abstraction and safe panel updater"
          git push origin HEAD:agent/storage-abstraction-safe-updater-v2.8.0

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Compile source
        run: python -m compileall -q main.py rollpig_core.py updater.py storage

      - name: Run tests
        run: pytest -q

      - name: Run pre-commit checks
        if: matrix.python-version == '3.12'
        run: pre-commit run --all-files --show-diff-on-failure
