name: CI

on:
  push:
    branches:
      - main
      - agent/fix-audit-findings-v2.4.0
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-v210:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/sqlite-indexed-reads-v2.10.0-rebased'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean branch
        uses: actions/checkout@v4
        with:
          ref: agent/sqlite-indexed-reads-v2.10.0-rebased
          fetch-depth: 0

      - name: Copy validated v2.10 formal files
        run: |
          git fetch origin agent/sql-read-paths-projection-repair-v2.10.0
          git checkout origin/agent/sql-read-paths-projection-repair-v2.10.0 -- \
            CHANGELOG.md README.md main.py metadata.yaml updater.py \
            pages/pig-manager services storage tests
          git checkout -- .github/workflows/ci.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Validate reconstructed branch
        run: |
          python -m compileall -q main.py rollpig_core.py updater.py storage services
          pytest -q
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit validated v2.10 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md main.py metadata.yaml updater.py \
            pages/pig-manager services storage tests
          git commit -m "feat: add indexed SQLite reads and projection repair (v2.10.0)"
          git push origin HEAD:agent/sqlite-indexed-reads-v2.10.0-rebased

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Compile source
        run: python -m compileall -q main.py rollpig_core.py updater.py storage

      - name: Run tests
        run: pytest -q

      - name: Run pre-commit checks
        if: matrix.python-version == '3.12'
        run: pre-commit run --all-files --show-diff-on-failure
