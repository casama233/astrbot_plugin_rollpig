name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-pr-176-history:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/roast-card-missing-image'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore untouched changelog history and normal CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')

          repairs = {
              '1. `pig-manager` — 豬圈管理（預設）':
                  '1. `pig-manager` — 豬圈管理（預設首頁）',
              'schema 5 新增日期／小豬與圖鑑反向查询索引，改善大数据量下的趋势和收藏统计性能。':
                  'schema 5 新增日期／小猪与图鉴反向查询索引，改善大数据量下的趋势和收藏统计性能。',
          }

          for old, new in repairs.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'repair precondition failed for {old!r}: {count}')
              text = text.replace(old, new, 1)

          if not text.endswith('\n'):
              text += '\n'
          path.write_text(text, encoding='utf-8')
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Restore exact changelog history for PR 176"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  test:
    name: test (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Enforce PR changelog and Wiki contract
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/maintenance_contract.py pr
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --event "$GITHUB_EVENT_PATH"

      - name: Verify current Wiki command and configuration coverage
        run: python scripts/maintenance_contract.py coverage

      - name: Compile source
        run: python -m compileall -q main.py legacy_main.py daily_report_core.py daily_report_feature.py gameplay_events.py ex_variants.py ex_variant_feature.py installation_migrations.py random_roast_feature.py roast_reservations.py roast_reservation_feature.py rollpig_core.py updater.py display_copy.py storage services scripts/maintenance_contract.py scripts/check_display_copy.py

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest pre-commit fonttools
          python -m pip check

      - name: Verify Simplified display copy and font coverage
        run: python scripts/check_display_copy.py

      - name: Run tests
        run: pytest -q

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure
