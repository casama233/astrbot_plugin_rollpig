name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-release-branch:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v3.11.8'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore untouched changelog history and normal CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')

          repairs = {
              '### 🐷 整個插件開始說同一種「豬話」\n玩家高頻文案':
                  '### 🐷 整個插件開始說同一種「豬話」\n\n玩家高頻文案',
              '所有管理页资源缓存键同步提升至 v3.0.2，不修改 SQLite 單一權威、API 契約或業務流程。':
                  '所有管理页资源缓存键同步提升至 v3.0.2，不修改 SQLite 单一权威、API 契约或业务流程。',
              '兼容文档仍在同一事务中同步，供 JSON 导出、舊版回滚和災難恢復使用':
                  '兼容文档仍在同一事务中同步，供 JSON 导出、旧版回滚和灾難恢復使用',
              '旧版整份本地图鉴会自动迁移为覆盖层與刪除屏蔽，不丟失管理員已有修改。':
                  '旧版整份本地图鉴会自动迁移为覆盖层与删除屏蔽，不丢失管理员已有修改。',
          }

          for old, new in repairs.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'repair precondition failed for {old!r}: {count}')
              text = text.replace(old, new, 1)

          if not text.endswith('\n'):
              text += '\n'

          path.write_text(text, encoding='utf-8')
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Restore exact changelog history for v3.11.8"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  test:
    name: test (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Enforce PR changelog and Wiki contract
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/maintenance_contract.py pr
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --event "$GITHUB_EVENT_PATH"

      - name: Verify current Wiki command and configuration coverage
        run: python scripts/maintenance_contract.py coverage

      - name: Compile source
        run: python -m compileall -q main.py legacy_main.py daily_report_core.py daily_report_feature.py gameplay_events.py ex_variants.py ex_variant_feature.py installation_migrations.py random_roast_feature.py roast_reservations.py roast_reservation_feature.py rollpig_core.py updater.py display_copy.py storage services scripts/maintenance_contract.py scripts/check_display_copy.py

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest pre-commit fonttools
          python -m pip check

      - name: Verify Simplified display copy and font coverage
        run: python scripts/check_display_copy.py

      - name: Run tests
        run: pytest -q

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure
