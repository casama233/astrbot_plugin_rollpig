name: CI

on:
  push:
    branches:
      - main
      - agent/fix-audit-findings-v2.4.0
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Compile source
        run: python -m compileall -q main.py rollpig_core.py updater.py storage services

      - name: Run tests
        run: pytest -q

      - name: Run pre-commit checks
        if: matrix.python-version == '3.12'
        run: pre-commit run --all-files --show-diff-on-failure

  rebase-v3:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/sqlite-single-authority-v3.0.0' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/sqlite-single-authority-v3.0.0
          fetch-depth: 0

      - name: Rebase onto current main and remove temporary CI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git rebase origin/main
          git checkout origin/main -- .github/workflows/ci.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Validate v2.15 and v3 integration
        run: |
          python -m compileall -q main.py rollpig_core.py updater.py storage services
          pytest -q
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit cleanup and update branch
        run: |
          git add .github/workflows/ci.yml
          git commit -m "chore: rebase SQLite v3 onto v2.15.0"
          git push --force-with-lease origin HEAD:agent/sqlite-single-authority-v3.0.0
