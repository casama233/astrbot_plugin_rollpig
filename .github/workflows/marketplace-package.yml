name: Marketplace Package

on:
  pull_request:
    branches:
      - main
    paths:
      - "metadata.yaml"
      - "requirements.txt"
      - "resource/**"
      - "pages/**"
      - "scripts/prepare_install_bundle.py"
      - ".github/workflows/marketplace-package.yml"
  workflow_dispatch:

jobs:
  validate-marketplace-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate marketplace metadata
        run: |
          python -m pip install --disable-pip-version-check pyyaml packaging
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse

          import yaml
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          metadata = yaml.safe_load(Path("metadata.yaml").read_text(encoding="utf-8"))
          if not isinstance(metadata, dict):
              raise SystemExit("metadata.yaml must contain a mapping")

          for field in ("name", "display_name", "desc", "version", "author", "repo"):
              value = metadata.get(field)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"metadata.yaml missing non-empty field: {field}")

          name = metadata["name"].strip()
          author = metadata["author"].strip()
          if "/" in name or "/" in author:
              raise SystemExit("AstrBot market identity author/name must not contain '/'")
          Version(metadata["version"].strip())

          repo = metadata["repo"].strip()
          parsed = urlparse(repo)
          if parsed.scheme != "https" or parsed.netloc.lower() != "github.com":
              raise SystemExit("repo must be an HTTPS github.com repository URL")
          parts = [part for part in parsed.path.split("/") if part]
          if len(parts) != 2 or parts[1].endswith(".git"):
              raise SystemExit("repo must be https://github.com/{owner}/{repo} without .git")

          astrbot_version = metadata.get("astrbot_version")
          if astrbot_version:
              SpecifierSet(str(astrbot_version))

          tags = metadata.get("tags", [])
          if tags is not None and (
              not isinstance(tags, list) or not all(isinstance(tag, str) and tag.strip() for tag in tags)
          ):
              raise SystemExit("tags must be a list of non-empty strings")

          print(f"plugin_id={author}/{name}")
          print(f"version={metadata['version']}")
          PY

      - name: Build marketplace-sized archive
        run: |
          plugin_name=$(python - <<'PY'
          import yaml
          print(yaml.safe_load(open("metadata.yaml", encoding="utf-8"))["name"])
          PY
          )
          archive="${plugin_name}-marketplace.zip"
          mkdir -p "dist/$plugin_name"
          rsync -a ./ "dist/$plugin_name/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude 'dist/' \
            --exclude 'tests/' \
            --exclude 'scripts/' \
            --exclude 'deploy/' \
            --exclude 'node_modules/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '.pre-commit-config.yaml' \
            --exclude 'CONTRIBUTING.md' \
            --exclude 'resource/font/HanyiYongZiXiaoXiongMaoFan.ttf' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'plugin_data/'

          python scripts/prepare_install_bundle.py "dist/$plugin_name"
          python - <<PY
          import json
          from pathlib import Path
          root = Path("dist/$plugin_name/resource")
          pigs = json.loads((root / "pig.json").read_text(encoding="utf-8-sig"))
          images = [p for p in (root / "image").iterdir() if p.is_file()]
          assert len(pigs) == 22, len(pigs)
          assert len(images) == 22, len(images)
          PY

          test -f "dist/$plugin_name/metadata.yaml"
          test -f "dist/$plugin_name/main.py"
          test -f "dist/$plugin_name/requirements.txt"
          test -f "dist/$plugin_name/resource/font/荆南麦圆体.otf"
          (cd dist && zip -qr "$archive" "$plugin_name")

          archive_size=$(stat -c%s "dist/$archive")
          marketplace_limit=16000000
          echo "Marketplace archive size: $archive_size bytes"
          if [ "$archive_size" -gt "$marketplace_limit" ]; then
            echo "::error::AstrBot marketplace package limit exceeded: $archive_size > $marketplace_limit bytes (16 MB)"
            exit 1
          fi
