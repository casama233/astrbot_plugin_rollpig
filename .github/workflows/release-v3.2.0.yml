name: Release v3.2.0 RollPig Plus

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-v3.2.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'casama233/astrbot_plugin_rollpig'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify release identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          metadata = Path('metadata.yaml').read_text(encoding='utf-8')
          assert 'name: "astrbot_plugin_rollpig_plus"' in metadata
          assert 'version: "3.2.0"' in metadata
          assert 'author: "casama233"' in metadata
          assert 'repo: "https://github.com/casama233/astrbot_plugin_rollpig"' in metadata
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          npm ci
          python -m pip check

      - name: Verify v3.2.0
        run: |
          python -m pytest -q
          npm test
          python -m compileall -q main.py updater.py identity_migration.py services storage
          pre-commit run --all-files --show-diff-on-failure

      - name: Remove one-time publisher from release tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v3.2.0.yml
          git commit -m "ci: remove one-time v3.2.0 publisher"
          git push origin HEAD:main

      - name: Build plugin archive and SHA-256
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile

          root = 'astrbot_plugin_rollpig_plus'
          asset = Path('astrbot_plugin_rollpig_plus-v3.2.0.zip')
          excluded_prefixes = (
              '.github/',
              'tests/',
              'scripts/',
              'node_modules/',
              '__pycache__/',
          )
          excluded_files = {
              '.pre-commit-config.yaml',
              '.gitignore',
          }
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(asset, 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in tracked:
                  if not name or name in excluded_files or name.startswith(excluded_prefixes):
                      continue
                  path = Path(name)
                  if not path.is_file():
                      continue
                  archive.write(path, f'{root}/{name}')
          if not asset.is_file() or asset.stat().st_size == 0:
              raise SystemExit('release archive was not created')
          PY
          sha256sum astrbot_plugin_rollpig_plus-v3.2.0.zip > astrbot_plugin_rollpig_plus-v3.2.0.zip.sha256

      - name: Create v3.2.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git rev-parse -q --verify refs/tags/v3.2.0 >/dev/null; then
            echo "v3.2.0 tag already exists; refusing duplicate release" >&2
            exit 1
          fi
          git tag -a v3.2.0 -m "RollPig Plus v3.2.0"
          git push origin v3.2.0
          cat > /tmp/release-notes.md <<'EOF'
          ## 今日小豬 · 增強版 v3.2.0

          v3.2.0 完成增強分支的獨立 AstrBot 插件身份切換：`casama233/astrbot_plugin_rollpig_plus`。

          ### 重要升級方式
          - 這不是舊 `astrbot_plugin_rollpig` 的就地覆蓋升級。
          - 已安裝 v3.1.4 bridge 的使用者，請以新的 `astrbot_plugin_rollpig_plus` 身份安裝本版本。
          - 首次啟動會驗證舊增強版來源，再以 Copy → Verify → Atomic Commit 複製資料；舊資料不會被刪除。
          - 若舊資料來源無法安全判定，會拒絕自動遷移，而不是冒險搬錯原版資料。
          - 確認新插件資料正常後，再停用舊插件以避免重複指令。

          ### 安全性
          - SQLite 使用 backup API 建立一致性快照。
          - JSON 與自訂圖片使用 SHA-256 複製校驗。
          - 新資料命名空間：`data/plugin_data/astrbot_plugin_rollpig_plus`。
          - 新配置只在首次部署時遷移仍受支援的欄位。
          - updater 驗證 package name、author、repository 與 version。

          ### 驗證
          - Python：125 tests passed
          - Node/browser：6 tests passed
          - `compileall`：passed
          - pre-commit：passed
          EOF
          gh release create v3.2.0 \
            astrbot_plugin_rollpig_plus-v3.2.0.zip \
            astrbot_plugin_rollpig_plus-v3.2.0.zip.sha256 \
            --title "今日小豬 · 增強版 v3.2.0" \
            --notes-file /tmp/release-notes.md \
            --latest
