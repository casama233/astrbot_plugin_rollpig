name: Fix bootstrap EX packaging
on:
  push:
    branches: [release/v3.12.1]
    paths: [.github/workflows/fix-bootstrap-ex-packaging.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8,<9' 'Pillow>=10,<13'
      - name: Reproduce packaged EX failure before the fix
        shell: bash
        run: |
          set -euo pipefail
          if python -m pytest -q tests/test_release_bootstrap_ex_copy.py::test_staged_bootstrap_retains_all_five_explicit_ex_levels > "$RUNNER_TEMP/bootstrap-before.log" 2>&1; then
            cat "$RUNNER_TEMP/bootstrap-before.log"
            echo 'Expected the new regression to fail before patching' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/bootstrap-before.log"
          grep -F 'Bundled EX 手写文案只能引用' "$RUNNER_TEMP/bootstrap-before.log" >/dev/null
      - name: Patch staged-only pruning and release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          expected = {
              'scripts/prepare_install_bundle.py': 'c368fa7d861f4b80627a553459cb2102b315d135',
              'CHANGELOG.md': '3cff02ba2dac72a7f099c819b44825cd8fa706ab',
          }
          for name, sha in expected.items():
              if subprocess.check_output(['git', 'hash-object', name], text=True).strip() != sha:
                  raise SystemExit(f'Changed input: {name}')
          path = Path('scripts/prepare_install_bundle.py')
          text = path.read_text(encoding='utf-8')
          helper = '''def _prune_bundled_ex_copy(
              resource: Path, selected: set[str], source_ids: set[str]
          ) -> None:
              """Keep staged text shards consistent with the offline catalog.

              Validate all shard IDs before pruning anything. Empty shards are
              removed because the runtime requires a non-empty pigs mapping.
              The canonical checkout and independent Felis copy are not touched.
              """
              plans = []
              seen: set[str] = set()
              for path in sorted(resource.glob("bundled_ex_copy*.json")):
                  if path.is_symlink() or not path.is_file():
                      raise ValueError(f"unsafe bundled EX authoring shard: {path.name}")
                  payload = _load_json(path)
                  pigs = payload.get("pigs") if isinstance(payload, dict) else None
                  if not isinstance(pigs, dict) or not pigs:
                      raise ValueError(f"invalid bundled EX authoring shard: {path.name}")
                  ids = set(pigs)
                  unknown = ids - source_ids
                  duplicates = ids & seen
                  if unknown or duplicates:
                      raise ValueError(
                          f"invalid bundled EX IDs in {path.name}: "
                          f"unknown={sorted(unknown)}, duplicate={sorted(duplicates)}"
                      )
                  seen.update(ids)
                  filtered = dict(payload)
                  filtered["pigs"] = {
                      pig_id: levels for pig_id, levels in pigs.items() if pig_id in selected
                  }
                  plans.append((path, filtered))
              if plans and selected - seen:
                  raise ValueError(
                      "bootstrap pigs missing explicit bundled EX: "
                      + ", ".join(sorted(selected - seen))
                  )
              for path, payload in plans:
                  if payload["pigs"]:
                      _write_json(path, payload, indent=2)
                  else:
                      path.unlink()


          '''
          anchor = 'def prepare_install_bundle(\n'
          prune_anchor = '    _write_json(pig_path, filtered_pigs, indent=4)'
          if text.count(anchor) != 1 or text.count(prune_anchor) != 1:
              raise SystemExit('Unexpected install-bundle anchors')
          text = text.replace(anchor, helper + anchor, 1)
          text = text.replace(prune_anchor, '    _prune_bundled_ex_copy(resource, selected, set(source_by_id))\n' + prune_anchor, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          anchor = '- 單張小豬卡的 `EX Lv.n` 徽章改為底部置中'
          if text.count(anchor) != 1:
              raise SystemExit('Unexpected release changelog anchor')
          entry = '- 修正穩定 Release／Marketplace 打包的 EX 資料一致性：裁剪為 22 隻離線基礎豬時，同步裁剪 bundled EX 分片並移除空分片，避免殘留 99 隻 authoring 令運行時拒絕載入並退回模板；新回歸以真實 canonical 文案驗證 22/22、110 級可直接載入、重複打包一致及 canonical／Felis 來源不變。\n\n'
          text = text.replace(anchor, entry + anchor, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('.github/release-v3.12.1.md')
          text = path.read_text(encoding='utf-8')
          anchor = '## 更新與維護\n'
          if text.count(anchor) != 1:
              raise SystemExit('Unexpected release-notes anchor')
          text = text.replace(anchor, '- 修正打包後的 EX 載入：22 隻離線基礎豬的 bundled EX 分片同步裁剪為 22/22、110 級，移除空分片，避免 99 隻來源與 22 隻安裝目錄不一致而整層退回模板；canonical 來源及 Felis 直讀層不變。\n\n' + anchor, 1)
          path.write_text(text.replace('後续', '後續'), encoding='utf-8')
          PY
      - name: Validate fixed packaging with real canonical EX data
        run: |
          python -m py_compile scripts/prepare_install_bundle.py tests/test_release_bootstrap_ex_copy.py
          python -m pytest -q tests/test_release_bootstrap_ex_copy.py
          python scripts/maintenance_contract.py release
          git diff --check
      - name: Commit tested packaging fix only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prepare_install_bundle.py CHANGELOG.md .github/release-v3.12.1.md
          git commit -m 'fix: retain consistent handcrafted EX in bootstrap release packages'
          git push origin "HEAD:${GITHUB_REF_NAME}"
