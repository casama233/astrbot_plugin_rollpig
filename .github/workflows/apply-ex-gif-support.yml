name: Apply EX GIF compatibility

on:
  push:
    branches:
      - agent/animated-gif-pigs
    paths:
      - .github/workflows/apply-ex-gif-support.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/animated-gif-pigs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/apply_ex_gif_support.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pre-commit
      - name: Validate focused GIF and EX coverage
        run: |
          python -m py_compile animated_images.py ex_admin_feature.py ex_public_source_feature.py
          pytest -q tests/test_animated_images.py tests/test_ex_admin_feature.py tests/test_ex_public_source_gif.py
          pre-commit run --all-files
      - name: Commit compatibility patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ex_admin_feature.py ex_public_source_feature.py tests/test_ex_admin_feature.py tests/test_ex_public_source_gif.py
          git commit -m "feat: preserve animated EX GIF assets"
          git push origin HEAD:agent/animated-gif-pigs
