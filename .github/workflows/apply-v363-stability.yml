name: Apply v3.6.3 stability hotfix

on:
  push:
    branches:
      - hotfix/v3.6.3-stability
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/v3.6.3-stability
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply guarded patch
        run: python .github/scripts/apply_v363_stability.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Compile source
        run: python -m compileall -q main.py legacy_main.py daily_report_core.py daily_report_feature.py gameplay_events.py ex_variants.py ex_variant_feature.py roast_reservations.py roast_reservation_feature.py permanent_collection_feature.py rollpig_core.py updater.py storage services renderers

      - name: Run v3.6.3 stability contracts
        run: pytest -q tests/test_v363_stability.py tests/test_permanent_collection_history.py tests/test_draw_service_pity.py tests/test_daily_report.py

      - name: Run full tests
        run: pytest -q

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Check diff
        run: git diff --check

      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_report_feature.py
          git diff --cached --check
          git commit -m "fix: make daily report sender dispatch reload-safe"
          git push origin HEAD:hotfix/v3.6.3-stability
