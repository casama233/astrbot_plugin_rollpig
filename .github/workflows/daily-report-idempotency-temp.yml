name: Temporary daily report delivery idempotency fix

on:
  push:
    branches:
      - fix/daily-report-at-most-once-delivery
    paths:
      - .github/workflows/daily-report-idempotency-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply at-most-once delivery hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          path = Path('daily_report_feature.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'import io\nimport json\n',
              'import io\nimport json\nimport os\n',
              1,
          )

          old = '''        self.daily_report_state_path = self.plugin_data_dir / "daily_report_state.json"\n        self.daily_report_avatar_dir = self.plugin_data_dir / "daily_report_avatars"\n        self.daily_report_avatar_dir.mkdir(parents=True, exist_ok=True)\n'''
          new = '''        self.daily_report_state_path = self.plugin_data_dir / "daily_report_state.json"\n        self.daily_report_avatar_dir = self.plugin_data_dir / "daily_report_avatars"\n        self.daily_report_delivery_claim_dir = (\n            self.plugin_data_dir / "daily_report_delivery_claims"\n        )\n        self.daily_report_avatar_dir.mkdir(parents=True, exist_ok=True)\n        self.daily_report_delivery_claim_dir.mkdir(parents=True, exist_ok=True)\n        self._daily_report_delivery_owner = uuid.uuid4().hex\n        self._prune_daily_report_delivery_claims()\n'''
          if old not in text:
              raise SystemExit('daily-report init anchor not found')
          text = text.replace(old, new, 1)

          old = '''    def _save_daily_report_state_locked(self) -> None:\n        self.save_json(self.daily_report_state_path, self.daily_report_state)\n\n    def _event_sender_id(self, event: AstrMessageEvent) -> str:\n'''
          new = '''    def _save_daily_report_state_locked(self) -> None:\n        self.save_json(self.daily_report_state_path, self.daily_report_state)\n\n    def _flush_daily_report_state_durable(self) -> None:\n        """Synchronously persist delivery-critical state, bypassing debounce windows."""\n        writer = getattr(self, "_daily_report_state_writer", None)\n        if writer is not None:\n            writer.flush(force=True)\n            return\n        with self._data_lock:\n            self.save_json(self.daily_report_state_path, self.daily_report_state)\n\n    def _daily_report_delivery_claim_path(\n        self, group_id: str, draw_date: str\n    ) -> Path:\n        digest = hashlib.sha256(\n            f"{draw_date}\\0{group_id}".encode("utf-8")\n        ).hexdigest()[:32]\n        return self.daily_report_delivery_claim_dir / f"{draw_date}-{digest}.json"\n\n    @staticmethod\n    def _read_daily_report_delivery_claim(path: Path) -> dict[str, Any]:\n        try:\n            payload = json.loads(path.read_text(encoding="utf-8"))\n        except (OSError, UnicodeError, json.JSONDecodeError):\n            return {"status": "unknown"}\n        return payload if isinstance(payload, dict) else {"status": "unknown"}\n\n    def _try_acquire_daily_report_delivery(\n        self, group_id: str, draw_date: str\n    ) -> tuple[Path | None, dict[str, Any]]:\n        """Atomically claim one group/date delivery across reloads and instances."""\n        path = self._daily_report_delivery_claim_path(group_id, draw_date)\n        payload = {\n            "schema_version": 1,\n            "status": "claimed",\n            "draw_date": str(draw_date),\n            "group_id": str(group_id),\n            "delivery_id": uuid.uuid4().hex,\n            "owner": str(getattr(self, "_daily_report_delivery_owner", "") or ""),\n            "pid": os.getpid(),\n            "claimed_at": int(time.time()),\n        }\n        try:\n            with path.open("x", encoding="utf-8") as handle:\n                json.dump(payload, handle, ensure_ascii=False, separators=(",", ":"))\n                handle.write("\\n")\n                handle.flush()\n                os.fsync(handle.fileno())\n        except FileExistsError:\n            return None, self._read_daily_report_delivery_claim(path)\n        return path, payload\n\n    @staticmethod\n    def _write_daily_report_delivery_claim(\n        path: Path, payload: dict[str, Any]\n    ) -> None:\n        temp_path = path.with_name(f".{path.name}.{uuid.uuid4().hex}.tmp")\n        try:\n            with temp_path.open("w", encoding="utf-8") as handle:\n                json.dump(payload, handle, ensure_ascii=False, separators=(",", ":"))\n                handle.write("\\n")\n                handle.flush()\n                os.fsync(handle.fileno())\n            os.replace(temp_path, path)\n        finally:\n            temp_path.unlink(missing_ok=True)\n\n    def _finalize_daily_report_delivery_claim(\n        self, path: Path, *, status: str, error: str = ""\n    ) -> dict[str, Any]:\n        payload = self._read_daily_report_delivery_claim(path)\n        payload.update(\n            status=str(status),\n            finalized_at=int(time.time()),\n            error=str(error or "")[:300],\n        )\n        self._write_daily_report_delivery_claim(path, payload)\n        return payload\n\n    @staticmethod\n    def _release_daily_report_delivery_claim(path: Path) -> None:\n        path.unlink(missing_ok=True)\n\n    def _prune_daily_report_delivery_claims(self) -> None:\n        claim_dir = getattr(self, "daily_report_delivery_claim_dir", None)\n        if not isinstance(claim_dir, Path) or not claim_dir.is_dir():\n            return\n        cutoff = time.time() - (self.DAILY_REPORT_STATE_KEEP_DAYS + 2) * 86400\n        for path in claim_dir.glob("*.json"):\n            try:\n                if path.stat().st_mtime < cutoff:\n                    path.unlink(missing_ok=True)\n            except OSError:\n                continue\n\n    def _event_sender_id(self, event: AstrMessageEvent) -> str:\n'''
          if old not in text:
              raise SystemExit('durable-state helper anchor not found')
          text = text.replace(old, new, 1)

          start = text.index('    async def _send_scheduled_daily_report(')
          end = text.index('    async def _daily_report_tick(', start)
          old_send = text[start:end]
          new_send = '''    async def _send_scheduled_daily_report(\n        self, group_id: str, draw_date: str\n    ) -> None:\n        async with self._daily_report_send_lock:\n            with self._data_lock:\n                group = dict(\n                    self.daily_report_state.get("groups", {}).get(str(group_id), {})\n                )\n                current_job = dict(\n                    self._job_bucket(draw_date).get(str(group_id), {})\n                )\n            if str(current_job.get("status") or "") in {"sent", "uncertain"}:\n                return\n            umo = str(group.get("umo") or "").strip()\n            if not umo:\n                raise RuntimeError("没有可用于主动推送的 unified_msg_origin")\n\n            sacrifice_id = ""\n            if self.daily_report_random_eat_enabled:\n                sacrifice_id = await self._apply_job_sacrifice(group_id, draw_date)\n\n            report = await self._build_daily_report_payload(\n                group_id, draw_date, sacrifice_id\n            )\n            if self.daily_report_skip_empty_groups and not int(\n                report.get("active_users", 0) or 0\n            ):\n                self._update_daily_report_job(\n                    draw_date,\n                    group_id,\n                    status="sent",\n                    sent_at=int(time.time()),\n                    skipped="empty",\n                )\n                await asyncio.to_thread(self._flush_daily_report_state_durable)\n                return\n\n            # Render and build the chain before taking the delivery claim. Failures\n            # here are known-safe to retry because no platform send has started.\n            output = await asyncio.to_thread(self.render_daily_report_image, report)\n            chain = MessageChain().file_image(str(output.absolute()))\n            claim_path: Path | None = None\n            delivery_uncertain = False\n            try:\n                claim_path, claim = await asyncio.to_thread(\n                    self._try_acquire_daily_report_delivery, group_id, draw_date\n                )\n                if claim_path is None:\n                    claim_status = str(claim.get("status") or "unknown")\n                    job_status = "sent" if claim_status == "sent" else "uncertain"\n                    self._update_daily_report_job(\n                        draw_date,\n                        group_id,\n                        status=job_status,\n                        delivery_id=str(claim.get("delivery_id") or ""),\n                        last_error=(\n                            "已有同群同日投递凭证，已抑制重复发送"\n                            if job_status == "sent"\n                            else "检测到既有投递凭证且结果不确定，已停止自动重发"\n                        ),\n                    )\n                    await asyncio.to_thread(self._flush_daily_report_state_durable)\n                    logger.warning(\n                        f"猪圈日报检测到既有投递凭证，已抑制重复发送："\n                        f"group={group_id} date={draw_date} status={claim_status}"\n                    )\n                    return\n\n                delivery_id = str(claim.get("delivery_id") or "")\n                self._update_daily_report_job(\n                    draw_date,\n                    group_id,\n                    status="sending",\n                    started_at=int(time.time()),\n                    attempts=int(current_job.get("attempts", 0) or 0) + 1,\n                    delivery_id=delivery_id,\n                    last_error="",\n                )\n                # This boundary is deliberately synchronous/durable. A reload after\n                # this point must observe the claimed/sending state before another\n                # scheduler is allowed to call send_message().\n                await asyncio.to_thread(self._flush_daily_report_state_durable)\n\n                try:\n                    sent = await self.context.send_message(umo, chain)\n                except asyncio.CancelledError:\n                    delivery_uncertain = True\n                    self._finalize_daily_report_delivery_claim(\n                        claim_path,\n                        status="uncertain",\n                        error="scheduler cancelled while platform delivery was in flight",\n                    )\n                    self._update_daily_report_job(\n                        draw_date,\n                        group_id,\n                        status="uncertain",\n                        last_error="自动推送在平台投递期间被中断；为避免双发，不会自动重试",\n                    )\n                    self._flush_daily_report_state_durable()\n                    raise\n                except Exception as exc:\n                    delivery_uncertain = True\n                    await asyncio.to_thread(\n                        self._finalize_daily_report_delivery_claim,\n                        claim_path,\n                        status="uncertain",\n                        error=str(exc),\n                    )\n                    self._update_daily_report_job(\n                        draw_date,\n                        group_id,\n                        status="uncertain",\n                        last_error=(\n                            "平台投递结果不确定；为避免双发，已停止自动重试："\n                            + str(exc)[:220]\n                        ),\n                    )\n                    await asyncio.to_thread(self._flush_daily_report_state_durable)\n                    logger.warning(\n                        f"猪圈日报平台投递结果不确定，已停止自动重试："\n                        f"group={group_id} date={draw_date} ({exc})"\n                    )\n                    return\n\n                if sent is False:\n                    # AstrBot explicitly reports that no matching platform accepted\n                    # the message. This is a known non-delivery, so releasing the\n                    # claim and retrying later is safe.\n                    await asyncio.to_thread(\n                        self._release_daily_report_delivery_claim, claim_path\n                    )\n                    claim_path = None\n                    self._update_daily_report_job(\n                        draw_date,\n                        group_id,\n                        status="pending",\n                        last_error="AstrBot 未找到匹配的消息平台",\n                    )\n                    await asyncio.to_thread(self._flush_daily_report_state_durable)\n                    raise RuntimeError("AstrBot 未找到匹配的消息平台")\n\n                await asyncio.to_thread(\n                    self._finalize_daily_report_delivery_claim,\n                    claim_path,\n                    status="sent",\n                )\n                self._update_daily_report_job(\n                    draw_date,\n                    group_id,\n                    status="sent",\n                    sent_at=int(time.time()),\n                    last_error="",\n                )\n                await asyncio.to_thread(self._flush_daily_report_state_durable)\n                logger.info(\n                    f"猪圈日报自动推送成功：group={group_id} date={draw_date} "\n                    f"delivery={delivery_id}"\n                )\n            finally:\n                if delivery_uncertain:\n                    asyncio.create_task(self._cleanup_temp_file_later(output))\n                else:\n                    output.unlink(missing_ok=True)\n\n'''
          text = text[:start] + new_send + text[end:]

          old = '''                status = str(job.get("status") or "pending")\n                if status == "sent":\n                    continue\n                if status == "sending":\n                    started = int(job.get("started_at", 0) or 0)\n                    if started and now_ts - started < self.DAILY_REPORT_RETRY_SECONDS:\n                        continue\n                    self._update_daily_report_job(\n                        date_key, group_id, status="pending"\n                    )\n                    status = "pending"\n'''
          new = '''                status = str(job.get("status") or "pending")\n                if status in {"sent", "uncertain"}:\n                    continue\n                if status == "sending":\n                    started = int(job.get("started_at", 0) or 0)\n                    if started and now_ts - started < self.DAILY_REPORT_RETRY_SECONDS:\n                        continue\n                    # A stale `sending` job may have reached the platform before a\n                    # reload/crash. Retrying it would trade a missing report for a\n                    # duplicate message, so fail closed and require a manual view.\n                    self._update_daily_report_job(\n                        date_key,\n                        group_id,\n                        status="uncertain",\n                        last_error="检测到中断的自动投递；为避免双发，已停止自动重试",\n                    )\n                    await asyncio.to_thread(self._flush_daily_report_state_durable)\n                    continue\n'''
          if old not in text:
              raise SystemExit('tick retry anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_daily_report_delivery_idempotency.py')
          test_path.write_text('''import json\nimport threading\nfrom pathlib import Path\n\nfrom daily_report_feature import DailyReportMixin\n\n\ndef _claim_harness(root: Path, owner: str):\n    harness = object.__new__(DailyReportMixin)\n    harness.daily_report_delivery_claim_dir = root\n    root.mkdir(parents=True, exist_ok=True)\n    harness._daily_report_delivery_owner = owner\n    return harness\n\n\ndef test_delivery_claim_is_exclusive_across_instances(tmp_path):\n    first = _claim_harness(tmp_path, "first")\n    second = _claim_harness(tmp_path, "second")\n\n    first_path, first_claim = first._try_acquire_daily_report_delivery(\n        "group-1", "2026-08-18"\n    )\n    assert first_path is not None\n    assert first_claim["status"] == "claimed"\n\n    second_path, existing = second._try_acquire_daily_report_delivery(\n        "group-1", "2026-08-18"\n    )\n    assert second_path is None\n    assert existing["delivery_id"] == first_claim["delivery_id"]\n\n    first._finalize_daily_report_delivery_claim(first_path, status="sent")\n    persisted = json.loads(first_path.read_text(encoding="utf-8"))\n    assert persisted["status"] == "sent"\n\n    third_path, third_existing = second._try_acquire_daily_report_delivery(\n        "group-1", "2026-08-18"\n    )\n    assert third_path is None\n    assert third_existing["status"] == "sent"\n\n\ndef test_definite_non_delivery_can_release_claim_for_retry(tmp_path):\n    harness = _claim_harness(tmp_path, "owner")\n    claim_path, _ = harness._try_acquire_daily_report_delivery(\n        "group-2", "2026-08-18"\n    )\n    assert claim_path is not None\n    harness._release_daily_report_delivery_claim(claim_path)\n    retry_path, _ = harness._try_acquire_daily_report_delivery(\n        "group-2", "2026-08-18"\n    )\n    assert retry_path is not None\n\n\ndef test_durable_flush_uses_debounced_writer_force_flush():\n    class Writer:\n        def __init__(self):\n            self.calls = []\n\n        def flush(self, *, force=False):\n            self.calls.append(force)\n            return True\n\n    harness = object.__new__(DailyReportMixin)\n    writer = Writer()\n    harness._daily_report_state_writer = writer\n    harness._flush_daily_report_state_durable()\n    assert writer.calls == [True]\n\n\ndef test_delivery_contract_claims_before_platform_send_and_never_retries_uncertain():\n    root = Path(__file__).resolve().parents[1]\n    feature = (root / "daily_report_feature.py").read_text(encoding="utf-8")\n    start = feature.index("    async def _send_scheduled_daily_report")\n    end = feature.index("    async def _daily_report_tick", start)\n    scheduled = feature[start:end]\n\n    assert scheduled.index("_try_acquire_daily_report_delivery") < scheduled.index(\n        "self.context.send_message(umo, chain)"\n    )\n    assert scheduled.index("_flush_daily_report_state_durable") < scheduled.index(\n        "self.context.send_message(umo, chain)"\n    )\n    assert 'status="uncertain"' in scheduled\n\n    tick = feature[end : feature.index("    async def _background_daily_report", end)]\n    assert 'status in {"sent", "uncertain"}' in tick\n    stale_start = tick.index('if status == "sending":')\n    stale_end = tick.index('if now_ts < int(job.get("due_at", 0) or 0):', stale_start)\n    stale = tick[stale_start:stale_end]\n    assert 'status="uncertain"' in stale\n    assert 'status="pending"' not in stale\n''', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          change = changelog.read_text(encoding='utf-8')
          old = '## 未發佈\n\n- 暫無。\n'
          new = '''## 未發佈\n\n- 修復豬圈日報在插件重載／投遞結果不確定時可能重複自動推送：同群同日新增跨實例原子 delivery claim，真正呼叫平台前同步持久化 `sending`；成功後持久化 `sent`，中斷／例外則標記 `uncertain` 並停止自動重試。只有 AstrBot 明確回報「未找到匹配平台」的確定未投遞才釋放 claim 允許稍後重試。\n'''
          if old not in change:
              raise SystemExit('CHANGELOG unreleased anchor not found')
          changelog.write_text(change.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/daily-report-idempotency-temp.yml
          git add daily_report_feature.py tests/test_daily_report_delivery_idempotency.py CHANGELOG.md
          python -m compileall -q daily_report_feature.py
          git diff --cached --check
          git commit -m "fix: make daily report auto-delivery at-most-once"
          git push origin HEAD:fix/daily-report-at-most-once-delivery
