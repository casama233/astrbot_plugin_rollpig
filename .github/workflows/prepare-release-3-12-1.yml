name: Prepare v3.12.1 release metadata

on:
  push:
    branches: [release/v3.12.1]
    paths: [.github/workflows/prepare-release-3-12-1.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Update only reviewed release metadata and documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          expected = {
              'metadata.yaml': '48b525af32679b39adbf352aa1252a69a8fecba9',
              'CHANGELOG.md': 'f439e5ed2eaba812c117a6f25f1ae376dd20b021',
              'README.md': 'df2438427cfdcbe31220cd0eecc901472c957078',
              'docs/OPERATIONS.md': '0982e2450da3a4cfe095d14fb7fb581473706026',
          }
          for name, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              if actual != sha:
                  raise SystemExit(f'Refusing to patch changed input: {name}')

          notes = Path('.github/release-v3.12.1.md')
          if not notes.is_file() or not notes.read_text(encoding='utf-8').startswith('# v3.12.1\n'):
              raise SystemExit('Missing matching release notes')

          metadata = Path('metadata.yaml')
          text = metadata.read_text(encoding='utf-8')
          text, changed = re.subn(r'^version: "3\.12\.0"$', 'version: "3.12.1"', text, flags=re.M)
          if changed != 1:
              raise SystemExit('Expected exactly one stable version field')
          metadata.write_text(text, encoding='utf-8')

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          if text.count('## 未發佈\n') != 1 or '\n## v3.12.1\n' in text:
              raise SystemExit('Unexpected changelog release structure')
          prefix, tail = text.split('## 未發佈\n', 1)
          entries, previous = tail.split('\n## v3.12.0\n', 1)
          if '底部置中' not in entries or 'EX' not in entries:
              raise SystemExit('Missing previously merged EX changes')
          intro = (
              '發布日期：2026-09-05\n\n'
              '依保守版本規則發布 patch，收錄 v3.12.0 後已合併的修正；'
              '本版包含 EX 底部徽章與成長提示、逐豬五級文案、更新恢復及維護閘門。'
              'AstrBot 最低版本聲明為 >=4.26.0；不改玩家資料 schema、插件身份或資源協議。\n\n'
          )
          result = (
              prefix + '## 未發佈\n\n- 暫無。\n\n## v3.12.1\n\n'
              + intro + entries.strip() + '\n\n## v3.12.0\n' + previous
          )
          if result.split('\n## v3.12.0\n', 1)[1] != previous:
              raise SystemExit('Historical changelog must remain unchanged')
          path.write_text(result, encoding='utf-8')

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          if text.count('4.24.2') != 2 or text.count('# 今日小豬 · 增強版\n') != 1:
              raise SystemExit('Unexpected README version anchors')
          text = text.replace('4.24.2', '4.26.0')
          text = text.replace(
              '# 今日小豬 · 增強版\n',
              '# 今日小豬 · 增強版\n\n'
              '目前版本：**v3.12.1** · EX 等級徽章置底、逐豬文案與安全更新修正。'
              '正式更新以 [GitHub 穩定 Release](https://github.com/casama233/astrbot_plugin_rollpig/releases/latest) 為準，不以 main 合併代替發版。\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('docs/OPERATIONS.md')
          text = path.read_text(encoding='utf-8')
          old_intro = '本文面向插件管理員與維護者，說明 v3.6.3 的身份遷移、資料存儲、資源同步、安全更新、備份與常見故障處理。'
          if text.count(old_intro) != 1:
              raise SystemExit('Unexpected operations introduction')
          text = text.replace(old_intro, old_intro.replace('v3.6.3', 'v3.12.1'), 1)
          anchor = '## 1. 版本與身份\n'
          if text.count(anchor) != 1:
              raise SystemExit('Unexpected operations release anchor')
          note = (
              '### v3.12.1 穩定版更新\n\n'
              '本版最低支援 AstrBot `>=4.26.0`。請從插件管理工作台的安全更新功能檢查穩定版本，'
              '確認取得 v3.12.1 後執行更新，完成後重載插件或重啟 AstrBot。'
              '新渲染器會將 EX Lv.n 固定在卡片底部；PNG 與 GIF 使用相同布局。\n\n'
              '`main` 合併只是原始碼更新。正式發版必須同步 metadata.yaml、Changelog 與 Release Notes，'
              '經 PR 檢查及合併後 main CI 通過，再由 Release workflow 對該精確提交建立新 tag、ZIP 和 SHA256SUMS。'
              '既有穩定版 tag 與 ZIP 不應覆寫，也不應繞過安全更新器安裝任意分支。\n\n'
              '本操作更新 AstrBot 插件程式，與 `rollpig-source upgrade` 更新公共源服務是兩件事；'
              '插件 v3.12.1 不表示公共源已發布新 resource_version，也不刪除玩家豬籍或本地 EX 資料。\n\n'
          )
          text = text.replace(anchor, anchor + '\n' + note, 1)
          path.write_text(text, encoding='utf-8')

          # Runtime versions are metadata-driven. Report any release literal
          # needing a separate review instead of silently rewriting Python.
          for source in sorted(Path('.').glob('*.py')):
              for number, line in enumerate(source.read_text(encoding='utf-8').splitlines(), 1):
                  if '3.12.0' in line:
                      print(f'REVIEW_VERSION_LITERAL {source}:{number}: {line.strip()}')
          print('Prepared 3.12.0 -> 3.12.1; previous changelog retained verbatim.')
          PY
      - name: Validate release and documentation contracts
        run: |
          python scripts/maintenance_contract.py release
          python scripts/maintenance_contract.py coverage
          python -m py_compile main.py updater.py renderers/pig_card.py renderers/animated_pig_card.py
          git diff --check
      - name: Commit release preparation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metadata.yaml CHANGELOG.md README.md docs/OPERATIONS.md
          git commit -m 'release: prepare v3.12.1 metadata and documentation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
