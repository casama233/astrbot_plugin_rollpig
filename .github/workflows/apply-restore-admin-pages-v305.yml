name: Apply restore admin pages v3.0.5

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-restore-admin-pages-v305
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'fix/restore-admin-pages-v3.0.5'
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-admin-pages-v3.0.5
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Apply recovery patch
        run: python scripts/apply_restore_admin_pages_v305.py

      - name: Validate modular frontend source syntax
        run: |
          node --check pages/pig-manager/ui-feedback.js
          node --check pages/pig-manager/ui-feedback-core.js
          node --check pages/pig-manager/ui-enterprise.js
          node --check pages/pig-manager/ui-analytics.js

      - name: Validate actual inline main module syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          page = Path('pages/pig-manager/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', page, re.S)
          if not match:
              raise SystemExit('main module not found')
          Path('/tmp/rollpig-admin-main.mjs').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/rollpig-admin-main.mjs

      - name: Compile source
        run: python -m compileall -q main.py rollpig_core.py updater.py storage services tests

      - name: Run full tests
        run: pytest -q

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Commit validated recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore admin page availability (v3.0.5)"
          git push origin HEAD:fix/restore-admin-pages-v3.0.5
