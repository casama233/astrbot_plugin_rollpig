name: TEMP command registration boundary refactor

on:
  push:
    branches:
      - refactor/command-registration-boundary

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: refactor/command-registration-boundary
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit

      - name: Apply command boundary refactor
        run: python scripts/_refactor_command_boundary.py

      - name: Compile source
        run: |
          python -m compileall -q \
            main.py legacy_main.py daily_report_feature.py ex_variant_feature.py \
            roast_reservation_feature.py gameplay_events.py services storage

      - name: Run full Python tests
        run: pytest -q

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Review generated diff
        run: |
          git status --short
          git diff --check
          git diff --stat

      - name: Commit verified refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/_refactor_command_boundary.py
          git add \
            main.py legacy_main.py daily_report_feature.py ex_variant_feature.py \
            roast_reservation_feature.py tests/test_command_registration_boundary.py \
            docs/ARCHITECTURE.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'refactor: move command registration to main entrypoint'
          git push origin HEAD:refactor/command-registration-boundary
