name: One-shot EX docs changelog

on:
  push:
    branches:
      - fix/ex-coverage-docs-contract
    paths:
      - .github/workflows/one-shot-ex-docs-changelog.yml

permissions:
  contents: write

jobs:
  apply-changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Add the unreleased EX documentation entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          heading = "## 未發佈\n"
          entry = "- EX 覆蓋率文件契約修正：重寫 `docs/EX-VARIANTS.md`，明確區分所有有效小豬可物化的 EX1～EX5 運行覆蓋、bundled 99/99 手寫文案與 Felis 22/34 精修文案；同步移除已刪除／禁止提交的舊 authoring 路徑與 `201/201 全手寫` 說法，改為現行 `scripts/build_resource_source.py` 及 Resource Source workflow 契約。"
          if entry not in text:
              if heading not in text:
                  raise SystemExit("CHANGELOG.md 缺少未發佈區")
              text = text.replace(heading, heading + "\n" + entry + "\n", 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit the one-shot update
        shell: bash
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: record EX coverage contract correction"
          git push origin "HEAD:${GITHUB_REF_NAME}"
