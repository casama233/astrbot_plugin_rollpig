name: Temporary report data clarity patch

on:
  push:
    branches:
      - fix/group-report-and-source-review-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_report_data_clarity.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pre-commit
      - name: Compile
        run: python -m compileall -q .
      - name: Test
        run: pytest -q
      - name: Pre-commit
        run: pre-commit run --all-files
      - name: Diff check
        run: git diff --check
      - name: Cleanup temporary files
        run: |
          rm -f scripts/apply_report_data_clarity.py
          rm -f .github/workflows/tmp-apply-report-data-clarity.yml
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: clarify daily report data and cache duplicate hints'
          git push origin HEAD:fix/group-report-and-source-review-hardening
