name: Patch roast render test harness

on:
  push:
    branches:
      - fix/roast-render-signature

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/roast-render-signature
          fetch-depth: 0
      - name: Align test harness signature
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_ex_growth_e2e.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def render_roast_image(\n        self, pig: dict, user_id: str, ai_copy: str | None = None\n    ) -> Path:\n        del user_id, ai_copy\n        self.last_roast_pig = dict(pig)\n        return Path("roast.png")\n'''
          new = '''    def render_roast_image(\n        self,\n        pig: dict,\n        user_id: str,\n        ai_copy: str | None = None,\n        local_copy: dict[str, str] | None = None,\n    ) -> Path:\n        del user_id, ai_copy, local_copy\n        self.last_roast_pig = dict(pig)\n        return Path("roast.png")\n'''
          if old not in text:
              raise SystemExit('expected old test harness signature not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_ex_growth_e2e.py
          git commit -m "test: align EX roast render harness signature"
          git push origin HEAD:fix/roast-render-signature
