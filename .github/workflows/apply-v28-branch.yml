name: One-shot v2.8 branch integration

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.event.issue.title == '[maintenance] apply v2.8 integration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixed target branch
        uses: actions/checkout@v4
        with:
          ref: agent/storage-abstraction-safe-updater-v2.8.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply integration patch
        run: python .github/scripts/apply_v28.py

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pre-commit
          python -m pip check

      - name: Validate integrated source
        run: |
          python -m compileall -q main.py rollpig_core.py updater.py storage
          pytest -q
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add storage abstraction and safe panel updater"
          git push origin HEAD:agent/storage-abstraction-safe-updater-v2.8.0

      - name: Close maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "v2.8 integration validated and committed."

      - name: Remove one-shot workflow from main
        if: success()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/apply-v28-branch.yml
          git commit -m "chore: remove one-shot v2.8 integration workflow"
          git push origin main
