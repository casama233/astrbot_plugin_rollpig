name: One-shot remediation changelog patch

on:
  push:
    branches:
      - remediation/quarantine-bundled-copy
    paths:
      - ".github/workflows/remediation-changelog-once.yml"

permissions:
  contents: write

jobs:
  patch-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/quarantine-bundled-copy
          fetch-depth: 1

      - name: Insert one remediation bullet and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "## 未發佈\n\n"
          bullet = "- 来源与资源隔离：撤下未经逐项 provenance 核实的 bundled 手写 EX 文案与外部 compatibility-floor 自动发布路径，EX 改用确定性安全基线，并以全新原创 roast-copy 包替换旧 bundled 文案。"
          if bullet not in text:
              if marker not in text:
                  raise SystemExit("CHANGELOG missing ## 未發佈 marker")
              text = text.replace(marker, marker + bullet + "\n", 1)
              path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/remediation-changelog-once.yml")
          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A CHANGELOG.md .github/workflows/remediation-changelog-once.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Document resource provenance quarantine"
          git push origin HEAD:remediation/quarantine-bundled-copy
