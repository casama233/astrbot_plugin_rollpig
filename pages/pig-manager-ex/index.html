<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>今日小猪 · EX 成长管理</title>
  <style>
    :root{--bg:#f4f1f5;--surface:#fffafd;--surface2:#f8f2f7;--ink:#2a2028;--muted:#786a74;--line:#e7dce4;--pink:#ea5d86;--violet:#816ed3;--green:#318f68;--danger:#bd3f5a;--shadow:0 20px 60px rgba(72,43,62,.09)}
    :root[data-theme="dark"]{--bg:#151216;--surface:#211a20;--surface2:#2a2128;--ink:#f8eef4;--muted:#b6a7b1;--line:#3b3038;--pink:#ff7699;--violet:#a695ef;--green:#65c99a;--danger:#ef7188;--shadow:0 24px 70px rgba(0,0,0,.28)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 0,color-mix(in srgb,var(--pink) 10%,transparent),transparent 36%),var(--bg);color:var(--ink);font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","PingFang SC",sans-serif}
    button,input,textarea{font:inherit;color:inherit}.shell{width:min(1500px,calc(100% - 36px));margin:auto;padding:24px 0 56px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:20px;padding:18px 20px;border:1px solid var(--line);border-radius:22px;background:color-mix(in srgb,var(--surface) 90%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
    .brand{display:flex;gap:13px;align-items:center}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#ffd3df,#f7e8ff);font-size:25px}.title{font-weight:850;font-size:18px;letter-spacing:-.03em}.sub{color:var(--muted);font-size:12px}.actions{display:flex;gap:9px}.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:750;cursor:pointer;background:linear-gradient(135deg,var(--pink),#c94f78);color:white;box-shadow:0 9px 22px color-mix(in srgb,var(--pink) 22%,transparent)}.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}.btn.danger{background:var(--danger)}.btn:disabled{opacity:.48;cursor:not-allowed}
    .hero{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:end;padding:27px 30px;margin-bottom:18px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(125deg,var(--surface),color-mix(in srgb,var(--violet) 9%,var(--surface)));box-shadow:var(--shadow)}.hero h1{margin:0;font-size:clamp(28px,4vw,50px);line-height:1.05;letter-spacing:-.05em}.hero h1 span{background:linear-gradient(100deg,var(--pink),var(--violet));background-clip:text;-webkit-background-clip:text;color:transparent}.hero p{max-width:760px;margin:12px 0 0;color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:110px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:11px}
    .layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}.panel{border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}.side{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column}.side-head{padding:18px;border-bottom:1px solid var(--line)}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface2);outline:none}.search:focus,textarea:focus{border-color:color-mix(in srgb,var(--pink) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 10%,transparent)}.pig-list{overflow:auto;padding:8px}.pig-row{width:100%;border:0;border-radius:14px;padding:11px 12px;background:transparent;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:7px;transition:.18s}.pig-row:hover{background:var(--surface2)}.pig-row.active{background:color-mix(in srgb,var(--pink) 11%,var(--surface2));box-shadow:inset 3px 0 var(--pink)}.pig-name{font-weight:780}.pig-id{color:var(--muted);font-size:10px}.count{min-width:26px;height:24px;display:grid;place-items:center;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:10px}.count.on{color:var(--pink);border-color:color-mix(in srgb,var(--pink) 38%,var(--line))}
    .editor{padding:22px}.empty{min-height:420px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.pig-header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}.pig-header h2{margin:0;font-size:26px;letter-spacing:-.035em}.base-copy{margin-top:8px;color:var(--muted);max-width:800px}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);font-size:10px;color:var(--muted)}.badge.local{color:var(--pink)}.badge.block{color:#d98534}
    .levels{display:grid;gap:14px}.level{border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(145deg,var(--surface),var(--surface2))}.level-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}.level-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:840}.lv{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,color-mix(in srgb,var(--pink) 17%,var(--surface)),color-mix(in srgb,var(--violet) 14%,var(--surface)));color:var(--pink)}.source{font-size:10px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:720;font-size:11px}.field small{color:var(--muted)}textarea{width:100%;min-height:78px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--surface);outline:none}.analysis{min-height:112px}.image-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.file{max-width:320px}.check{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}.level-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
    .effective{margin-top:12px;padding:13px;border:1px dashed var(--line);border-radius:16px;background:color-mix(in srgb,var(--surface2) 70%,transparent)}.preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.preview-head>div{display:grid;gap:2px}.preview-head b{font-size:12px}.preview-head span{color:var(--muted);font-size:10px}.preview-toggle{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:10px;font-weight:760;cursor:pointer}.preview-toggle.active{border-color:color-mix(in srgb,var(--pink) 55%,var(--line));color:var(--pink);background:color-mix(in srgb,var(--pink) 8%,var(--surface))}
    .preview-stage{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.preview-stage.comparing{grid-template-columns:repeat(2,minmax(0,1fr))}.chat-card{position:relative;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(155deg,color-mix(in srgb,var(--pink) 7%,var(--surface)),var(--surface));box-shadow:0 12px 30px color-mix(in srgb,var(--pink) 7%,transparent)}.chat-card-base{background:linear-gradient(155deg,color-mix(in srgb,var(--violet) 6%,var(--surface)),var(--surface))}.chat-media{position:relative;width:100%;aspect-ratio:16/10;display:grid;place-items:center;border:0;border-bottom:1px solid var(--line);padding:0;background:linear-gradient(145deg,color-mix(in srgb,var(--pink) 10%,var(--surface2)),var(--surface2));cursor:zoom-in;overflow:hidden}.chat-media:disabled{cursor:default}.chat-media img{width:100%;height:100%;object-fit:contain;padding:12px;display:none}.chat-media img.show{display:block}.effective-placeholder,.base-placeholder{padding:18px;text-align:center;color:var(--muted);font-size:11px}.chat-body{padding:14px 15px 16px}.chat-kicker{color:var(--pink);font-size:9px;font-weight:820;letter-spacing:.08em;text-transform:uppercase}.chat-card-base .chat-kicker{color:var(--violet)}.chat-body h3{margin:3px 0 6px;font-size:20px;line-height:1.15;letter-spacing:-.035em}.chat-description{margin:0;color:var(--ink);font-weight:720}.chat-analysis{margin-top:8px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.65}.chat-meta{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:flex-end;pointer-events:none}.chat-meta span{max-width:100%;padding:4px 7px;border-radius:8px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid color-mix(in srgb,var(--line) 72%,transparent);backdrop-filter:blur(8px);font-size:8px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.base-note{margin-top:8px;color:var(--muted);font-size:9px}
    .lightbox{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:28px;background:rgba(9,7,10,.82);backdrop-filter:blur(10px)}.lightbox.show{display:grid}.lightbox-card{position:relative;width:min(900px,94vw);max-height:90vh;display:grid;gap:10px;justify-items:center}.lightbox img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.45)}.lightbox-caption{color:#f7eaf1;font-size:12px;text-align:center}.lightbox-close{position:absolute;top:-14px;right:-14px;width:38px;height:38px;border:1px solid rgba(255,255,255,.25);border-radius:99px;background:#241a21;color:white;font-size:20px;cursor:pointer}
    .toast{position:fixed;left:50%;bottom:22px;z-index:50;transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:11px 16px;border-radius:13px;background:#241a21;color:white;box-shadow:0 14px 40px rgba(0,0,0,.25);transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}.loading{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(18,12,17,.28);backdrop-filter:blur(4px)}.loading.show{display:grid}.spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.25);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:relative;height:auto;max-height:360px}.hero{grid-template-columns:1fr}.stats{justify-content:flex-start}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
    @media(max-width:760px){.preview-stage.comparing{grid-template-columns:1fr}.preview-head{align-items:flex-start;flex-direction:column}.preview-toggle{width:100%}.chat-media{aspect-ratio:4/3}.lightbox{padding:16px}.lightbox-close{top:4px;right:4px}}

    /* Exact production-card preview: display server-rendered 800×800 card output. */
    .chat-card{padding:12px;background:var(--surface2)}.chat-card-base{background:color-mix(in srgb,var(--violet) 5%,var(--surface2))}.chat-rendered{width:100%;display:grid;place-items:center;border:0;padding:0;background:transparent;cursor:zoom-in}.chat-rendered:disabled{cursor:default}.chat-rendered img{display:none;width:min(100%,520px);height:auto;aspect-ratio:1;object-fit:contain;border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.18)}.chat-rendered img.show{display:block}.chat-runtime-meta{padding:9px 4px 1px;text-align:center;color:var(--muted);font-size:9px}.chat-card.preview-pending{border-color:color-mix(in srgb,#e99a50 55%,var(--line))}.chat-card.preview-pending .chat-runtime-meta{color:#e99a50}.preview-stage.comparing .chat-rendered img{width:min(100%,460px)}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><div class="logo">🐷</div><div><div class="title">EX 成长管理</div><div class="sub">本地差分优先 · 稀疏继承 · 不改抽卡身份与玩法</div></div></div>
      <div class="actions"><button class="btn ghost" id="reloadBtn">重新载入</button></div>
    </header>

    <section class="hero">
      <div><div class="sub">RollPig Growth Studio</div><h1>把重复抽到，真的变成<span>养熟</span>。</h1><p>每只小猪可为 EX Lv.1–5 分别覆盖描述、完整文案与图片。留空代表继承；实际生效预览会把稀疏差分解析后的文字和真正使用的图片一起展示出来。</p></div>
      <div class="stats"><div class="stat"><b id="pigCount">—</b><span>可编辑小猪</span></div><div class="stat"><b id="variantPigCount">—</b><span>已有本地 EX</span></div><div class="stat"><b id="variantLevelCount">—</b><span>本地差分层级</span></div></div>
    </section>

    <section class="layout">
      <aside class="panel side"><div class="side-head"><input class="search" id="search" placeholder="搜寻名称或 ID"></div><div class="pig-list" id="pigList"></div></aside>
      <section class="panel editor" id="editor"><div class="empty">从左侧选一只小猪开始编辑 EX 差分。</div></section>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <div class="lightbox" id="imageLightbox" aria-hidden="true"><div class="lightbox-card"><button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭">×</button><img id="lightboxImage" alt="图片放大预览"><div class="lightbox-caption" id="lightboxCaption"></div></div></div>
  <div class="loading" id="loading"><div class="spinner"></div></div>

<script type="module">
const bridge=window.AstrBotPluginPage;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const unwrap=r=>{const x=r?.data??r;if(x?.status==='error')throw new Error(x.message||'操作失败');return x?.data??x};
let csrf='',snapshot={items:[]},selectedId='',query='';
const theme=matchMedia('(prefers-color-scheme: dark)');const applyTheme=()=>document.documentElement.dataset.theme=theme.matches?'dark':'light';applyTheme();theme.addEventListener?.('change',applyTheme);
const toast=message=>{const el=$('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)};
const busy=value=>$('loading').classList.toggle('show',value);
async function get(path,params={}){return unwrap(await bridge.apiGet(path,params))}
async function post(path,payload={}){return unwrap(await bridge.apiPost(path,{...payload,__rollpig_csrf:csrf}))}
function sourceLabel(source){return({local:'本地 EX','local-base-block':'本地基础覆盖（未套公共 EX）',cloud:'云端 EX',bundled:'内建 EX',baseline:'安全基线',base:'基础内容'})[source]||source||'基础内容'}
function imageSourceLabel(source){return({local:'本地 EX 图片',cloud:'云端 EX 图片',bundled:'内建 EX 图片',baseline:'安全基线图片',base:'基础图片',pending:'未储存本地图片'})[source]||source||'基础图片'}
function filtered(){const q=query.trim().toLowerCase();return (snapshot.items||[]).filter(p=>!q||`${p.id} ${p.name}`.toLowerCase().includes(q))}
function renderList(){const rows=filtered();$('pigList').innerHTML=rows.length?rows.map(p=>{const count=Object.keys(p.local_levels||{}).length;return`<button class="pig-row ${p.id===selectedId?'active':''}" data-pig="${esc(p.id)}"><span><span class="pig-name">${esc(p.name)}</span><span class="pig-id">${esc(p.id)}</span></span><span class="count ${count?'on':''}">${count||'·'}</span></button>`}).join(''):'<div class="empty">没有符合条件的小猪</div>';document.querySelectorAll('[data-pig]').forEach(b=>b.onclick=()=>selectPig(b.dataset.pig))}
function effectiveHtml(e,p,level){return`<div class="effective"><div class="preview-head"><div><b>聊天卡效果预览</b><span>真实发送 renderer 成品；可展开 Base ↔ EX 对比</span></div><button class="preview-toggle" type="button" data-compare-toggle>Base ↔ EX 对比</button></div><div class="preview-stage" data-preview-stage><article class="chat-card chat-card-ex"><button class="chat-rendered" type="button" data-effective-zoom disabled><img data-effective-card-image alt="真实发送的 EX 聊天卡"><div class="effective-placeholder" data-effective-placeholder>正在生成真实发送卡片…</div></button><div class="chat-runtime-meta" data-effective-card-meta>真实发送 renderer · 正在生成</div></article><article class="chat-card chat-card-base" data-base-card hidden><button class="chat-rendered" type="button" data-base-zoom disabled><img data-base-card-image alt="真实发送的 Base 聊天卡"><div class="base-placeholder" data-base-placeholder>正在生成 Base 卡片…</div></button><div class="chat-runtime-meta" data-base-card-meta>Base · 真实发送 renderer</div></article></div></div>`}
function levelHtml(p,level){const local=p.local_levels?.[String(level)]||{},e=(p.effective||[]).find(x=>Number(x.level)===level)||{};return`<article class="level" data-level="${level}"><div class="level-head"><div class="level-title"><span class="lv">${level}</span><span>EX Lv.${level}</span></div><span class="source">${local.description||local.analysis||local.image?'有本地覆盖':'留空即继承'}</span></div><div class="grid"><div class="field"><label>短描述</label><textarea data-field="description" maxlength="120" placeholder="留空＝继承上一层">${esc(local.description||'')}</textarea></div><div class="field"><label>图片差分</label><div class="image-row"><input class="file" data-field="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><label class="check"><input data-field="remove-image" type="checkbox" ${local.image?'':'disabled'}> 移除目前图片</label></div><small>${local.image?`目前：${esc(local.image)}；下方会显示真正生效图片`:'尚未设定本地图片；下方会显示继承／基础图片'}</small></div><div class="field full"><label>完整文案</label><textarea class="analysis" data-field="analysis" maxlength="800" placeholder="留空＝继承上一层">${esc(local.analysis||'')}</textarea></div></div>${effectiveHtml(e,p,level)}<div class="level-actions"><button class="btn ghost" type="button" data-reset>重设此层</button><button class="btn" type="button" data-save>储存 EX Lv.${level}</button></div></article>`}
function renderEditor(){const p=(snapshot.items||[]).find(x=>x.id===selectedId);if(!p){$('editor').innerHTML='<div class="empty">从左侧选一只小猪开始编辑 EX 差分。</div>';return}const source=p.base_overridden?'<span class="badge block">基础资料已有本地覆盖</span>':'<span class="badge">基础资料来自目前图鉴</span>';$('editor').innerHTML=`<div class="pig-header"><div><h2>${esc(p.name)}</h2><div class="pig-id">${esc(p.id)}</div><div class="base-copy"><b>基础描述：</b>${esc(p.description)}<br><b>基础完整文案：</b>${esc(p.analysis)}</div></div><div>${source}</div></div><div class="levels">${[1,2,3,4,5].map(l=>levelHtml(p,l)).join('')}</div>`;document.querySelectorAll('.level').forEach(card=>bindLevel(card,p))}
async function fileData(input){const file=input.files?.[0];if(!file)return'';if(file.size>10*1024*1024)throw new Error('图片不能超过 10MB');return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=()=>reject(new Error('读取图片失败'));r.readAsDataURL(file)})}
function setEffectiveCard(card,{src='',source='base',variant_level=0}={}){const img=card.querySelector('[data-effective-card-image]'),placeholder=card.querySelector('[data-effective-placeholder]'),meta=card.querySelector('[data-effective-card-meta]'),zoom=card.querySelector('[data-effective-zoom]');if(src){img.src=src;img.classList.add('show');placeholder.hidden=true;zoom.disabled=false;zoom.dataset.zoomSrc=src}else{img.removeAttribute('src');img.classList.remove('show');placeholder.hidden=false;placeholder.textContent='真实发送卡片生成失败';zoom.disabled=true;delete zoom.dataset.zoomSrc}const lv=Number(variant_level||0);meta.textContent=`真实发送 renderer · ${sourceLabel(source)}${lv?` · 差分 Lv.${lv}`:''}`;card.classList.remove('preview-pending')}
function setBaseCard(card,{src=''}={}){const img=card.querySelector('[data-base-card-image]'),placeholder=card.querySelector('[data-base-placeholder]'),meta=card.querySelector('[data-base-card-meta]'),zoom=card.querySelector('[data-base-zoom]');if(src){img.src=src;img.classList.add('show');placeholder.hidden=true;zoom.disabled=false;zoom.dataset.zoomSrc=src}else{img.removeAttribute('src');img.classList.remove('show');placeholder.hidden=false;placeholder.textContent='Base 真实发送卡片生成失败';zoom.disabled=true;delete zoom.dataset.zoomSrc}meta.textContent='Base · 真实发送 renderer'}
function markPreviewPending(card,detail=''){const meta=card.querySelector('[data-effective-card-meta]');if(meta)meta.textContent=`有未保存修改${detail?` · ${detail}`:''}；保存后按真实发送样式重新生成`;card.classList.add('preview-pending')}
function openLightbox(src,caption=''){if(!src)return;$('lightboxImage').src=src;$('lightboxCaption').textContent=caption;$('imageLightbox').classList.add('show');$('imageLightbox').setAttribute('aria-hidden','false')}
function closeLightbox(){$('imageLightbox').classList.remove('show');$('imageLightbox').setAttribute('aria-hidden','true');$('lightboxImage').removeAttribute('src')}
async function loadEffectiveCard(card,p,{silent=true}={}){const level=Number(card.dataset.level);try{const d=await post('ex/variants/card',{id:p.id,level,effective:true});setEffectiveCard(card,{...d,src:`data:${d.mime_type||'image/png'};base64,${d.base64||''}`})}catch(e){setEffectiveCard(card,{src:'',source:'base'});if(!silent)toast(e.message)}}
async function loadBaseCard(card,p){if(card.dataset.baseLoaded==='1')return;const level=Number(card.dataset.level);try{const d=await post('ex/variants/card',{id:p.id,level,base:true});setBaseCard(card,{...d,src:`data:${d.mime_type||'image/png'};base64,${d.base64||''}`});card.dataset.baseLoaded='1'}catch(e){setBaseCard(card,{src:''});toast(e.message)}}
function bindPreviewControls(card,p){const toggle=card.querySelector('[data-compare-toggle]'),stage=card.querySelector('[data-preview-stage]'),base=card.querySelector('[data-base-card]'),effectiveZoom=card.querySelector('[data-effective-zoom]'),baseZoom=card.querySelector('[data-base-zoom]');toggle.onclick=async()=>{const opening=base.hidden;base.hidden=!opening;stage.classList.toggle('comparing',opening);toggle.classList.toggle('active',opening);toggle.textContent=opening?'收起 Base 对比':'Base ↔ EX 对比';if(opening)await loadBaseCard(card,p)};effectiveZoom.onclick=()=>openLightbox(effectiveZoom.dataset.zoomSrc||'',`${p.name} · EX Lv.${card.dataset.level}`);baseZoom.onclick=()=>openLightbox(baseZoom.dataset.zoomSrc||'',`${p.name} · Base`)}
function bindLevel(card,p){const level=Number(card.dataset.level),fileInput=card.querySelector('[data-field="image"]'),removeInput=card.querySelector('[data-field="remove-image"]');bindPreviewControls(card,p);loadEffectiveCard(card,p);fileInput.onchange=async()=>{try{const dataUrl=await fileData(fileInput);if(!dataUrl){await loadEffectiveCard(card,p);return}removeInput.checked=false;markPreviewPending(card,fileInput.files?.[0]?.name||'新图片')}catch(e){fileInput.value='';toast(e.message);await loadEffectiveCard(card,p,{silent:false})}};removeInput.onchange=async()=>{if(removeInput.checked){fileInput.value='';markPreviewPending(card,'移除图片')}else await loadEffectiveCard(card,p,{silent:false})};card.querySelectorAll('[data-field="description"],[data-field="analysis"]').forEach(field=>field.addEventListener('input',()=>markPreviewPending(card,'文案修改')));card.querySelector('[data-save]').onclick=async()=>{busy(true);try{const image=await fileData(fileInput);snapshot=await post('ex/variants/save',{id:p.id,level,description:card.querySelector('[data-field="description"]').value,analysis:card.querySelector('[data-field="analysis"]').value,image,remove_image:removeInput.checked});syncStats();renderList();renderEditor();toast(`已储存 ${p.name} EX Lv.${level}`)}catch(e){toast(e.message)}finally{busy(false)}};card.querySelector('[data-reset]').onclick=async()=>{if(!confirm(`重设「${p.name}」EX Lv.${level} 的所有本地差分吗？`))return;busy(true);try{snapshot=await post('ex/variants/delete',{id:p.id,level});syncStats();renderList();renderEditor();toast(`已重设 EX Lv.${level}`)}catch(e){toast(e.message)}finally{busy(false)}}}
function selectPig(id){selectedId=id;renderList();renderEditor();document.querySelector('.editor')?.scrollIntoView({behavior:'smooth',block:'start'})}
function syncStats(){$('pigCount').textContent=(snapshot.items||[]).length.toLocaleString();$('variantPigCount').textContent=Number(snapshot.local_variant_pigs||0).toLocaleString();$('variantLevelCount').textContent=Number(snapshot.local_variant_levels||0).toLocaleString()}
async function load(){if(!bridge?.apiGet)throw new Error('AstrBot Plugin Page Bridge 不存在');if(typeof bridge.ready==='function')await bridge.ready();const overview=await get('overview');csrf=String(overview.csrf_token||'');snapshot=await get('ex/variants');if(selectedId&&!snapshot.items.some(p=>p.id===selectedId))selectedId='';syncStats();renderList();renderEditor()}
$('lightboxClose').onclick=closeLightbox;$('imageLightbox').onclick=e=>{if(e.target===$('imageLightbox'))closeLightbox()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});
$('search').oninput=e=>{query=e.target.value;renderList()};$('reloadBtn').onclick=async()=>{busy(true);try{await load();toast('EX 资料已重新载入')}catch(e){toast(e.message)}finally{busy(false)}};
(async()=>{busy(true);try{await load()}catch(e){$('editor').innerHTML=`<div class="empty">EX 管理页载入失败：${esc(e.message)}</div>`;toast(e.message)}finally{busy(false)}})();
</script>
</body>
</html>
