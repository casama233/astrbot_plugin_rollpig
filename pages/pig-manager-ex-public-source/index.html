  <title>RollPig · 公共源投稿已迁移</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171318;color:#f8eef4}.card{width:min(680px,calc(100% - 36px));padding:28px;border:1px solid #44363f;border-radius:24px;background:#241c22;box-shadow:0 24px 80px #0006}h1{margin:0 0 12px;font-size:28px}p{color:#c8b8c2;line-height:1.7}.notice{padding:13px 15px;border:1px solid #684c5b;border-radius:14px;background:#2c2027}.btn{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:12px;background:#e95883;color:#fff;text-decoration:none;font-weight:750}

<body><main class="card">
  <div>Rights-aware submission v3</div>
  <h1>EX 公共源投稿已合并到主管理页</h1>
  <p class="notice">旧 envelope v2 投稿／“批准即发布”流程已经停用。新的投稿必须填写作者、权利人、HTTPS 来源、署名与再分发依据；管理员审核通过也不会自动发布。</p>
  <p>请回到「今日小猪」主管理页，在本地覆盖卡片点击「投稿公共源」。如果该小猪存在本地 EX 差分，权利资料窗口会允许把 EX 一并纳入同一次 rights-v3 审核。</p>
  <a class="btn" href="../pig-manager/">返回主管理页</a>
</main></body>
