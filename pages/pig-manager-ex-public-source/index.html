<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
  <title>今日小豬 · EX 公共源</title>
  <style>
    :root{--bg:#f3eff4;--surface:#fffafd;--surface2:#f8f2f7;--ink:#281f27;--muted:#786a74;--line:#e6dae3;--pink:#e95883;--violet:#7567cb;--green:#318d65;--amber:#c77a28;--danger:#bc405a;--shadow:0 18px 55px rgba(70,41,61,.09)}:root[data-theme="dark"]{--bg:#151216;--surface:#211a20;--surface2:#2a2228;--ink:#f8eef4;--muted:#b5a6b0;--line:#3c3038;--pink:#ff7699;--violet:#a496ee;--green:#66c99b;--amber:#efb15f;--danger:#ed7288;--shadow:0 20px 60px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,color-mix(in srgb,var(--violet) 10%,transparent),transparent 35%),var(--bg);color:var(--ink);font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","PingFang SC",sans-serif}.shell{width:min(1450px,calc(100% - 34px));margin:auto;padding:24px 0 56px}.head,.card{border:1px solid var(--line);background:var(--surface);border-radius:24px;box-shadow:var(--shadow)}.head{padding:26px 28px;margin-bottom:18px;display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.head h1{margin:4px 0 5px;font-size:clamp(28px,4vw,48px);letter-spacing:-.05em;line-height:1}.head h1 span{background:linear-gradient(110deg,var(--pink),var(--violet));background-clip:text;-webkit-background-clip:text;color:transparent}.head p{margin:0;color:var(--muted);max-width:780px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:760;cursor:pointer;background:linear-gradient(135deg,var(--pink),#c54b75);color:white}.btn.ghost{background:var(--surface2);border:1px solid var(--line);color:var(--ink)}.btn.approve{background:var(--green)}.btn.reject{background:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:minmax(300px,.72fr) minmax(0,1.28fr);gap:18px}.card{overflow:hidden}.card-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.card-head h2{margin:0;font-size:16px}.body{padding:17px}.search,select,textarea,input{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:var(--surface2);color:var(--ink);outline:none}.list{display:grid;gap:9px;max-height:630px;overflow:auto}.pig,.review{border:1px solid var(--line);border-radius:16px;padding:13px;background:linear-gradient(145deg,var(--surface),var(--surface2))}.pig-top,.review-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-weight:820}.id{font-size:10px;color:var(--muted)}.badge{display:inline-flex;padding:4px 8px;border:1px solid var(--line);border-radius:99px;font-size:10px;color:var(--muted)}.badge.ex{color:var(--pink);border-color:color-mix(in srgb,var(--pink) 35%,var(--line))}.levels{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.lv{font-size:10px;padding:4px 7px;border-radius:8px;background:color-mix(in srgb,var(--violet) 9%,var(--surface));border:1px solid var(--line)}.pig .btn{margin-top:11px;width:100%}.empty{padding:35px 18px;text-align:center;color:var(--muted)}.review{margin-bottom:12px}.copy{margin-top:10px;color:var(--muted);white-space:pre-wrap}.images{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.image-box{width:150px}.image-box img{width:150px;aspect-ratio:1;object-fit:cover;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}.image-box small{display:block;color:var(--muted);overflow-wrap:anywhere}.ex-block{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:11px}.ex-row{padding:8px 0;border-bottom:1px dashed var(--line)}.ex-row:last-child{border-bottom:0}.review-actions{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:12px}.review-actions input{min-width:0}.status-tabs{display:flex;gap:6px}.tab{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;color:var(--muted)}.tab.active{color:var(--pink);border-color:color-mix(in srgb,var(--pink) 35%,var(--line))}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);opacity:0;padding:11px 15px;border-radius:12px;background:#251a21;color:#fff;transition:.22s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:rgba(18,12,17,.48);display:none;place-items:center;padding:20px;z-index:30;backdrop-filter:blur(5px)}.modal.show{display:grid}.modal-card{width:min(600px,100%);border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:20px;box-shadow:0 24px 90px rgba(0,0,0,.32)}.modal-card h3{margin:0 0 8px}.modal-card p{color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:900px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.review-actions{grid-template-columns:1fr 1fr}.review-actions input{grid-column:1/-1}}
  </style>
</head>
<body><main class="shell">
  <header class="head"><div><div class="eyebrow">RollPig Public Source</div><h1>EX 投稿與<span>審核</span></h1><p>投稿 envelope v2 會把基礎小豬、基礎圖片、本地 EX 差分與被引用的 EX 圖片作為同一次審核提交；批准後由服務端在同一 candidate resource 中驗證並原子發布。</p></div><button class="btn ghost" id="reload">重新載入</button></header>
  <section class="grid">
    <article class="card"><div class="card-head"><h2>可投稿的本地 EX</h2><span class="badge" id="localCount">0</span></div><div class="body"><input class="search" id="search" placeholder="搜尋小豬名稱或 ID"><div style="height:12px"></div><div class="list" id="localList"></div></div></article>
    <article class="card"><div class="card-head"><h2>公共源審核隊列</h2><div class="status-tabs"><button class="tab active" data-status="pending">待審</button><button class="tab" data-status="approved">已批准</button><button class="tab" data-status="rejected">已拒絕</button></div></div><div class="body" id="reviewList"></div></article>
  </section>
</main><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modal-card"><h3>確認公開投稿</h3><p id="confirmText"></p><div class="modal-actions"><button class="btn ghost" id="cancel">取消</button><button class="btn" id="confirm">確認投稿</button></div></div></div>
<script type="module">
const bridge=window.AstrBotPluginPage,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let csrf='',local={items:[]},reviews=[],status='pending',query='',pendingPig='';const theme=matchMedia('(prefers-color-scheme:dark)'),apply=()=>document.documentElement.dataset.theme=theme.matches?'dark':'light';apply();theme.addEventListener?.('change',apply);const unwrap=r=>{const x=r?.data??r;if(x?.status==='error')throw new Error(x.message||'操作失敗');return x?.data??x};const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)};async function get(path,params={}){return unwrap(await bridge.apiGet(path,params))}async function post(path,p={}){return unwrap(await bridge.apiPost(path,{...p,__rollpig_csrf:csrf}))}
function levelsOf(p){return Object.entries(p.local_levels||{}).sort((a,b)=>Number(a[0])-Number(b[0]))}function renderLocal(){const q=query.trim().toLowerCase(),items=(local.items||[]).filter(p=>levelsOf(p).length&&(!q||`${p.name} ${p.id}`.toLowerCase().includes(q)));$('localCount').textContent=items.length;$('localList').innerHTML=items.length?items.map(p=>`<div class="pig"><div class="pig-top"><div><div class="name">${esc(p.name)}</div><div class="id">${esc(p.id)}</div></div><span class="badge ex">${levelsOf(p).length} 個 EX 差分</span></div><div class="levels">${levelsOf(p).map(([lv,v])=>`<span class="lv">Lv.${lv}${v.image?' · 圖':''}${v.description?' · 描述':''}${v.analysis?' · 文案':''}</span>`).join('')}</div><button class="btn" data-submit="${esc(p.id)}">連同 EX 投稿公共源</button></div>`).join(''):'<div class="empty">目前沒有可投稿的本地 EX 差分。</div>';document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>openConfirm(b.dataset.submit))}
function exRows(item){const levels=item.ex_variants?.pigs?.[item.pig_id]||{};return Object.entries(levels).sort((a,b)=>Number(a[0])-Number(b[0])).map(([lv,v])=>`<div class="ex-row"><b>EX Lv.${lv}</b>${v.description?`<div class="copy">描述：${esc(v.description)}</div>`:''}${v.analysis?`<div class="copy">文案：${esc(v.analysis)}</div>`:''}${v.image?`<div class="copy">圖片：${esc(v.image)}</div>`:''}</div>`).join('')}
async function baseImage(id,img){try{const d=await post('source/reviews/image',{submission_id:id});img.src=`data:${d.mime_type||'image/png'};base64,${d.base64||''}`}catch(e){img.alt=e.message}}async function variantImage(id,name,img){try{const d=await post('ex/source/reviews/variant-image',{submission_id:id,filename:name});img.src=`data:${d.mime_type||'image/png'};base64,${d.base64||''}`}catch(e){img.alt=e.message}}
function renderReviews(){if(!reviews.length){$('reviewList').innerHTML='<div class="empty">這個狀態目前沒有投稿。</div>';return}$('reviewList').innerHTML=reviews.map((r,i)=>`<section class="review"><div class="review-top"><div><div class="name">${esc(r.name)}</div><div class="id">${esc(r.pig_id)} · ${esc(r.submission_id)}</div></div><div><span class="badge">Envelope v${Number(r.submission_version||1)}</span> ${Number(r.ex_variant_levels||0)?`<span class="badge ex">${Number(r.ex_variant_levels)} 個 EX 差分</span>`:''}</div></div><div class="copy"><b>描述：</b>${esc(r.description)}<br><b>完整文案：</b>${esc(r.analysis)}</div>${Number(r.ex_variant_levels||0)?`<div class="ex-block">${exRows(r)}</div>`:''}<div class="images"><div class="image-box"><img data-base-image="${i}" alt="基礎圖片"><small>基礎圖片</small></div>${(r.variant_images||[]).map((n,j)=>`<div class="image-box"><img data-variant-image="${i}:${j}" alt="EX 圖片"><small>${esc(n)}</small></div>`).join('')}</div>${status==='pending'?`<div class="review-actions"><input data-note="${i}" placeholder="審核備註（可選）"><button class="btn approve" data-decision="${i}:approve">批准並發布</button><button class="btn reject" data-decision="${i}:reject">拒絕</button></div>`:`<div class="copy">審核備註：${esc(r.reviewer_note||'—')} ${r.resource_version?`· 資源版本 ${esc(r.resource_version)}`:''}</div>`}</section>`).join('');document.querySelectorAll('[data-base-image]').forEach(img=>{const i=Number(img.dataset.baseImage);baseImage(reviews[i].submission_id,img)});document.querySelectorAll('[data-variant-image]').forEach(img=>{const [i,j]=img.dataset.variantImage.split(':').map(Number);variantImage(reviews[i].submission_id,reviews[i].variant_images[j],img)});document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{const [i,decision]=b.dataset.decision.split(':'),r=reviews[Number(i)],note=document.querySelector(`[data-note="${i}"]`)?.value||'';if(decision==='approve'&&!confirm(`批准後「${r.name}」及其 EX 差分會一起發布到正式公共源。繼續？`))return;try{await post('source/reviews/decision',{submission_id:r.submission_id,decision,note});toast(decision==='approve'?'已批准並發布':'已拒絕');await loadReviews()}catch(e){toast(e.message)}})}
function openConfirm(id){const p=(local.items||[]).find(x=>x.id===id);if(!p)return;pendingPig=id;$('confirmText').textContent=`將公開傳送「${p.name}」的完整基礎資料、基礎圖片，以及 ${levelsOf(p).length} 個本地 EX 差分與其引用圖片。投稿後需由公共源管理員審核；是否繼續？`;$('modal').classList.add('show')}function closeConfirm(){pendingPig='';$('modal').classList.remove('show')}
async function loadReviews(){const d=await get('source/reviews',{status});reviews=d.items||d||[];renderReviews()}async function load(){if(typeof bridge?.ready==='function')await bridge.ready();const o=await get('overview');csrf=String(o.csrf_token||'');local=await get('ex/variants');renderLocal();await loadReviews()}
$('search').oninput=e=>{query=e.target.value;renderLocal()};$('cancel').onclick=closeConfirm;$('confirm').onclick=async()=>{const id=pendingPig;if(!id)return;try{const r=await post('ex/submit-public-source',{id,confirm:true});toast(r.message||'已提交公共源審核');closeConfirm();await loadReviews()}catch(e){toast(e.message)}};$('reload').onclick=()=>load().catch(e=>toast(e.message));document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{status=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('active',x===b));try{await loadReviews()}catch(e){toast(e.message)}});load().catch(e=>toast(e.message));
</script></body></html>
