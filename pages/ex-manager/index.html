<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>今日小豬 · EX 成長管理</title>
  <style>
    :root{--bg:#f4f1f5;--surface:#fffafd;--surface2:#f8f2f7;--ink:#2a2028;--muted:#786a74;--line:#e7dce4;--pink:#ea5d86;--violet:#816ed3;--green:#318f68;--danger:#bd3f5a;--shadow:0 20px 60px rgba(72,43,62,.09)}
    :root[data-theme="dark"]{--bg:#151216;--surface:#211a20;--surface2:#2a2128;--ink:#f8eef4;--muted:#b6a7b1;--line:#3b3038;--pink:#ff7699;--violet:#a695ef;--green:#65c99a;--danger:#ef7188;--shadow:0 24px 70px rgba(0,0,0,.28)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 0,color-mix(in srgb,var(--pink) 10%,transparent),transparent 36%),var(--bg);color:var(--ink);font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","PingFang SC",sans-serif}
    button,input,textarea{font:inherit;color:inherit}.shell{width:min(1500px,calc(100% - 36px));margin:auto;padding:24px 0 56px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:20px;padding:18px 20px;border:1px solid var(--line);border-radius:22px;background:color-mix(in srgb,var(--surface) 90%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
    .brand{display:flex;gap:13px;align-items:center}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#ffd3df,#f7e8ff);font-size:25px}.title{font-weight:850;font-size:18px;letter-spacing:-.03em}.sub{color:var(--muted);font-size:12px}.actions{display:flex;gap:9px}.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:750;cursor:pointer;background:linear-gradient(135deg,var(--pink),#c94f78);color:white;box-shadow:0 9px 22px color-mix(in srgb,var(--pink) 22%,transparent)}.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}.btn.danger{background:var(--danger)}.btn:disabled{opacity:.48;cursor:not-allowed}
    .hero{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:end;padding:27px 30px;margin-bottom:18px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(125deg,var(--surface),color-mix(in srgb,var(--violet) 9%,var(--surface)));box-shadow:var(--shadow)}.hero h1{margin:0;font-size:clamp(28px,4vw,50px);line-height:1.05;letter-spacing:-.05em}.hero h1 span{background:linear-gradient(100deg,var(--pink),var(--violet));background-clip:text;-webkit-background-clip:text;color:transparent}.hero p{max-width:760px;margin:12px 0 0;color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:110px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:11px}
    .layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}.panel{border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}.side{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column}.side-head{padding:18px;border-bottom:1px solid var(--line)}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface2);outline:none}.search:focus,textarea:focus{border-color:color-mix(in srgb,var(--pink) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 10%,transparent)}.pig-list{overflow:auto;padding:8px}.pig-row{width:100%;border:0;border-radius:14px;padding:11px 12px;background:transparent;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:7px;transition:.18s}.pig-row:hover{background:var(--surface2)}.pig-row.active{background:color-mix(in srgb,var(--pink) 11%,var(--surface2));box-shadow:inset 3px 0 var(--pink)}.pig-name{font-weight:780}.pig-id{color:var(--muted);font-size:10px}.count{min-width:26px;height:24px;display:grid;place-items:center;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:10px}.count.on{color:var(--pink);border-color:color-mix(in srgb,var(--pink) 38%,var(--line))}
    .editor{padding:22px}.empty{min-height:420px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.pig-header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}.pig-header h2{margin:0;font-size:26px;letter-spacing:-.035em}.base-copy{margin-top:8px;color:var(--muted);max-width:800px}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);font-size:10px;color:var(--muted)}.badge.local{color:var(--pink)}.badge.block{color:#d98534}
    .levels{display:grid;gap:14px}.level{border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(145deg,var(--surface),var(--surface2))}.level-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}.level-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:840}.lv{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,color-mix(in srgb,var(--pink) 17%,var(--surface)),color-mix(in srgb,var(--violet) 14%,var(--surface)));color:var(--pink)}.source{font-size:10px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:720;font-size:11px}.field small{color:var(--muted)}textarea{width:100%;min-height:78px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--surface);outline:none}.analysis{min-height:112px}.effective{margin-top:12px;padding:12px 13px;border:1px dashed var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface2) 70%,transparent)}.effective b{font-size:11px}.effective .copy{margin-top:6px;color:var(--muted);white-space:pre-wrap}.image-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.file{max-width:320px}.check{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}.level-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.preview{margin-top:10px;max-width:220px;border-radius:16px;border:1px solid var(--line);display:none}.preview.show{display:block}.toast{position:fixed;left:50%;bottom:22px;z-index:50;transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:11px 16px;border-radius:13px;background:#241a21;color:white;box-shadow:0 14px 40px rgba(0,0,0,.25);transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}.loading{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(18,12,17,.28);backdrop-filter:blur(4px)}.loading.show{display:grid}.spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.25);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:relative;height:auto;max-height:360px}.hero{grid-template-columns:1fr}.stats{justify-content:flex-start}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><div class="logo">🐷</div><div><div class="title">EX 成長管理</div><div class="sub">本地差分優先 · 稀疏繼承 · 不改抽卡身份與玩法</div></div></div>
      <div class="actions"><button class="btn ghost" id="reloadBtn">重新載入</button></div>
    </header>

    <section class="hero">
      <div><div class="sub">RollPig Growth Studio</div><h1>把重複抽到，真的變成<span>養熟</span>。</h1><p>每隻小豬可為 EX Lv.1–5 分別覆蓋描述、完整文案與圖片。留空代表繼承；實際生效預覽會把稀疏差分解析後的結果直接展示出來。</p></div>
      <div class="stats"><div class="stat"><b id="pigCount">—</b><span>可編輯小豬</span></div><div class="stat"><b id="variantPigCount">—</b><span>已有本地 EX</span></div><div class="stat"><b id="variantLevelCount">—</b><span>本地差分層級</span></div></div>
    </section>

    <section class="layout">
      <aside class="panel side"><div class="side-head"><input class="search" id="search" placeholder="搜尋名稱或 ID"></div><div class="pig-list" id="pigList"></div></aside>
      <section class="panel editor" id="editor"><div class="empty">從左側選一隻小豬開始編輯 EX 差分。</div></section>
    </section>
  </main>
  <div class="toast" id="toast"></div><div class="loading" id="loading"><div class="spinner"></div></div>

<script type="module">
const bridge=window.AstrBotPluginPage;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const unwrap=r=>{const x=r?.data??r;if(x?.status==='error')throw new Error(x.message||'操作失敗');return x?.data??x};
let csrf='',snapshot={items:[]},selectedId='',query='';
const theme=matchMedia('(prefers-color-scheme: dark)');const applyTheme=()=>document.documentElement.dataset.theme=theme.matches?'dark':'light';applyTheme();theme.addEventListener?.('change',applyTheme);
const toast=message=>{const el=$('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)};
const busy=value=>$('loading').classList.toggle('show',value);
async function get(path,params={}){return unwrap(await bridge.apiGet(path,params))}
async function post(path,payload={}){return unwrap(await bridge.apiPost(path,{...payload,__rollpig_csrf:csrf}))}
function sourceLabel(source){return({local:'本地 EX','local-base-block':'本地基礎覆蓋（未套公共 EX）',cloud:'雲端 EX',bundled:'內建 EX',base:'基礎內容'})[source]||source||'基礎內容'}
function filtered(){const q=query.trim().toLowerCase();return (snapshot.items||[]).filter(p=>!q||`${p.id} ${p.name}`.toLowerCase().includes(q))}
function renderList(){const rows=filtered();$('pigList').innerHTML=rows.length?rows.map(p=>{const count=Object.keys(p.local_levels||{}).length;return`<button class="pig-row ${p.id===selectedId?'active':''}" data-pig="${esc(p.id)}"><span><span class="pig-name">${esc(p.name)}</span><span class="pig-id">${esc(p.id)}</span></span><span class="count ${count?'on':''}">${count||'·'}</span></button>`}).join(''):'<div class="empty">沒有符合條件的小豬</div>';document.querySelectorAll('[data-pig]').forEach(b=>b.onclick=()=>selectPig(b.dataset.pig))}
function effectiveHtml(e){return`<div class="effective"><b>實際生效 · ${esc(sourceLabel(e.source))} · 差分來源 Lv.${Number(e.variant_level||0)||'基礎'}</b><div class="copy"><strong>描述：</strong>${esc(e.description||'（空）')}<br><strong>完整文案：</strong>${esc(e.analysis||'（空）')}${e.image?`<br><strong>圖片：</strong>${esc(e.image)}`:''}</div></div>`}
function levelHtml(p,level){const local=p.local_levels?.[String(level)]||{},e=(p.effective||[]).find(x=>Number(x.level)===level)||{};return`<article class="level" data-level="${level}"><div class="level-head"><div class="level-title"><span class="lv">${level}</span><span>EX Lv.${level}</span></div><span class="source">${local.description||local.analysis||local.image?'有本地覆蓋':'留空即繼承'}</span></div><div class="grid"><div class="field"><label>短描述</label><textarea data-field="description" maxlength="120" placeholder="留空＝繼承上一層">${esc(local.description||'')}</textarea></div><div class="field"><label>圖片差分</label><div class="image-row"><input class="file" data-field="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><label class="check"><input data-field="remove-image" type="checkbox" ${local.image?'':'disabled'}> 移除目前圖片</label>${local.image?`<button class="btn ghost" type="button" data-preview>預覽目前圖片</button>`:''}</div><small>${local.image?`目前：${esc(local.image)}`:'尚未設定本地圖片'}</small><img class="preview" data-preview-image alt="EX 差分預覽"></div><div class="field full"><label>完整文案</label><textarea class="analysis" data-field="analysis" maxlength="800" placeholder="留空＝繼承上一層">${esc(local.analysis||'')}</textarea></div></div>${effectiveHtml(e)}<div class="level-actions"><button class="btn ghost" type="button" data-reset>重設此層</button><button class="btn" type="button" data-save>儲存 EX Lv.${level}</button></div></article>`}
function renderEditor(){const p=(snapshot.items||[]).find(x=>x.id===selectedId);if(!p){$('editor').innerHTML='<div class="empty">從左側選一隻小豬開始編輯 EX 差分。</div>';return}const source=p.base_overridden?'<span class="badge block">基礎資料已有本地覆蓋</span>':'<span class="badge">基礎資料來自目前圖鑑</span>';$('editor').innerHTML=`<div class="pig-header"><div><h2>${esc(p.name)}</h2><div class="pig-id">${esc(p.id)}</div><div class="base-copy"><b>基礎描述：</b>${esc(p.description)}<br><b>基礎完整文案：</b>${esc(p.analysis)}</div></div><div>${source}</div></div><div class="levels">${[1,2,3,4,5].map(l=>levelHtml(p,l)).join('')}</div>`;document.querySelectorAll('.level').forEach(card=>bindLevel(card,p))}
async function fileData(input){const file=input.files?.[0];if(!file)return'';if(file.size>10*1024*1024)throw new Error('圖片不能超過 10MB');return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=()=>reject(new Error('讀取圖片失敗'));r.readAsDataURL(file)})}
function bindLevel(card,p){const level=Number(card.dataset.level);card.querySelector('[data-save]').onclick=async()=>{busy(true);try{const image=await fileData(card.querySelector('[data-field="image"]'));snapshot=await post('ex/variants/save',{id:p.id,level,description:card.querySelector('[data-field="description"]').value,analysis:card.querySelector('[data-field="analysis"]').value,image,remove_image:card.querySelector('[data-field="remove-image"]').checked});syncStats();renderList();renderEditor();toast(`已儲存 ${p.name} EX Lv.${level}`)}catch(e){toast(e.message)}finally{busy(false)}};card.querySelector('[data-reset]').onclick=async()=>{if(!confirm(`重設「${p.name}」EX Lv.${level} 的所有本地差分嗎？`))return;busy(true);try{snapshot=await post('ex/variants/delete',{id:p.id,level});syncStats();renderList();renderEditor();toast(`已重設 EX Lv.${level}`)}catch(e){toast(e.message)}finally{busy(false)}};const previewBtn=card.querySelector('[data-preview]');if(previewBtn)previewBtn.onclick=async()=>{try{const d=await post('ex/variants/image',{id:p.id,level}),img=card.querySelector('[data-preview-image]');img.src=`data:${d.mime_type||'image/png'};base64,${d.base64||''}`;img.classList.add('show')}catch(e){toast(e.message)}}}
function selectPig(id){selectedId=id;renderList();renderEditor();document.querySelector('.editor')?.scrollIntoView({behavior:'smooth',block:'start'})}
function syncStats(){$('pigCount').textContent=(snapshot.items||[]).length.toLocaleString();$('variantPigCount').textContent=Number(snapshot.local_variant_pigs||0).toLocaleString();$('variantLevelCount').textContent=Number(snapshot.local_variant_levels||0).toLocaleString()}
async function load(){if(!bridge?.apiGet)throw new Error('AstrBot Plugin Page Bridge 不存在');if(typeof bridge.ready==='function')await bridge.ready();const overview=await get('overview');csrf=String(overview.csrf_token||'');snapshot=await get('ex/variants');if(selectedId&&!snapshot.items.some(p=>p.id===selectedId))selectedId='';syncStats();renderList();renderEditor()}
$('search').oninput=e=>{query=e.target.value;renderList()};$('reloadBtn').onclick=async()=>{busy(true);try{await load();toast('EX 資料已重新載入')}catch(e){toast(e.message)}finally{busy(false)}};
(async()=>{busy(true);try{await load()}catch(e){$('editor').innerHTML=`<div class="empty">EX 管理頁載入失敗：${esc(e.message)}</div>`;toast(e.message)}finally{busy(false)}})();
</script>
</body>
</html>
